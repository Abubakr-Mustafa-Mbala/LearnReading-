    if (!store.s.hasExpl) return html`<p class="help langoff">Recording in English. To record in other languages, run the one-time database update (the blue box on your home screen).</p>`;
    return html`<div class="field langpick inline"><label for="elang">Recording in</label>
      <select id="elang" value=${lang || "en"} onChange=${e => {
        let v = e.target.value;
        if (v === "__add") {
          const name = (window.prompt("Which language? Type its name, for example Dutch.") || "").trim().replace(/\s+/g, " ").slice(0, 30);
          if (!name || /^english$/i.test(name)) { e.target.value = lang || "en"; return; }
          try { const L = JSON.parse(localStorage.getItem("rc.langs") || "[]"); if (!L.includes(name)) localStorage.setItem("rc.langs", JSON.stringify(L.concat(name))); } catch (x) {}
          v = name;
        }
        onLang(v);
      }}>${[...new Set(myLangs().concat(lang || "en"))].map(c => html`<option value=${c}>${langName(c)}${langCount(c) ? " · " + langCount(c) + " recorded" : ""}</option>`)}<option value="__add">+ Add a language…</option></select></div>`;
  }
  function LessonEditor({ s, ix, lesson, onBack, lang, onLang }) {
    const pst = usePlayer();
    const idx = s.lessons.findIndex(l => l.id === lesson.id);
    const [title, setTitle] = useState(lesson.title || "");
    const [note, setNote] = useState(lesson.note || "");
    const [board, setBoard] = useState(lesson.board || "");
    const [dirty, setDirty] = useState(false);
    const [importing, setImporting] = useState(false);
    const [split, setSplit] = useState(null);
    const importRef = useRef(null);
    async function importFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      setImporting(true);
      try {
        const all = tidyPassage(await fileToText(f));
        const words = all ? all.split(/\s+/).length : 0;
        if (!words) toast("No text found in that file. If it's a scanned book, type the page in instead.");
        else if (words > 220) setSplit({ all, words, parts: splitPassage(all, 150), name: String(f.name || "Book").replace(/\.[^.]+$/, "") });
        else { setBoard(all); setDirty(true); toast("Imported. Check it, then tap Save passage."); }
      } catch (err) { toast("Couldn't read that file. Try a .txt or a PDF that has real text in it."); }
      setImporting(false);
    }
    async function splitIntoLessons() {
      const sp = split;
      setSplit(null);
      try {
        const title = (lesson.title && lesson.title !== "New reading passage") ? lesson.title : sp.name;
        await update("lessons/" + lesson.id, { board: sp.parts[0], title: title + ", part 1", updatedAt: Date.now() });
        setBoard(sp.parts[0]); setDirty(false);
        const later = s.lessons.filter(l => (l.stage || 1) === 3 && (l.order || 0) > (lesson.order || 0));
        for (const l of later) await update("lessons/" + l.id, { order: (l.order || 0) + sp.parts.length - 1 });
        for (let i = 1; i < sp.parts.length; i++) {
          await rt.db.collection("lessons").doc().set({ stage: 3, order: (lesson.order || 0) + i, title: title + ", part " + (i + 1), note: "", board: sp.parts[i], explain: null, explainSecs: 0, updatedAt: Date.now() });
        }
        toast("Made " + sp.parts.length + " reading lessons.");
      } catch (err) { toast(errText(err)); }
    }
    const [stepOpen, setStepOpen] = useState(false);
    const [studio, setStudio] = useState(false);
    const [tile, setTile] = useState(null);
    const [armDel, setArmDel] = useState(false);
    useEffect(() => { if (!dirty) setBoard(lesson.board || ""); }, [lesson.board]);
    useEffect(() => { if (!armDel) return; const t = setTimeout(() => setArmDel(false), 3500); return () => clearTimeout(t); }, [armDel]);
    useEffect(() => () => player.stop(), []);
    const rowsOf = useMemo(() => parseBoard(lesson.board, lesson.stage === 3), [lesson.board]);
    const tiles = useMemo(() => uniqueTiles(rowsOf), [rowsOf]);
    let own = 0, bor = 0, miss = 0;
    for (const t of tiles) { const x = soundFor(ix, lesson.id, t.t); if (!x) miss++; else if (x.own) own++; else bor++; }
    const save = patch => update("lessons/" + lesson.id, Object.assign({ updatedAt: Date.now() }, patch)).catch(e => toast(errText(e)));

    async function saveBoard() {
      const clean = board.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
      await save({ board: clean });
      setBoard(clean); setDirty(false);
      toast("Board saved.");
    }
    async function changeStage(n) {
      const order = s.lessons.filter(l => (l.stage || 1) === n && l.id !== lesson.id).reduce((m, l) => Math.max(m, l.order || 0), 0) + 1;
      await save({ stage: n, order });
    }
    async function move(dir) {
      const same = s.lessons.filter(l => (l.stage || 1) === (lesson.stage || 1));
      const i = same.findIndex(l => l.id === lesson.id), j = i + dir;
      if (j < 0 || j >= same.length) { toast(dir < 0 ? "Already first in this stage." : "Already last in this stage."); return; }
      const arr = same.slice();
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      try { for (let k = 0; k < arr.length; k++) if ((arr[k].order || 0) !== k + 1) await update("lessons/" + arr[k].id, { order: k + 1 }); }
      catch (e) { toast(errText(e)); }
    }
    async function delLesson() {
      if (!armDel) { setArmDel(true); return; }
      const all = s.lessons, i = all.findIndex(l => l.id === lesson.id);
      const fallback = all[i + 1] || all[i - 1] || null;
      try {
        for (const st of s.students) if (st.unlocked === lesson.id) await update("students/" + st.id, { unlocked: fallback ? fallback.id : null });
        await remove("lessons/" + lesson.id);
        if (lesson.explain && rt.assets) { try { await rt.assets.delete(lesson.explain); } catch (e) {} }
        onBack();
      } catch (e) { toast(errText(e)); }
    }
    const stg = lesson.stage || 1;
    return html`<div class="page">
      <header class="rhead">
        <button class="iconbtn" onClick=${onBack} aria-label="Back to lessons"><${Ic.back}/></button>
        <div class="rtitle"><b>Lesson ${idx + 1}</b><small>Stage ${stg}${STAGES[stg] ? ": " + STAGES[stg] : ""}</small></div>
      </header>
      <div class="ed">
        <div class="field"><label for="lt">Title</label>
          <input id="lt" value=${title} onInput=${e => setTitle(e.target.value)} onBlur=${() => { const t = title.trim() || "Untitled lesson"; if (t !== (lesson.title || "")) save({ title: t }); }} autocomplete="off"/></div>
        <div class="field"><label for="ls">Stage</label>
          <select id="ls" value=${String(stg)} onChange=${e => changeStage(Number(e.target.value))}>
            ${[1, 2, 3, 4].map(n => html`<option key=${n} value=${String(n)}>Stage ${n}: ${STAGES[n]}</option>`)}
          </select></div>
        <div class="field"><label for="ln">What to explain</label>
          <textarea id="ln" rows="5" value=${note} onInput=${e => setNote(e.target.value)} onBlur=${() => { if (note !== (lesson.note || "")) save({ note }); }}></textarea>
          <p class="help">Only you see this.</p></div>
        <div class="card">
          <div class="lbl">Your explanation</div>
          ${onLang ? html`<${LangPick} lang=${lang} onLang=${onLang}/>` : null}
          <p class="help">They play this while looking at the board. Record with the board so your stick points at each tile as you talk, and add Your turn moments so they have to answer. Speak in the language they're most comfortable with.</p>
          <${ExplainRecorder} lesson=${lesson} pst=${pst} onStudio=${() => { player.stop(); setStudio(true); }}/>
          ${lesson.explain ? html`<${LessonVideoBtn} lesson=${lesson} number=${idx + 1}/>` : null}
        </div>
        <div class="card">
          <div class="lbl">The board</div>
          <p class="help">Tap a tile to hear it or record it. A tile recorded in one lesson is reused wherever the same letters appear, so you only record what's new.</p>
          <${Board} lesson=${lesson} number=${idx + 1} ix=${ix} pst=${pst} onTile=${t => setTile(t.t)} edit=${true}/>
          <div class="legend">
            <span><i class="lg"></i>${own} recorded here</span>
            <span><i class="lg bor"></i>${bor} reused</span>
            <span><i class="lg miss"></i>${miss} not recorded</span>
          </div>
          <button class="btn" disabled=${!tiles.length} onClick=${() => { player.stop(); setStepOpen(true); }}><${Ic.mic} size=${20}/>${miss ? "Record the " + miss + " missing, one by one" : "Re-record every tile, one by one"}</button>
        </div>
        <div class="card">
          <label class="lbl" for="bt">${lesson.stage === 3 ? "The passage" : "Edit the board"}</label>
          <textarea id="bt" class="boardtxt" rows=${Math.min(14, Math.max(4, board.split("\n").length + 1))} value=${board}
            onInput=${e => { setBoard(e.target.value); setDirty(true); }} spellcheck=${false} autocapitalize="off" autocomplete="off"></textarea>
          <p class="help">${lesson.stage === 3
            ? "Type or paste the text. Each new line starts a new paragraph. Every word becomes something he can tap to hear, using any recording of that word from earlier lessons."
            : "One row per line. Tiles are split by spaces. A line ending in . ? or ! stays whole as one sentence."}</p>
          ${lesson.stage === 3 ? html`<div class="row2">
            <button class="btn quiet" disabled=${importing} onClick=${() => importRef.current && importRef.current.click()}><${Ic.upload} size=${18}/>${importing ? "Reading the file…" : "Import a text or PDF file"}</button>
            <input ref=${importRef} type="file" accept=".txt,.pdf,text/plain,application/pdf" style="display:none" onChange=${importFile}/>
          </div>` : null}
          ${split ? html`<div class="card splitask">
            <b>That's ${split.words} words.</b>
            <p class="help">Long texts are easier in short sittings. Split it into ${split.parts.length} lessons of about 150 words, one after another?</p>
            <div class="row2">
              <button class="btn" onClick=${splitIntoLessons}>Split into ${split.parts.length} lessons</button>
              <button class="btn quiet" onClick=${() => { setBoard(split.all); setDirty(true); setSplit(null); }}>Keep it all here</button>
            </div>
          </div>` : null}
          <button class="btn sec" disabled=${!dirty} onClick=${saveBoard}>Save ${lesson.stage === 3 ? "passage" : "board"}</button>
        </div>
        <div class="row2">
          <button class="btn quiet" onClick=${() => move(-1)}><${Ic.up} size=${20}/>Move earlier</button>
          <button class="btn quiet" onClick=${() => move(1)}><${Ic.down} size=${20}/>Move later</button>
        </div>
        <button class=${"btn danger" + (armDel ? " arm" : "")} onClick=${delLesson}>${armDel ? "Tap again to delete this lesson" : "Delete lesson"}</button>
      </div>
      ${stepOpen ? html`<${StepRecorder} ix=${ix} lesson=${lesson} onClose=${() => setStepOpen(false)}/>` : null}
      ${studio ? html`<${ExplainStudio} ix=${ix} lesson=${lesson} number=${idx + 1} onClose=${() => setStudio(false)}/>` : null}
      ${tile ? html`<${TileSheet} ix=${ix} lesson=${lesson} lessons=${s.lessons} text=${tile} onClose=${() => setTile(null)}/>` : null}
    </div>`;
  }

  // ---------- live class controls ----------
  function StudentCall({ L }) {
    const C = useCall();
    const now = useTick(1000);
    const joined = C.phase !== "idle";
    // ring softly while the teacher is waiting and the student hasn't joined
    useEffect(() => {
      if (joined || L.away || !L.on) return;
      let n = 0;
      const ring = () => { if (document.visibilityState === "visible" && n++ < 20) { chime(true); try { navigator.vibrate && navigator.vibrate([200, 120, 200]); } catch (e) {} } };
      ring();
      const t = setInterval(ring, 3000);
      return () => clearInterval(t);
    }, [joined, L.away, L.on]);
    async function join() {
      try { await call.studentJoin(); }
      catch (e) { call.set({ error: "The microphone is blocked. Allow it for this site in your browser's settings (iPhone: Settings, Safari, Microphone), then tap the green phone again." }); }
    }
    return html`<div class="callcard">
      ${L.away ? html`<div class="away" role="status"><${Ic.wait} size=${22}/><span>Waiting for your teacher</span></div>` : null}
      ${!joined
        ? html`<button class="joinbtn" onClick=${join} aria-label="Join the class"><${Ic.phone} size=${34}/></button>`
        : html`<div class="incall">
            <span class="cstate">${C.phase === "connected" ? html`<${Ic.speaker} size=${22}/>` : html`<span class="spin"></span>`}<span>${C.since ? fmtDur((now - C.since) / 1000) : ""}</span></span>
            <button class=${"cbtn" + (C.muted || C.hushed ? " off" : "")} onClick=${() => call.toggleMute()} aria-label=${C.hushed ? "Muted by your teacher" : C.muted ? "Unmute" : "Mute"}>${C.muted || C.hushed ? html`<${Ic.micOff} size=${24}/>` : html`<${Ic.mic} size=${24}/>`}</button>
            ${C.hushed ? html`<span class="hushed" role="status">Muted by your teacher</span>` : null}
            <button class="cbtn hang" onClick=${() => call.leave(true)} aria-label="Leave the call"><${Ic.hangup} size=${26}/></button>
          </div>`}
      ${L.rec ? html`<span class="recbadge" aria-label="This class is being recorded"><span class="recdot"></span>REC</span>` : null}
      ${C.error ? html`<p class="err">${C.error}</p>` : null}
    </div>`;
  }

  async function resumeRecording() {
    const p = classRec.pendingResume();
    if (p && p.student === live.sid && !classRec.active) {
      await classRec.recover();
      await classRec.start({ title: p.title, lessonNo: p.lessonNo, student: p.student, part: (p.part || 1) + 1 });
    }
  }
  async function rejoinVoice() {
    try { await call.teacherStart(); await resumeRecording(); }
    catch (e) { call.set({ phase: "paused", error: "Your microphone is blocked. Allow it for this site in your browser's settings, then tap Rejoin voice." }); }
  }

  function ClassMembers({ s, studentId }) {
    const L = useLive();
    useCall();
    useTick(1000);
    const peerOf = id => (id === studentId ? call : (live.extra.get(id) || {}).peer);
    const hushedOf = id => { const q = peerOf(id); return !!(q && q.st && q.st.hushed); };
    const [adding, setAdding] = useState(false);
    const group = L.group || [], holder = L.holderSid || studentId;
    const inClass = [studentId].concat(group);
    const others = (s ? s.students : []).filter(x => !inClass.includes(x.id));
    const nameOf = id => { const x = s && s.students.find(y => y.id === id); return x ? x.name : "Student"; };
    const voiceOf = id => { if (id === studentId) return call.st.phase; const x = live.extra.get(id); return x && x.peer ? x.peer.st.phase : "waiting"; };
    return html`<div class="members">
      <div class="lprow wrap">
        ${inClass.map(id => html`<span class=${"mchip" + (voiceOf(id) === "connected" ? " on" : "")} key=${id}>
          <span class="pres small"></span>${nameOf(id)}
          ${L.mode === "write" ? html`<button class=${"mchalk" + (holder === id ? " on" : "")} onClick=${() => live.giveChalkTo(id)} aria-label=${"Chalk goes to " + nameOf(id)}>✏️</button>` : null}
          <button class=${"mmute" + (hushedOf(id) ? " on" : "")} onClick=${() => { const q = peerOf(id); if (q) q.hush(!hushedOf(id)); }} aria-label=${(hushedOf(id) ? "Let " : "Mute ") + nameOf(id) + (hushedOf(id) ? " talk again" : "")} aria-pressed=${hushedOf(id) ? "true" : "false"}>${hushedOf(id) ? "🔇" : "🎤"}</button>
          ${id !== studentId ? html`<button class="mx" onClick=${() => live.removeStudent(id)} aria-label=${"Take " + nameOf(id) + " out of the class"}>×</button>` : null}
        </span>`)}
        ${others.length ? html`<button class="tool" onClick=${() => setAdding(!adding)}><${Ic.plus} size=${16}/>Add a student</button>` : null}
      </div>
      ${adding ? html`<div class="addlist">${others.map(x => html`<button class="row" key=${x.id} onClick=${() => { live.addStudent(x.id); setAdding(false); }}>
        <span class="av" style=${"background:" + (x.color || COLORS[0])}>${initial(x.name)}</span><span>${x.name}</span></button>`)}</div>` : null}
    </div>`;
  }
  function ClassPanel({ s, who, lessonTitle, lessonNo, studentId }) {
    const L = useLive(), C = useCall(), R = useRec();
    const now = useTick(1000);
    const [armEnd, setArmEnd] = useState(false);
    const [slow, setSlow] = useState(false);
    useEffect(() => { if (!armEnd) return; const t = setTimeout(() => setArmEnd(false), 3500); return () => clearTimeout(t); }, [armEnd]);
    useEffect(() => {
      setSlow(false);
      if (C.phase !== "connecting" && C.phase !== "reconnecting") return;
      const t = setTimeout(() => setSlow(true), 20000);
      return () => clearTimeout(t);
    }, [C.phase]);
    const status = C.phase === "paused" ? "The class is still on. Tap Rejoin voice to talk again."
      : C.phase === "idle" ? "Your voice is off."
      : C.phase === "waiting" ? (L.here ? who + " has the class open. Waiting for them to tap the green phone." : "Waiting for " + who + " to open the class.")
      : C.phase === "connecting" ? "Connecting " + who + "…"
      : C.phase === "reconnecting" ? "Reconnecting…"
      : who + " is in the class" + (C.peerMuted ? " (muted)" : "") + ".";
    async function toggleRec() {
      if (R.on) await classRec.stop();
      else { try { await classRec.start({ title: lessonTitle, lessonNo, student: studentId }); } catch (e) { toast("Couldn't start recording on this phone."); } }
    }
    return html`<div class="livepanel">
      <div class="lprow">
        <span class="livetag"><span class="livedot"></span>Live ${L.startedAt ? fmtDur((now - L.startedAt) / 1000) : ""}</span>
        <div class="segsmall" role="group" aria-label="Which board">
          <button class=${L.mode !== "write" ? "on" : ""} onClick=${() => live.setMode("tiles")}>Lesson board</button>
          <button class=${L.mode === "write" ? "on" : ""} onClick=${() => live.setMode("write")}>Writing board</button>
        </div>
      </div>
      <p class="lpstatus"><span class=${"pres" + (C.phase === "connected" ? " on" : "")}></span><span>${status}</span></p>
      <${ClassMembers} s=${s} studentId=${studentId}/>
      ${C.error ? html`<p class="err">${C.error}</p>` : null}
      ${slow && call.relay === false ? html`<p class="help">Voice is slow to connect. Phones on mobile data usually need the free voice relay: add CF_TURN_KEY_ID and CF_TURN_API_TOKEN in Netlify, then redeploy.</p>` : null}
      <div class="lprow">
        ${C.phase === "paused" || C.phase === "idle"
          ? html`<button class="btn slim" onClick=${rejoinVoice}><${Ic.phone} size=${18}/>Rejoin voice</button>`
          : html`<button class=${"tool" + (C.muted ? " on" : "")} onClick=${() => call.toggleMute()}>${C.muted ? html`<${Ic.micOff} size=${16}/>Unmute me` : html`<${Ic.mic} size=${16}/>Mute me`}</button>`}
        <button class=${"tool" + (R.on ? " recon" : "")} onClick=${toggleRec} aria-pressed=${R.on ? "true" : "false"}><span class=${"recdot small" + (R.on ? "" : " idle")}></span>${R.on ? "Recording " + fmtDur((now - R.since) / 1000) : "Record"}</button>
        <button class=${"chip2" + (L.sound ? " on" : "")} onClick=${() => live.setSound(!L.sound)} aria-pressed=${L.sound ? "true" : "false"}><${Ic.speaker} size=${16}/>Sounds on their phone</button>
        <button class=${"btn danger slim" + (armEnd ? " arm" : "")} onClick=${() => (armEnd ? live.endClass() : setArmEnd(true))}>${armEnd ? "Tap again to end" : "End class"}</button>
      </div>
    </div>`;
  }

  function LiveFloat({ s, onReturn, above }) {
    const L = useLive(), C = useCall(), R = useRec();
    const now = useTick(1000);
    const st = s.students.find(x => x.id === L.sid);
    const bits = [L.startedAt ? fmtDur((now - L.startedAt) / 1000) : ""];
    if (R.on) bits.push("recording");
    if (C.phase === "paused" || C.phase === "idle") bits.push("voice off");
    else if (C.phase === "connected") bits.push("talking");
    return html`<div class=${"livefloat" + (above ? " above" : "")} role="status">
      <span class="livedot"></span>
      <span class="lfmain"><b>Class with ${st ? st.name : "your student"}</b><small>${bits.filter(Boolean).join(", ")}</small></span>
      <button class="btn slim" onClick=${onReturn}>Return</button>
    </div>`;
  }

  // ---------- recordings (kept on this phone) ----------
  function recFileName(r) {
    const d = new Date(r.startedAt), pad = n => String(n).padStart(2, "0");
    const ext = String(r.mime || "").indexOf("mp4") >= 0 ? "mp4" : "webm";
    return "reading-class-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + (r.lessonNo ? "-lesson-" + r.lessonNo : "") + (r.part > 1 ? "-part-" + r.part : "") + "." + ext;
  }
  function Recordings() {
    const R = useRec();
    const [talk, setTalk] = useState(false);
    const [maker, setMaker] = useState(false);
    const [list, setList] = useState(null);
    const [arm, setArm] = useState(null);
    const [busy, setBusy] = useState(null);
    const load = () => classRec.all("recs").then(l => setList(l.sort((a, b) => b.startedAt - a.startedAt))).catch(() => setList([]));
    useEffect(() => { load(); const t = setInterval(load, 3000); return () => clearInterval(t); }, []);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(null), 3500); return () => clearTimeout(t); }, [arm]);
    const cache = useRef(new Map());
    const [prog, setProg] = useState(null);
    async function fileOf(r) {
      if (cache.current.has(r.id)) return cache.current.get(r.id);
      const parts = await classRec.chunks(r.id);
      if (!parts.length) throw new Error("empty");
      let f = new File(parts, recFileName(r), { type: r.mime || "video/webm" });
      if (!r.fixed) {
        try {
          setProg(0);
          const blob = await fixVideo(f, v => setProg(Math.round(v * 100)));
          f = new File([blob], recFileName(r).replace(/\.\w+$/, blob.type.includes("mp4") ? ".mp4" : ".webm"), { type: blob.type });
        } catch (e) { /* if it can't be finished, the original still saves */ }
        setProg(null);
      }
      cache.current.set(r.id, f);
      return f;
    }
    async function download(r) {
      setBusy(r.id);
      try {
        const f = await fileOf(r), url = URL.createObjectURL(f), a = document.createElement("a");
        a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
      } catch (e) { toast("That recording is empty."); }
      setBusy(null);
    }
    async function share(r) {
      setBusy(r.id);
      try {
        const f = await fileOf(r);
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: r.title });
        else { toast("Sharing isn't available here, so it's downloading instead."); await download(r); }
      } catch (e) {
        if (e && e.name === "NotAllowedError") toast("The video is ready. Tap Share again.");   // the phone wants a fresh tap
        else if (!e || e.name !== "AbortError") toast("Couldn't share. Try Download.");
      }
      setBusy(null);
    }
    async function del(r) {
      if (arm !== r.id) { setArm(r.id); return; }
      await classRec.delRec(r.id); setArm(null); load();
    }
    const mb = n => (n / 1048576).toFixed(n > 10485760 ? 0 : 1) + " MB";
    return html`<section class="list">
      <button class="btn talkbtn" onClick=${() => setMaker(true)}>🎬 Video maker: YouTube, TikTok, Reels, Shorts</button>
      <button class="btn quiet talkbtn" onClick=${() => setTalk(true)}>🎙️ Talk about anything (a free board)</button>
      ${maker ? html`<${VideoMaker} onClose=${() => { setMaker(false); load(); }}/>` : null}
      ${talk ? html`<${TalkBoard} onClose=${() => setTalk(false)}/>` : null}
      ${list === null ? html`<div class="empty"><p>Loading…</p></div>`
        : !list.length ? html`<div class="empty"><p>No recordings yet. During a class, tap Record.</p></div>`
        : list.map(r => {
          const now = R.on && classRec.id === r.id;
          const note = now ? "Recording now" : r.status === "interrupted" ? "Stopped early, still usable" : "";
          return html`<div class="card recitem" key=${r.id}>
            <div class="rechead"><span class="num"><${Ic.film} size=${18}/></span>
              <span class="rowmain"><b>${(r.lessonNo ? "Lesson " + r.lessonNo + ": " : "") + (r.title || "Class")}${r.part > 1 ? ", part " + r.part : ""}</b>
              <small>${new Date(r.startedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}, ${fmtDur(r.secs)}, ${mb(r.size || 0)}${note ? ", " + note.toLowerCase() : ""}</small></span></div>
            ${now ? null : html`<div class="row2">
              <button class="btn" disabled=${busy === r.id} onClick=${() => download(r)}><${Ic.download} size=${18}/>${busy === r.id && prog != null ? "Getting it ready… " + prog + "%" : "Download"}</button>
              <button class="btn sec" disabled=${busy === r.id} onClick=${() => share(r)}><${Ic.send} size=${16}/>Share</button>
              <button class=${"btn danger" + (arm === r.id ? " arm" : "")} onClick=${() => del(r)}>${arm === r.id ? "Tap again to delete" : "Delete"}</button>
            </div>`}
            ${!now && r.srt ? html`<button class="btn quiet" onClick=${() => saveText(String(r.title || "video").replace(/[^\w]+/g, "-").slice(0, 40) + ".srt", r.srt)}>Subtitles file for YouTube (.srt)</button>` : null}
          </div>`;
        })}
      <div class="note">
        <b>About recordings</b>
        <p>Recordings stay on this phone until you download or delete them. Download saves the video to your phone's Downloads; Share sends it straight to another app, like YouTube or WhatsApp.</p>
        <p>The video shows the board and the lesson title, with both your voices. Ask your student before you post it.</p>
      </div>
    </section>`;
  }

  const UPDATE_SQL = ((document.getElementById("update-sql") || {}).textContent || "").trim() + "\n";
  function UpdateBanner() {
    const [copied, setCopied] = useState(false);
    async function copy() {
      try { await navigator.clipboard.writeText(UPDATE_SQL); setCopied(true); }
      catch (e) { toast("Couldn't copy. Open “Show the code” and copy it from there."); }
    }
    return html`<div class="update">
      <b>One-time database update</b>
      <p class="help">The stick, voice classes and recording need one small change in Supabase. Copy this, paste it into SQL Editor, tap Run, then reopen this page.</p>
      <button class=${"btn" + (copied ? " sec" : "")} onClick=${copy}>${copied ? html`<${Ic.tick} size=${18}/>Copied` : "Copy update code"}</button>
      <details><summary>Show the code</summary><textarea class="sqlbox" readonly value=${UPDATE_SQL}></textarea></details>
    </div>`;
  }

  function Teacher({ s, ix }) {
    const [tab, setTab] = useState("students");
    const [setupOpen, setSetupOpen] = useState(false);
    const [openStudent, setOpenStudent] = useState(null);
    const [focus, setFocus] = useState(null);
    const [tLang, setTLang] = useState(() => { try { return localStorage.getItem("rc.tlang") || "en"; } catch (e) { return "en"; } });
    const [openLesson, setOpenLesson] = useState(null);
    const [fresh, setFresh] = useState(false);
    const L = useLive();
    const resumed = useRef(false);
    useEffect(() => { window.scrollTo(0, 0); }, [tab, openStudent, openLesson]);
    useEffect(() => { classRec.recover(); }, []);
    useEffect(() => {
      if (resumed.current || !s.hasLive) return;
      resumed.current = true;
      const now = Date.now();
      const rows = (s.live || []).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      for (const r of rows) if (now - (r.updatedAt || 0) >= LIVE_STALE) remove("live/" + r.id).catch(() => {});
      const row = rows.find(r => now - (r.updatedAt || 0) < LIVE_STALE && s.students.some(x => x.id === r.id));
      if (row && !live.st.on) live.resume(row);
    }, [s.live, s.hasLive]);
    const toClass = () => { setOpenLesson(null); setFresh(false); setOpenStudent(L.sid); };
    const float = L.on && openStudent !== L.sid ? html`<${LiveFloat} s=${s} above=${!!openStudent} onReturn=${toClass}/>` : null;
    let body = null;
    if (openStudent) {
      const st = s.students.find(x => x.id === openStudent);
      const v = st ? viewOf(s, st.lang) : null;
      if (st) REC_LANG = st.lang || "en";
      if (st) body = html`<${Room} key=${st.id + (focus ? focus.msg : "")} s=${v.s} ix=${v.ix} student=${st} mode="teacher" startEditing=${fresh} focus=${focus} onBack=${() => { setOpenStudent(null); setFresh(false); setFocus(null); }}/>`;
    }
    if (!body && openLesson) {
      const v = viewOf(s, tLang), l = v.s.lessons.find(x => x.id === openLesson);
      REC_LANG = tLang;
      if (l) body = html`<${LessonEditor} key=${l.id + tLang} s=${v.s} ix=${v.ix} lesson=${l} lang=${tLang} onLang=${x => { setTLang(x); try { localStorage.setItem("rc.tlang", x); } catch (e) {} }} onBack=${() => setOpenLesson(null)}/>`;
    }
    if (!body) {
      const unreadTotal = s.msgs.filter(m => m.from === "student" && !m.seen).length;
      const tabBtn = (id, label, dot) => html`<button role="tab" aria-selected=${tab === id ? "true" : "false"} class=${tab === id ? "on" : ""} onClick=${() => setTab(id)}>${label}${dot ? html`<span class="segdot" aria-label="New messages"></span>` : null}</button>`;
      body = html`<div class="page">
        <header class="top">
          <div class="toprow"><h1>Reading class</h1><${PushBell}/><button class="iconbtn setupbtn" onClick=${() => setSetupOpen(true)} aria-label="Website setup check" title="Website setup check">⚙️</button></div>
          <div class="seg" role="tablist">${tabBtn("students", "Students", unreadTotal)}${tabBtn("lessons", "Lessons")}${tabBtn("recordings", "Recordings")}</div>
        </header>
        ${s.needsUpdate ? html`<${UpdateBanner}/>` : null}
        ${setupOpen ? html`<${SetupCheck} onClose=${() => setSetupOpen(false)}/>` : null}
        ${tab === "students" ? html`<${Questions} s=${s} onOpen=${(id, f) => { setFresh(false); setFocus(f); setOpenStudent(id); }}/><${StudentsList} s=${s} onOpen=${(id, isNew) => { setFresh(!!isNew); setFocus(null); setOpenStudent(id); }}/>`
          : tab === "lessons" ? (() => { const v = viewOf(s, tLang); REC_LANG = tLang; return html`<${LessonsList} s=${v.s} ix=${v.ix} onOpen=${setOpenLesson} lang=${tLang} onLang=${l => { setTLang(l); try { localStorage.setItem("rc.tlang", l); } catch (e) {} }}/>`; })()
          : html`<${Recordings}/>`}
        ${float ? html`<div class="floatspace"></div>` : null}
      </div>`;
    }
    return html`${body}${float}`;
  }

  function StudentHome({ s, ix }) {
    const st = s.students.find(x => x.id === s.sid);
    if (!st) return html`<${NoLink}/>`;
    if (!s.lessons.length) return html`<${Waiting}/>`;
    const v = viewOf(s, st.lang);
    return html`<${Room} key=${st.id} s=${v.s} ix=${v.ix} student=${st} mode="student"/>`;
  }

  function App() {
    const s = useStore();
    const ix = useMemo(() => buildSound(s.recs, s.lessons), [s.recs, s.lessons]);
    let body;
    if (s.phase === "loading") body = html`<${Loading}/>`;
    else if (s.phase === "setup") body = html`<${Setup}/>`;
    else if (s.phase === "signin") body = html`<${SignIn} s=${s}/>`;
    else if (s.phase === "nolink") body = html`<${NoLink} hint=${s.hint}/>`;
    else if (s.phase === "notteacher") body = html`<${NotTeacher} email=${s.email}/>`;
    else if (s.phase === "offline") body = html`<${Offline}/>`;
    else if (s.phase === "error") body = html`<${ErrorScreen} err=${s.err}/>`;
    else if (s.isOwner) body = html`<${Teacher} s=${s} ix=${ix}/>`;
    else body = html`<${StudentHome} s=${s} ix=${ix}/>`;
    return html`${body}<${VidJobPill}/>${s.toast ? html`<div class="toast" role="status" key=${s.toast.id}>${s.toast.text}</div>` : null}`;
  }

  window.__rc = { call, live, classRec, wb, tilePlayer, mixer };
  window.__kfArt = { kfBody, KF_CHARS, kfHit };
  window.__kfApi = { kfPress, kfStep, kfNew, kfSnd, kfAnn, annRec };
  window.__ink = { hitInk, inkGroup, straighten };
  window.__mux = { lessonVideo, fixVideo, loadMux, vidJob, awake, player, cleanVoice };
  window.__ui = { PushBell, SetupCheck, VidJobPill, html, render, store, Board, ExplainStudio, LiveTools, stageAt, buildSound, live, player, ClassroomPlayer, crAssets, CR_W, CR_H, TalkBoard, vidJob, VideoMaker, vmExport, vmDb, vmNew, vmAt, vmFrame, vmGeo, VM_LOOKS, vmStyle, vmSaveStyle, VMStyle, vmIntro, vmOutro, vmLook, vmElemSrc, vmPrepClip, vmWorld };
  window.__lang = { viewOf, saveExpl, saveTileRec, uploadBlob, set: l => { REC_LANG = l; }, get: () => REC_LANG, store };
  root.innerHTML = "";
  render(html`<${App}/>`, root);
  boot();
})();
</script>
</body>
</html>
