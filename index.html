    const [rec, setRec] = useState(false);
    const [t0, setT0] = useState(0);
    const now = useNow(rec);
    const recRef = useRef(null), st = useRef(null), fileRef = useRef(null), key = useRef("clip:" + uid());
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(st.current); }, []);
    async function start() {
      if (recorder.blocked) { fileRef.current && fileRef.current.click(); return; }
      player.stop();
      try { st.current = await recorder.open(); recRef.current = recorder.start(st.current); setRec(true); setT0(Date.now()); }
      catch (e) { toast("The microphone isn't available. Tap again to choose a recording file."); }
    }
    async function stop() {
      const r = recRef.current; recRef.current = null; setRec(false);
      if (!r) return;
      const out = await r.stop(); recorder.close(st.current); st.current = null;
      if (out.secs < 0.4 || !out.blob.size) { toast("Too short. Try again."); return; }
      onChange({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
    }
    async function onFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
      try { const out = await audioFromFile(f); onChange({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) }); }
      catch (err) { toast(errText(err, "That file couldn't be used.")); }
    }
    const on = pst.key === key.current;
    return html`<div class="clip">
      ${rec ? html`<button class="btn rec slim" onClick=${stop}><${Ic.stop} size=${16}/>Stop ${fmtDur((now - t0) / 1000)}</button>`
        : value ? html`
          <button class="btn quiet slim" onClick=${() => player.play(key.current, value.url)}>${on && pst.playing ? html`<${Ic.pause} size=${16}/>` : html`<${Ic.play} size=${16}/>`}${fmtDur(value.secs)}</button>
          <button class="btn quiet slim" onClick=${start}><${Ic.mic} size=${16}/>Again</button>
          <button class="iconbtn" onClick=${() => onChange(null)} aria-label="Remove recording"><${Ic.x} size=${18}/></button>`
        : html`<button class="btn sec slim" onClick=${start}><${Ic.mic} size=${16}/>${label || "Record"}</button>`}
      <input ref=${fileRef} type="file" accept="audio/*" style="display:none" onChange=${onFile}/>
    </div>`;
  }

  function HwEditor({ lesson, number, student, onClose }) {
    const pst = usePlayer();
    const [type, setType] = useState("spelling");
    const blank = t => ({ id: uid(), text: "", mode: t === "spelling" ? "write" : "type", rec: null });
    const [items, setItems] = useState(() => [blank("spelling")]);
    const [intro, setIntro] = useState(null);
    const [busy, setBusy] = useState(false);
    const upd = (id, patch) => setItems(xs => xs.map(x => (x.id === id ? Object.assign({}, x, patch) : x)));
    const ready = items.length > 0 && items.every(x => x.text.trim() || x.rec) && (type !== "spelling" || items.every(x => x.rec));
    const who = student.name || "your student";
    async function send() {
      if (!ready || busy) return;
      setBusy(true);
      player.stop();
      try {
        const out = [];
        for (const x of items) out.push({ id: x.id, text: x.text.trim(), mode: x.mode, audio: x.rec ? await uploadBlob(x.rec.blob) : null, secs: x.rec ? round1(x.rec.secs) : 0 });
        const introPath = intro ? await uploadBlob(intro.blob) : null;
        await sendRow({ student: student.id, lesson: lesson.id, from: "teacher", kind: "hw", hw: true, asset: introPath, secs: intro ? round1(intro.secs) : 0, text: JSON.stringify({ v: 1, type, items: out }) });
        toast(EX_TYPES[type] + " sent to " + who + ".");
        onClose();
      } catch (e) { toast(errText(e)); setBusy(false); }
    }
    const spell = type === "spelling";
    return html`<div class="full sheetpage" role="dialog" aria-label="New exercise">
      <div class="fhead"><span>New exercise, lesson ${number}</span><button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="sbody"><div class="ed">
        <div class="field"><span class="lbl">Type</span>
          <div class="segsmall">${Object.keys(EX_TYPES).map(k => html`<button key=${k} class=${type === k ? "on" : ""} onClick=${() => setType(k)}>${EX_TYPES[k]}</button>`)}</div>
          <p class="help">${spell ? "Record yourself saying each word. They hear it and write it underneath. The word you type stays hidden from them; it helps you mark."
            : type === "test" ? "Like homework, but it's saved in their book as a test with a score, so you can see how far they've come."
            : "Put what they should read on the board, and record what you want them to do."}</p>
        </div>
        <div class="field"><span class="lbl">Instructions for the whole exercise (optional)</span>
          <${RecClip} value=${intro} onChange=${setIntro} pst=${pst} label="Record instructions"/></div>
        ${items.map((x, i) => html`<div class="card qcard" key=${x.id}>
          <div class="qhead"><b>${spell ? "Word" : "Question"} ${i + 1}</b>${items.length > 1 ? html`<button class="iconbtn" onClick=${() => setItems(xs => xs.filter(y => y.id !== x.id))} aria-label="Remove"><${Ic.trash} size=${18}/></button>` : null}</div>
          <${RecClip} value=${x.rec} onChange=${v => upd(x.id, { rec: v })} pst=${pst} label=${spell ? "Record the word" : "Record the question"}/>
          <div class="field"><label for=${"qt" + x.id}>${spell ? "The word (only you see it)" : "On the board (optional)"}</label>
            <input id=${"qt" + x.id} value=${x.text} onInput=${e => upd(x.id, { text: e.target.value })} autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder=${spell ? "e.g. cat" : "e.g. c _ t"}/></div>
          <div class="field"><span class="lbl">They answer by</span>
            <div class="segsmall">${[["write", "Writing"], ["type", "Typing"], ["say", "Speaking"]].map(([k, l]) => html`<button key=${k} class=${x.mode === k ? "on" : ""} onClick=${() => upd(x.id, { mode: k })}>${l}</button>`)}</div></div>
        </div>`)}
        <button class="btn sec" onClick=${() => setItems(xs => xs.concat(blank(type)))}><${Ic.plus} size=${18}/>${spell ? "Add a word" : "Add a question"}</button>
        ${!ready ? html`<p class="help">${spell ? "Record every word before sending." : "Each question needs a recording or something on the board."}</p>` : null}
        <button class="btn" disabled=${!ready || busy} onClick=${send}>${busy ? "Sending…" : "Send to " + who}</button>
      </div></div>
    </div>`;
  }

  // Writing an answer in the exercise book, in blue pen.
  const PAD_W = 1000, PAD_H = 360;
  function InkPad({ strokes, onChange, readOnly, small }) {
    const wrapRef = useRef(null), cvRef = useRef(null), kRef = useRef(1);
    const sRef = useRef(strokes || []);
    sRef.current = strokes || [];
    const cbRef = useRef(onChange);
    cbRef.current = onChange;
    const paint = () => {
      const cv = cvRef.current; if (!cv) return;
      const ctx = cv.getContext("2d");
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const s of sRef.current) drawPts(ctx, s, kRef.current, 0);
    };
    useEffect(() => {
      const cv = cvRef.current, wrap = wrapRef.current;
      let lastW = 0;
      const fit = () => {
        const w = wrap.clientWidth; if (!w || w === lastW) return; lastW = w;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(w * PAD_H / PAD_W * dpr);
        cv.style.height = w * PAD_H / PAD_W + "px";
        kRef.current = cv.width / PAD_W;
        paint();
      };
      fit();
      const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
      if (ro) ro.observe(wrap);
      return () => { if (ro) ro.disconnect(); };
    }, []);
    useEffect(paint, [strokes]);
    useEffect(() => {
      if (readOnly) return;
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let cur = null;
      const units = e => { const r = cv.getBoundingClientRect(), u = PAD_W / r.width; return [Math.round((e.clientX - r.left) * u), Math.round((e.clientY - r.top) * u)]; };
      const add = (x, y) => {
        const p = cur.pts, n = p.length;
        if (n >= 2) { const dx = x - p[n - 2], dy = y - p[n - 1]; if (dx * dx + dy * dy < 9) return; }
        const from = n / 2; p.push(x, y); drawPts(ctx, cur, kRef.current, from);
      };
      const down = e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cur = { tool: "pen", w: 11, pts: [] }; const [x, y] = units(e); add(x, y); };
      const move = e => {
        if (!cur) return; e.preventDefault();
        const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        for (const ev of list && list.length ? list : [e]) { const [x, y] = units(ev); add(x, y); }
      };
      const up = () => { if (!cur) return; const s = cur; cur = null; cbRef.current(sRef.current.concat([s])); };
      cv.addEventListener("pointerdown", down); cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
      return () => { cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointermove", move); cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up); };
    }, [readOnly]);
    return html`<div class=${"inkpad" + (small ? " small" : "") + (readOnly ? " ro" : "")}>
      <div class="padwrap" ref=${wrapRef}><canvas ref=${cvRef}></canvas></div>
      ${!readOnly && !small ? html`<div class="padtools">
        <button class="mid" onClick=${() => cbRef.current(sRef.current.slice(0, -1))} aria-label="Undo"><${Ic.undo} size=${22}/></button>
        <button class="mid" onClick=${() => cbRef.current([])} aria-label="Clear"><${Ic.trash} size=${22}/></button>
      </div>` : null}
    </div>`;
  }

  function AnsVoice({ value, onChange, readOnly, pst }) {
    const [rec, setRec] = useState(false);
    const [t0, setT0] = useState(0);
    const now = useNow(rec);
    const recRef = useRef(null), st = useRef(null), key = useRef("ans:" + uid());
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(st.current); }, []);
    async function start() {
      player.stop();
      try { st.current = await recorder.open(); recRef.current = recorder.start(st.current); setRec(true); setT0(Date.now()); }
      catch (e) { toast("The microphone isn't available here."); }
    }
    async function stop() {
      const r = recRef.current; recRef.current = null; setRec(false);
      if (!r) return;
      const out = await r.stop(); recorder.close(st.current); st.current = null;
      if (out.secs < 0.5 || !out.blob.size) return;
      onChange({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
    }
    const on = pst.key === key.current;
    return html`<div class="ansvoice">
      ${rec ? html`<button class="big red" onClick=${stop} aria-label="Stop"><${Ic.stop} size=${30}/></button><span class="recind"><span class="recdot"></span>${fmtDur((now - t0) / 1000)}</span>`
        : value && value.url ? html`
          <button class="big" onClick=${() => player.play(key.current, value.url)} aria-label="Listen">${on && pst.playing ? html`<${Ic.pause} size=${30}/>` : html`<${Ic.play} size=${30}/>`}</button>
          <span class="vdur">${fmtDur(value.secs)}</span>
          ${!readOnly ? html`<button class="mid" onClick=${start} aria-label="Record again"><${Ic.mic} size=${22}/></button>` : null}`
        : readOnly ? html`<span class="help">No answer</span>`
        : html`<button class="big red" onClick=${start} aria-label="Record your answer"><${Ic.mic} size=${30}/></button>`}
    </div>`;
  }

  function AnswerView({ a, pst, small }) {
    if (!hasAnswer(a)) return html`<span class="noans">—</span>`;
    if (a.text && a.text.trim()) return html`<div class=${"ansline done" + (small ? " small" : "")}>${a.text}</div>`;
    if (a.strokes && a.strokes.length) return html`<${InkPad} strokes=${a.strokes} readOnly=${true} small=${small}/>`;
    const url = a.url || (a.audio ? srcFor(a.audio) : null);
    return small ? html`<span class="noans"><${Ic.speaker} size=${20}/></span>` : html`<${AnsVoice} value=${{ url, secs: a.secs }} readOnly=${true} pst=${pst}/>`;
  }
  const MarkIcon = ({ v, size }) => (v === true ? html`<span class="mk ok"><${Ic.tick} size=${size || 22} sw=${3}/></span>` : v === false ? html`<span class="mk no"><${Ic.x} size=${size || 22} sw=${3}/></span>` : null);

  // The student does an exercise, one question at a time. Answers are kept on the phone until sent.
  function HwRunner({ hw, msgs, student, ix, lessons, preview, onClose }) {
    const pst = usePlayer();
    const d = hwData(hw), items = d.items || [], spelling = d.type === "spelling";
    const ans = preview ? null : answersFor(hw.id, msgs);
    const mk = ans ? marksFor(ans.id, msgs) : null;
    const sc = scoreOf(mk);
    const done = !!ans;
    const draftKey = "rc.hw." + hw.id;
    const [answers, setAnswers] = useState(() => {
      if (done) return (hwData(ans).answers || []).map(a => Object.assign({}, a));
      try { return JSON.parse(localStorage.getItem(draftKey) || "[]") || []; } catch (e) { return []; }
    });
    const [i, setI] = useState(done ? -1 : hw.asset ? -2 : 0);
    const [how, setHow] = useState({});
    const [busy, setBusy] = useState(false);
    useEffect(() => {
      if (done || preview) return;
      try { localStorage.setItem(draftKey, JSON.stringify(answers.map(a => (a ? { text: a.text, strokes: a.strokes } : null)))); } catch (e) {}
    }, [answers]);
    useEffect(() => {
      if (i === -2 && hw.asset) player.play("hwi:" + hw.id, srcFor(hw.asset), true);
      else if (i >= 0 && items[i] && items[i].audio) player.play("hwq:" + hw.id + ":" + i, srcFor(items[i].audio), true);
      else player.stop();
    }, [i]);
    useEffect(() => () => { player.stop(); tilePlayer.stop(); }, []);
    const setA = (k, fn) => setAnswers(xs => { const n = xs.slice(); n[k] = Object.assign({}, n[k] || {}, typeof fn === "function" ? fn(n[k] || {}) : fn); return n; });
    const it = i >= 0 ? items[i] : null;
    const a = i >= 0 ? answers[i] || {} : {};
    let mode = it ? (it.mode === "say" ? "say" : how[i] || it.mode || "type") : null;
    if (done && it) mode = a.text ? "type" : a.strokes && a.strokes.length ? "write" : a.audio ? "say" : mode;
    const next = () => setI(k => (k < 0 ? 0 : k + 1 >= items.length ? -1 : k + 1));
    const prev = () => setI(k => (k === -1 ? items.length - 1 : k <= 0 ? (hw.asset ? -2 : 0) : k - 1));
    async function submit() {
      if (busy) return;
      setBusy(true);
      try {
        const out = [];
        for (let k = 0; k < items.length; k++) {
          const x = answers[k] || {}, o = { id: items[k].id };
          if (x.text && x.text.trim()) o.text = x.text.trim();
          if (x.strokes && x.strokes.length) o.strokes = x.strokes;
          if (x.blob) { o.audio = await uploadBlob(x.blob); o.secs = round1(x.secs); }
          out.push(o);
        }
        await sendRow({ student: student.id, lesson: hw.lesson, from: "student", kind: "hwans", text: JSON.stringify({ v: 1, hw: hw.id, answers: out }) });
        try { localStorage.removeItem(draftKey); } catch (e) {}
        chime(true);
      } catch (e) { toast(errText(e)); }
      setBusy(false);
    }
    const Dots = html`<div class="hwprog">${items.map((_, k) => html`<button key=${k} onClick=${() => setI(k)} aria-label=${"Question " + (k + 1)}
      class=${"pd" + (k === i ? " cur" : "") + (mk ? (mk.marks[k] === true ? " ok" : mk.marks[k] === false ? " no" : "") : hasAnswer(answers[k]) ? " done" : "")}>${k + 1}</button>`)}</div>`;
    let body;
    if (i === -2) {
      body = html`<div class="hwq"><div class="qboard tall">
        <${exIcon(d)} size=${44}/><div class="qtext small">${exLabel(d)}</div>
        <button class="big qplay" onClick=${() => player.play("hwi:" + hw.id, srcFor(hw.asset))} aria-label="Hear the instructions"><${Ic.speaker} size=${30}/></button>
      </div></div>`;
    } else if (i === -1) {
      body = html`<div class="hwsum">
        ${sc ? html`<div class="bigscore">${sc.right}/${sc.total}</div>` : done ? html`<div class="sentok"><${Ic.tick} size=${44} sw=${3}/></div>` : null}
        <div class="sumlist">${items.map((q, k) => html`<button class="sumrow" key=${k} onClick=${() => setI(k)}>
          <span class="num">${k + 1}</span>
          <span class="sumans"><${AnswerView} a=${answers[k]} pst=${pst} small=${true}/></span>
          ${mk ? html`<${MarkIcon} v=${mk.marks[k]}/>` : hasAnswer(answers[k]) ? null : html`<span class="noans">?</span>`}
        </button>`)}</div>
        ${preview ? html`<p class="help c">Preview: this is what they see.</p>` : null}
      </div>`;
    } else {
      const wrongSpell = mk && mk.marks[i] === false && it.text;
      body = html`<div class="hwq">
        <div class="qboard">
          <span class="bnum">${i + 1}</span>
          ${!spelling && it.text ? html`<div class="qtext">${it.text}</div>` : null}
          ${it.audio ? html`<button class="big qplay" onClick=${() => player.play("hwq:" + hw.id + ":" + i, srcFor(it.audio))} aria-label="Hear it again"><${Ic.speaker} size=${30}/></button>` : null}
          ${mk ? html`<div class="qmark"><${MarkIcon} v=${mk.marks[i]} size=${34}/></div>` : null}
        </div>
        <div class="ansbox">
          ${it.mode !== "say" && !done ? html`<div class="howsw">
            <button class=${mode === "write" ? "on" : ""} onClick=${() => setHow(h => Object.assign({}, h, { [i]: "write" }))} aria-label="Write with your finger"><${Ic.edit} size=${20}/></button>
            <button class=${mode === "type" ? "on" : ""} onClick=${() => setHow(h => Object.assign({}, h, { [i]: "type" }))} aria-label="Type"><${Ic.keys} size=${20}/></button>
          </div>` : null}
          ${mode === "type" ? html`<div class="ansline">${a.text || ""}${!done ? html`<span class="caret"></span>` : null}</div>` : null}
          ${mode === "write" ? html`<${InkPad} strokes=${a.strokes || []} onChange=${s => setA(i, { strokes: s })} readOnly=${done}/>` : null}
          ${mode === "say" ? html`<${AnsVoice} value=${a.url ? a : a.audio ? { url: srcFor(a.audio), secs: a.secs } : null} readOnly=${done} pst=${pst}
            onChange=${v => setA(i, v ? { blob: v.blob, secs: v.secs, url: v.url } : { blob: null, url: null })}/>` : null}
          ${wrongSpell ? html`<div class="correct" aria-label="Correct spelling">${it.text}</div>` : null}
        </div>
      </div>`;
    }
    const typing = it && mode === "type" && !done;
    return html`<div class="full hwrun" role="dialog" aria-label=${exLabel(d)}>
      <div class="fhead">
        <span class="hwtitle"><${exIcon(d)} size=${20}/></span>
        ${Dots}
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button>
      </div>
      <div class="sbody">${body}</div>
      <div class="hwnav">
        <button class="big grey" onClick=${prev} disabled=${i === -2 || (i === 0 && !hw.asset)} aria-label="Back"><${Ic.back} size=${28}/></button>
        <div class="grow"></div>
        ${i === -1
          ? (!done && !preview ? html`<button class="big send" onClick=${submit} disabled=${busy} aria-label="Send to your teacher">${busy ? html`<span class="spin"></span>` : html`<${Ic.send} size=${28}/>`}</button>` : html`<button class="big" onClick=${onClose} aria-label="Close"><${Ic.tick} size=${28} sw=${2.6}/></button>`)
          : html`<button class="big" onClick=${next} aria-label="Next"><${Ic.next} size=${28}/></button>`}
      </div>
      ${typing ? html`<${LetterKeys} ix=${ix} lessons=${lessons} onDone=${next}
        onKey=${ch => setA(i, x => ({ text: ((x.text || "") + ch).slice(0, 40) }))}
        onBack=${() => setA(i, x => ({ text: (x.text || "").slice(0, -1) }))}/>` : null}
    </div>`;
  }

  // The teacher marks answers in red pen. Typed spellings are pre-marked; handwriting and speech are up to you.
  function HwReview({ ans, msgs, onClose }) {
    const pst = usePlayer();
    const ad = hwData(ans), hw = msgs.find(m => m.id === ad.hw), d = hwData(hw), items = d.items || [];
    const answers = ad.answers || [];
    const prev = marksFor(ans.id, msgs);
    const auto = k => {
      const it = items[k] || {}, a = answers[k] || {};
      if (a.text && it.text) return a.text.trim().toLowerCase() === it.text.trim().toLowerCase();
      return null;
    };
    const [marks, setMarks] = useState(() => (prev && Array.isArray(prev.marks) ? prev.marks.slice() : items.map((_, k) => auto(k))));
    const [busy, setBusy] = useState(false);
    const setM = (k, v) => setMarks(ms => { const n = ms.slice(); n[k] = n[k] === v ? null : v; return n; });
    async function send() {
      setBusy(true);
      try {
        await sendRow({ student: ans.student, lesson: ans.lesson, from: "teacher", kind: "hwmark", text: JSON.stringify({ v: 1, ans: ans.id, marks }) });
        toast("Marks sent.");
        onClose();
      } catch (e) { toast(errText(e)); setBusy(false); }
    }
    const sc = scoreOf({ marks });
    useEffect(() => () => player.stop(), []);
    return html`<div class="full sheetpage" role="dialog" aria-label="Mark the answers">
      <div class="fhead"><span>Mark: ${exLabel(d)}</span><button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="sbody"><div class="ed">
        ${!hw ? html`<p class="help">The exercise these answers belong to was deleted.</p>` : null}
        ${items.map((it, k) => html`<div class="card revrow" key=${k}>
          <div class="qhead"><b>${d.type === "spelling" ? "Word" : "Question"} ${k + 1}</b>
            ${it.text ? html`<span class="expect">${it.text}</span>` : null}
            ${it.audio ? html`<button class="iconbtn" onClick=${() => player.play("rq:" + k, srcFor(it.audio))} aria-label="Hear the question"><${Ic.speaker} size=${20}/></button>` : null}</div>
          <${AnswerView} a=${answers[k]} pst=${pst}/>
          <div class="markrow">
            <button class=${"markbtn ok" + (marks[k] === true ? " on" : "")} onClick=${() => setM(k, true)} aria-label="Right"><${Ic.tick} size=${22} sw=${3}/></button>
            <button class=${"markbtn no" + (marks[k] === false ? " on" : "")} onClick=${() => setM(k, false)} aria-label="Wrong"><${Ic.x} size=${22} sw=${3}/></button>
          </div>
        </div>`)}
        <button class="btn" disabled=${busy || !hw} onClick=${send}>${busy ? "Sending…" : "Send marks" + (sc ? " (" + sc.right + "/" + sc.total + ")" : "")}</button>
      </div></div>
    </div>`;
  }

  function HwCard({ m, msgs, teacher, onOpen }) {
    const d = hwData(m), items = d.items || [];
    const ans = answersFor(m.id, msgs), mk = ans ? marksFor(ans.id, msgs) : null, sc = scoreOf(mk);
    return html`<button class=${"hwcard" + (d.type === "test" ? " test" : "")} onClick=${onOpen}>
      <span class="hwtop"><${exIcon(d)} size=${22}/><b>${exLabel(d)}</b><span class="hwn">${items.length}</span></span>
      <span class="hwdots">${items.map((_, k) => html`<i key=${k} class=${mk ? (mk.marks[k] === true ? "ok" : mk.marks[k] === false ? "no" : "") : ans ? "done" : ""}></i>`)}</span>
      <span class="hwfoot">${sc ? html`<span class="score">${sc.right}/${sc.total}</span>`
        : ans ? html`<${Ic.tick} size=${18} sw=${2.6}/>${teacher ? html`<span>Answered: tap to mark</span>` : null}`
        : teacher ? html`<span>Not done yet</span>` : html`<span class="hwgo"><${Ic.edit} size=${22}/></span>`}</span>
    </button>`;
  }
  function AnsChip({ m, msgs, teacher, onOpen }) {
    const mk = marksFor(m.id, msgs), sc = scoreOf(mk), hw = msgs.find(x => x.id === hwData(m).hw);
    return html`<button class="anschip" onClick=${onOpen}>
      <${Ic.book} size=${18}/><span>${hw ? exLabel(hwData(hw)) : "Answers"}</span>
      ${sc ? html`<b class="score">${sc.right}/${sc.total}</b>` : teacher ? html`<b class="markit">Mark it</b>` : html`<${Ic.tick} size=${18} sw=${2.6}/>`}
    </button>`;
  }

  // Everything the student has done, with the teacher's marks. "To practise" shows the ones with mistakes.
  function ExBook({ student, msgs, lessons, teacher, onOpen, onClose }) {
    const [tab, setTab] = useState("all");
    const rows = msgs.filter(m => m.kind === "hw" && m.student === student.id).map(hw => {
      const d = hwData(hw), ans = answersFor(hw.id, msgs), mk = ans ? marksFor(ans.id, msgs) : null;
      return { hw, d, ans, mk, sc: scoreOf(mk), wrong: !!(mk && mk.marks.some(x => x === false)) };
    }).sort((a, b) => (b.hw.at || 0) - (a.hw.at || 0));
    const shown = rows.filter(r => (tab === "practise" ? r.wrong : tab === "tests" ? r.d.type === "test" : true));
    const tests = rows.filter(r => r.d.type === "test" && r.sc).slice().reverse();
    const lessonNo = id => { const i = lessons.findIndex(l => l.id === id); return i >= 0 ? i + 1 : "?"; };
    return html`<div class="full sheetpage exbook" role="dialog" aria-label="Exercise book">
      <div class="fhead"><span class="bktitle"><${Ic.book} size=${22}/>${teacher ? (student.name || "Student") + "'s book" : "My book"}</span>
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="bktabs">
        <button class=${tab === "all" ? "on" : ""} onClick=${() => setTab("all")} aria-label="Everything"><${Ic.book} size=${22}/>All</button>
        <button class=${tab === "practise" ? "on" : ""} onClick=${() => setTab("practise")} aria-label="To practise"><span class="mk no"><${Ic.x} size=${20} sw=${3}/></span>Practise</button>
        <button class=${tab === "tests" ? "on" : ""} onClick=${() => setTab("tests")} aria-label="Tests"><${Ic.test} size=${22}/>Tests</button>
      </div>
      <div class="sbody">
        ${teacher && tab === "tests" && tests.length ? html`<div class="trend">${tests.map((r, k) => html`<span key=${k}><b>${r.sc.right}/${r.sc.total}</b><small>${fmtDay(r.hw.at)}</small></span>`)}</div>` : null}
        ${shown.length ? html`<div class="bklist">${shown.map(r => html`<button class="bkrow" key=${r.hw.id} onClick=${() => onOpen(r.hw)}>
          <span class="num">${lessonNo(r.hw.lesson)}</span>
          <span class="bkmain"><span class="bkname"><${exIcon(r.d)} size=${18}/>${exLabel(r.d)}<small>${fmtDay(r.hw.at)}</small></span>
            <span class="hwdots">${(r.d.items || []).map((_, k) => html`<i key=${k} class=${r.mk ? (r.mk.marks[k] === true ? "ok" : r.mk.marks[k] === false ? "no" : "") : r.ans ? "done" : ""}></i>`)}</span></span>
          ${r.sc ? html`<span class="score">${r.sc.right}/${r.sc.total}</span>` : r.ans ? html`<${Ic.tick} size=${20}/>` : html`<${Ic.edit} size=${20}/>`}
        </button>`)}</div>` : html`<div class="empty"><${Ic.book} size=${44} sw=${1.6}/>${teacher ? html`<p>${tab === "practise" ? "Nothing to practise: no mistakes marked yet." : "No exercises yet."}</p>` : null}</div>`}
      </div>
    </div>`;
  }

  function WriteBoard({ canWrite, teacher, holder, name, ix, lessons }) {
    const wrapRef = useRef(null), cvRef = useRef(null), dusterRef = useRef(null), headRef = useRef(null);
    const [tool, setToolState] = useState("chalk");
    const [sel, setSel] = useState(null);   // a handwritten word picked up with Move
    const [tidying, setTidying] = useState(false);
    async function tidySel() {
      const ss = wb.strokes.filter(z => sel && sel.includes(z.id) && z.pts && z.pts.length);
      if (!ss.length || tidying) return;
      setTidying(true);
      try {
        const { image, box: b } = inkPng(ss);
        const { data } = await sb.auth.getSession(), tok = data && data.session && data.session.access_token;
        const r = await fetch("/.netlify/functions/tidy", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + (tok || "") }, body: JSON.stringify({ image }) });
        const j = await r.json().catch(() => ({}));
        if (j.off) { toast("Tidy isn't switched on yet: add ANTHROPIC_API_KEY in Netlify."); return; }
        const text = String(j.text || "").trim();
        if (!r.ok || !text || text === "?") { toast("Couldn't read that one. Try writing it a little bigger."); return; }
        const t = { id: uid(), tool: "text", text: text.slice(0, 30), x: Math.round((b.x0 + b.x1) / 2), y: Math.round((b.y0 + b.y1) / 2), h: Math.round(Math.max(60, Math.min(220, (b.y1 - b.y0) * 1.2))) };
        live.edit(ss.map(z => z.id), [t]);
        setSel(null);
      } catch (e) { toast("Couldn't reach Tidy. Check the connection."); }
      finally { setTidying(false); }
    }
    useEffect(() => { if (tool !== "move") setSel(null); }, [tool]);
    const toolRef = useRef(tool);
    toolRef.current = tool;
    const canRef = useRef(canWrite);
    canRef.current = canWrite;
    const [stamp, setStamp] = useState(0);
    const [full, setFull] = useState(false);
    const fullRef = useRef(false);
    fullRef.current = full;
    // If the phone won't turn sideways, turn the board ourselves so it still fills the screen.
    const [rot, setRot] = useState(false);
    const rotRef = useRef(false);
    rotRef.current = rot;
    const [, setVp] = useState(0);
    useEffect(() => {
      if (!full) { setRot(false); return; }
      const check = () => { setRot(window.innerHeight > window.innerWidth * 1.15); setVp(v => v + 1); };
      const t = setTimeout(check, 450);
      window.addEventListener("resize", check);
      return () => { clearTimeout(t); window.removeEventListener("resize", check); };
    }, [full]);
    const typingRef = useRef(null);
    const [, bump] = useState(0);
    // Keep the whole board above the message bar so every part of it can be written on.
    useEffect(() => {
      if (full) return;
      const t = setTimeout(() => {
        const cv = cvRef.current;
        if (!cv) return;
        const r = cv.getBoundingClientRect(), over = r.bottom - (window.innerHeight - 120);
        if (over > 0) window.scrollBy({ top: over, behavior: "smooth" });
      }, 250);
      return () => clearTimeout(t);
    }, [full]);
    const C = useCall();
    const kRef = useRef(1), cssK = useRef(1);
    const place = (el, x, y) => {
      const cv = cvRef.current;
      if (!el || !cv) return;
      el.style.opacity = "1";
      el.style.transform = "translate(" + (cv.offsetLeft + x * cssK.current) + "px," + (cv.offsetTop + y * cssK.current) + "px)";
    };
    const hide = el => { if (el) el.style.opacity = "0"; };
    const redraw = () => { const cv = cvRef.current; if (cv) renderAll(cv.getContext("2d"), kRef.current); };

    // typing on the board with the letter keyboard
    function sendText(t, done) { live.send({ type: "wb-text", id: t.id, text: t.text, x: t.x, y: t.y, h: t.h, done: !!done }); }
    function nextLine() { const n = wb.strokes.filter(s => s.tool === "text").length; return [140, 290, 430][n % 3]; }
    function typeEdit(fn) {
      let t = typingRef.current;
      if (!t) t = { id: uid(), tool: "text", text: "", x: 500, y: nextLine(), h: 120 };
      t = Object.assign({}, t, { text: fn(t.text).slice(0, 30) });
      typingRef.current = t;
      wb.open.set(t.id, t);
      redraw(); wb.emit({ kind: "redraw" }); bump(n => n + 1);
      sendText(t, false);
    }
    function commitTyping() {
      const t = typingRef.current;
      if (!t) return;
      typingRef.current = null;
      wb.open.delete(t.id);
      if (t.text.trim()) wb.commit(t);
      sendText(t, true);
      redraw(); wb.emit({ kind: "redraw" }); bump(n => n + 1);
    }
    function setTool(t) { if (toolRef.current === "type" && t !== "type") commitTyping(); setToolState(t); }

    useEffect(() => { if (!canWrite) { commitTyping(); setToolState("chalk"); } }, [canWrite]);
    useEffect(() => { if (!stamp) return; const t = setTimeout(() => setStamp(0), 2000); return () => clearTimeout(t); }, [stamp]);

    // full screen, turned sideways, so thumbs have room
    async function goFull() {
      setFull(true);
      try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) await el.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
    }
    function leaveFull() {
      setFull(false);
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    }
    useEffect(() => {
      const f = () => { if (!document.fullscreenElement && fullRef.current) { setFull(false); try { screen.orientation.unlock(); } catch (e) {} } };
      document.addEventListener("fullscreenchange", f);
      return () => {
        document.removeEventListener("fullscreenchange", f);
        commitTyping();
        if (fullRef.current) { try { screen.orientation.unlock(); } catch (e) {} try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} }
      };
    }, []);

    // size the canvas: the full width inline, or as big as fits when full screen
    useEffect(() => {
      const cv = cvRef.current, wrap = wrapRef.current;
      let last = "";
      const fit = () => {
        const W = wrap.clientWidth, H = wrap.clientHeight;
        const w = Math.floor(fullRef.current ? Math.min(W, H * WB_W / WB_H) : W);
        const key = w + ":" + (fullRef.current ? 1 : 0);
        if (!w || key === last) return;
        last = key;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(w * WB_H / WB_W * dpr);
        cv.style.width = w + "px"; cv.style.height = w * WB_H / WB_W + "px";
        kRef.current = cv.width / WB_W; cssK.current = w / WB_W;
        renderAll(cv.getContext("2d"), kRef.current);
      };
      wrap.__fit = fit;
      fit();
      const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
      if (ro) ro.observe(wrap);
      window.addEventListener("resize", fit);
      return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", fit); };
    }, []);
    useEffect(() => { const w = wrapRef.current; if (w && w.__fit) { requestAnimationFrame(() => w.__fit()); setTimeout(() => w.__fit(), 350); } }, [full, tool, rot]);

    // the other person's writing, typing, wiping and "good" arrive here
    useEffect(() => {
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let wiping = 0;
      const runWipe = () => {
        const path = wipePath(), s = { id: "wipe", tool: "rub", w: 200, hard: true, pts: [] };
        const total = path.length / 2, t0 = performance.now(), my = ++wiping;
        let done = 0;
        const step = now => {
          if (my !== wiping) return;
          const want = Math.min(total, Math.max(1, Math.ceil(((now - t0) / 1300) * total)));
          if (want > done) {
            const from = done;
            for (let i = done; i < want; i++) s.pts.push(path[i * 2], path[i * 2 + 1]);
            done = want;
            drawPts(ctx, s, kRef.current, from);
            place(dusterRef.current, path[(done - 1) * 2], path[(done - 1) * 2 + 1]);
          }
          if (done < total) requestAnimationFrame(step);
          else { hide(dusterRef.current); renderAll(ctx, kRef.current); }
        };
        requestAnimationFrame(step);
      };
      const f = evt => {
        const k = kRef.current;
        if (evt.kind === "seg") {
          drawPts(ctx, evt.s, k, evt.from);
          const p = evt.s.pts, n = p.length;
          if (n >= 2) place(evt.s.tool === "rub" ? dusterRef.current : headRef.current, p[n - 2], p[n - 1]);
        } else if (evt.kind === "end") { hide(headRef.current); hide(dusterRef.current); renderAll(ctx, k); }
        else if (evt.kind === "reset" || evt.kind === "redraw") renderAll(ctx, k);
        else if (evt.kind === "wipe") { typingRef.current = null; runWipe(); }
        else if (evt.kind === "good") setStamp(Date.now());
      };
      wb.listeners.add(f);
      return () => { wb.listeners.delete(f); wiping++; };
    }, []);

    // my own finger
    useEffect(() => {
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let cur = null, queue = [], timer = null, drag = null, dragSent = 0;
      // move a whole handwritten word; the other phone sees it slide
      const inkShift = (d, dx, dy, final) => {
        d.lx = dx; d.ly = dy;
        const moved = d.orig.map(z => Object.assign({}, z, { pts: z.pts.map((v, i) => Math.round(i % 2 ? v + dy : v + dx)) }));
        wb.edit({ remove: d.ids, add: moved });
        const now = Date.now();
        if (final || now - d.sent > 90) { d.sent = now; live.send({ type: "wb-edit", remove: d.ids, add: moved }); }
      };
      const dragTo = (x, y, final) => {
        x = Math.round(Math.max(40, Math.min(WB_W - 40, x))); y = Math.round(Math.max(30, Math.min(WB_H - 30, y)));
        drag.lx = x; drag.ly = y;
        wb.move({ id: drag.id, x, y });
        const now = Date.now();
        if (final || now - dragSent > 60) { dragSent = now; live.send({ type: "wb-move", id: drag.id, x, y }); }
      };
      const units = e => {
        const r = cv.getBoundingClientRect();
        if (rotRef.current) { const u = WB_W / r.height; return [Math.round((e.clientY - r.top) * u), Math.round((r.right - e.clientX) * u)]; }
        const u = WB_W / r.width;
        return [Math.round((e.clientX - r.left) * u), Math.round((e.clientY - r.top) * u)];
      };
      const flush = () => {
        timer = null;
        if (!cur || !queue.length) return;
        live.send({ type: "wb-seg", id: cur.id, tool: cur.tool, w: cur.w, pts: queue });
        queue = [];
      };
      const add = (x, y) => {
        x = Math.max(0, Math.min(WB_W, x)); y = Math.max(0, Math.min(WB_H, y));
        const p = cur.pts, n = p.length;
        if (n >= 2) { const dx = x - p[n - 2], dy = y - p[n - 1]; if (dx * dx + dy * dy < 9) return; }
        const from = n / 2;
        p.push(x, y); queue.push(x, y);
        drawPts(ctx, cur, kRef.current, from);
        wb.emit({ kind: "lseg", s: cur, from });
        if (cur.tool === "rub") place(dusterRef.current, x, y);
        if (!timer) timer = setTimeout(flush, 70);
      };
      const down = e => {
        if (!canRef.current || cur) return;
        e.preventDefault();
        const t = toolRef.current;
        if (t === "move") {
          const [x, y] = units(e);
          const hit = hitText(x, y);
          if (hit) { drag = { id: hit.id, dx: x - hit.x, dy: y - hit.y, lx: hit.x, ly: hit.y }; setSel(null); try { cv.setPointerCapture(e.pointerId); } catch (x2) {} }
          else {
            const ink = hitInk(x, y);
            if (ink) {
              const grp = inkGroup(ink);
              drag = { ink: true, ids: grp.map(z => z.id), orig: grp.map(z => Object.assign({}, z, { pts: z.pts.slice() })), sx: x, sy: y, lx: 0, ly: 0, sent: 0 };
              setSel(drag.ids);
              try { cv.setPointerCapture(e.pointerId); } catch (x2) {}
            } else setSel(null);
          }
          return;
        }
        if (t === "type") {
          // tap a word on the board to fix it with the letter keys, or tap empty space for a new word
          const [x, y] = units(e);
          const hit = hitText(x, y);
          if (hit && !(typingRef.current && typingRef.current.id === hit.id)) {
            commitTyping();
            wb.strokes = wb.strokes.filter(z => z.id !== hit.id);
            typingRef.current = Object.assign({}, hit);
            wb.open.set(hit.id, typingRef.current);
            redraw(); wb.emit({ kind: "redraw" }); sendText(typingRef.current, false); bump(n => n + 1);
            return;
          }
          const tt = typingRef.current;
          if (tt) { typingRef.current = Object.assign({}, tt, { x, y }); wb.open.set(tt.id, typingRef.current); redraw(); wb.emit({ kind: "redraw" }); sendText(typingRef.current, false); }
          else { typingRef.current = { id: uid(), tool: "text", text: "", x, y, h: 120 }; }
          return;
        }
        try { cv.setPointerCapture(e.pointerId); } catch (x) {}
        cur = { id: uid(), tool: t, w: WB_SIZE[t], pts: [] };
        wb.open.set(cur.id, cur);
        const [x, y] = units(e);
        add(x, y);
      };
      const move = e => {
        if (drag && drag.ink) { e.preventDefault(); const [x, y] = units(e); inkShift(drag, x - drag.sx, y - drag.sy, false); return; }
        if (drag) {
          e.preventDefault();
          const [x, y] = units(e);
          dragTo(x - drag.dx, y - drag.dy, false);
          return;
        }
        if (!cur) return;
        e.preventDefault();
        const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        for (const ev of list && list.length ? list : [e]) { const [x, y] = units(ev); add(x, y); }
      };
      const up = () => {
        if (drag && drag.ink) { inkShift(drag, drag.lx, drag.ly, true); drag = null; return; }
        if (drag) { dragTo(drag.lx, drag.ly, true); drag = null; return; }
        if (!cur) return;
        clearTimeout(timer);
        flush();
        const s = cur;
        cur = null;
        wb.open.delete(s.id);
        wb.commit(s);
        wb.emit({ kind: "lend", s });
        live.send({ type: "wb-end", id: s.id, tool: s.tool, w: s.w, pts: s.pts });
        hide(dusterRef.current);
        renderAll(ctx, kRef.current);
      };
      cv.addEventListener("pointerdown", down);
      cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerup", up);
      cv.addEventListener("pointercancel", up);
      return () => {
        cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointermove", move);
        cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up);
      };
    }, []);

    const mine = !teacher && canWrite;
    const sz = full ? 22 : 16;
    const toolList = canWrite ? [["chalk", Ic.chalk, "Chalk"], ["rub", Ic.duster, "Duster"], ["type", Ic.keys, "Type"], ["move", Ic.hand, "Move"]] : [];
    const label = (t) => (teacher ? t : null);
    const toolBtns = toolList.map(([k, I, t]) => html`<button key=${k} class=${"tool" + (tool === k ? " on" : "")} onClick=${() => setTool(k)} aria-label=${t}><${I} size=${sz}/>${label(t)}</button>`);
    const rotStyle = rot ? "width:" + window.innerHeight + "px;height:" + window.innerWidth + "px;left:" + window.innerWidth + "px" : "";
    return html`<div class=${"wbwrap" + (full ? " full" : "") + (rot ? " rot" : "")} style=${rotStyle}>
      ${teacher || full ? html`<div class=${"wbtools" + (full ? " side" : "")}>
        ${full
          ? html`<button class="tool exit" onClick=${leaveFull} aria-label="Smaller board"><${Ic.shrink} size=${sz}/>${label("Smaller")}</button>`
          : html`<button class="tool" onClick=${goFull}><${Ic.expand} size=${sz}/>Full screen</button>`}
        ${toolBtns}
        ${teacher ? html`
          <button class="tool" onClick=${() => { commitTyping(); live.wipe(); }} aria-label="Wipe board"><${Ic.wipe} size=${sz}/>${full ? "Wipe" : "Wipe board"}</button>
          <button class=${"tool" + (holder === "student" ? " on" : "")} onClick=${() => live.setHolder(holder === "student" ? "teacher" : "student")}><${Ic.chalk} size=${sz}/>${holder === "student" ? "Take the chalk back" : "Give " + name + " the chalk"}</button>
          <button class="tool good" onClick=${() => live.good()} aria-label="Good"><${Ic.tick} size=${sz} sw=${2.6}/>Good</button>` : null}
        ${full && C.joined ? html`<button class=${"tool" + (C.muted ? " on" : "")} onClick=${() => call.toggleMute()} aria-label=${C.muted ? "Unmute" : "Mute"}>${C.muted ? html`<${Ic.micoff} size=${sz}/>` : html`<${Ic.mic} size=${sz}/>`}${label(C.muted ? "Unmute" : "Mute")}</button>` : null}
      </div>` : null}
      <div class="wbmain">
        <div class=${"wb" + (mine ? " mine" : "") + (canWrite ? " can" : "") + (tool === "type" && canWrite ? " typing" : "") + (tool === "move" && canWrite ? " moving" : "")} ref=${wrapRef}>
          <canvas ref=${cvRef} aria-label="Writing board"></canvas>
          <div class="wbduster" ref=${dusterRef} aria-hidden="true"><i></i></div>
          <div class="wbhead" ref=${headRef} aria-hidden="true"><i></i></div>
          ${mine && !full ? html`<div class="wbhint" aria-hidden="true"><${Ic.chalk} size=${30}/></div>` : null}
          ${stamp ? html`<div class="wbstamp" key=${stamp} aria-label="Good"><${Ic.tick} size=${72} sw=${3}/></div>` : null}
          ${!full && !teacher ? html`<button class="wbexpand" onClick=${goFull} aria-label="Make the board bigger"><${Ic.expand} size=${22}/></button>` : null}
          ${canWrite && tool === "move" && sel && sel.length ? html`<div class="wbsize">
            <button onClick=${() => {

  function KfPortraitMini({ i }) {
    if (KF_PICS[i]) return html`<img src=${KF_PICS[i].face} alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;background:rgba(241,236,220,.12)"/>`;
    return html`<${KfPortraitMini2D} i=${i}/>`;
  }
  function KfPortraitMini2D({ i }) {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(40 * dpr); cv.height = Math.round(40 * dpr);
      const x = cv.getContext("2d");
      const s = 0.6 * dpr;
      x.setTransform(s, 0, 0, s, 20 * dpr - 16 * s, 24 * dpr + 236 * s);
      x.lineCap = "round"; x.lineJoin = "round";
      kfBody(x, { act: "idle", t: 0, dir: 1, x: 0 }, KF_CHARS[i], { T: 0, i });
    }, [i]);
    return html`<canvas ref=${ref} style="width:40px;height:40px;border-radius:50%;background:rgba(241,236,220,.12)" aria-hidden="true"></canvas>`;
  }
  function KfPortrait({ i }) {
    if (KF_PICS[i]) return html`<img src=${KF_PICS[i].full} alt="" style="width:84px;height:104px;object-fit:contain"/>`;
    return html`<${KfPortrait2D} i=${i}/>`;
  }
  function KfPortrait2D({ i }) {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(84 * dpr); cv.height = Math.round(104 * dpr);
      const x = cv.getContext("2d");
      const s = 0.31 * dpr * (KF_CHARS[i].build || 1) / 1.05;
      x.setTransform(s, 0, 0, s, 40 * dpr, 100 * dpr);
      x.lineCap = "round"; x.lineJoin = "round";
      kfBody(x, { act: "idle", t: 0, dir: 1, x: 0 }, KF_CHARS[i], { T: 0, i });
    }, [i]);
    return html`<canvas ref=${ref} style="width:84px;height:104px" aria-hidden="true"></canvas>`;
  }

  function kfBar(c, x, y, w, h, frac, col, back, right) {
    c.fillStyle = back; c.fillRect(x, y, w, h);
    c.fillStyle = col;
    const fw = Math.max(0, Math.min(1, frac)) * w;
    c.fillRect(right ? x + w - fw : x, y, fw, h);
    c.strokeStyle = "rgba(241,236,220,.7)"; c.lineWidth = 2; c.strokeRect(x, y, w, h);
  }

  function qTarget(list, recent) {

    const src = bag.length ? bag : list, w = src[Math.floor(Math.random() * src.length)];

  // Lookalikes: words that differ by one letter first (cat, cut, cot), so he has to really read.
  function qOptions(pool, target, n, needPic) {

    const same = others.filter(w => w.text.length === T.length);

  // ---- recording a game: the screen, both voices, and the game sounds ----
  let kfMaster = null;

  const gameRec = {
    active: false, mr: null, id: null, seq: 0, bytes: 0, t0: 0, dest: null, srcs: [], saving: Promise.resolve(), subs: new Set(),
    emit() { this.subs.forEach(f => f(this.active)); },
    async start(cv, meta) {

      try { kfA = kfA || new (window.AudioContext || window.webkitAudioContext)(); await kfA.resume(); } catch (e) {}

  // A canvas that fills the space it's given, keeping the scene's shape.
  function qFit(cv, wrap, W, H, last) {
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    if (ww === last.w && wh === last.h) return last.k;
    last.w = ww; last.h = wh;
    const w = Math.max(200, Math.floor(Math.min(ww, wh * W / H))), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * H / W * dpr);
    cv.style.width = w + "px"; cv.style.height = w * H / W + "px";
    last.k = cv.width / W;
    return last.k;
  }
  function qEmoji(c, e, x, y, size, k, alpha) {
    c.save(); c.globalAlpha = alpha == null ? 1 : alpha;

    c.fillText(e, x * k, y * k); c.restore();

  function qWho(c, x, y, k, kit, skin, face) {   // him from above: shoulders, arms, head

    c.fillStyle = kit; c.beginPath(); c.ellipse(0, 0, 25 * k, 16 * k, 0, 0, 7); c.fill();

  // ---- 1. Explore: walk the room, read the clue, find the thing, open the door ----
  function ExploreScene({ C, pool, ix, lessons, kit, onDone, onExit }) {
    const wrapRef = useRef(null), cvRef = useRef(null), S = useRef(null);
    const [clue, setClue] = useState(0), [near, setNear] = useState(-1), [lock, setLock] = useState(null);
    const [flash, setFlash] = useState(null), [coins, setCoins] = useState(gLoad().coins);
    const W = 600, H = 820;
    function build() {
      const pics = qShuffle(pool.words.filter(w => w.emoji));
      const picMode = pics.length >= 4;
      const src = picMode ? pics : qShuffle(pool.words.filter(qCanHear));
      const items = src.slice(0, Math.min(7, src.length));
      const spots = qShuffle([[110, 210], [300, 190], [490, 210], [100, 400], [500, 400], [130, 580], [470, 580], [300, 470]]);
      items.forEach((w, i) => { w.x = spots[i][0] + (Math.random() - 0.5) * 30; w.y = spots[i][1] + (Math.random() - 0.5) * 30; w.found = false; });
      const targets = qShuffle(items).slice(0, Math.min(3, items.length));
      const coinsAt = qShuffle([[200, 300], [400, 300], [300, 640], [200, 720], [420, 700], [300, 330]]).slice(0, 4).map(p => ({ x: p[0], y: p[1], got: false }));
      return { picMode, items, targets, coinsAt, p: { x: 300, y: 760 }, to: null, guard: C.guard ? { x: 70, y: 420, d: 1 } : null,
        mistakes: 0, hints: 0, open: false, caught: 0, T: 0 };
    }
    if (!S.current) S.current = build();
    const st = S.current;
    const target = st.targets[clue];
    useEffect(() => { if (target && !st.picMode) setTimeout(() => qPlay(target), 300); }, [clue]);
    useEffect(() => {
      const cv = cvRef.current, wrap = wrapRef.current, c = cv.getContext("2d"), last = {};
      let raf = 0, prev = performance.now();
      window.__qs = st;
      const loop = now => {
        raf = requestAnimationFrame(loop);
        const k = qFit(cv, wrap, W, H, last), dt = Math.min(0.05, (now - prev) / 1000);
        prev = now; st.T += dt;
        if (st.to && !lock) {
          const dx = st.to.x - st.p.x, dy = st.to.y - st.p.y, d = Math.hypot(dx, dy), step = 280 * dt;
          if (d <= step) { st.p.x = st.to.x; st.p.y = st.to.y; st.to = null; } else { st.p.x += dx / d * step; st.p.y += dy / d * step; }
        }
        for (const cn of st.coinsAt) if (!cn.got && Math.hypot(cn.x - st.p.x, cn.y - st.p.y) < 34) { cn.got = true; setCoins(gCoins(2)); kfSnd("power"); }
        if (st.guard && !lock) {
          const g = st.guard; g.x += g.d * (95 + C.level * 15) * dt;
          if (g.x > 530) g.d = -1; if (g.x < 70) g.d = 1;
          if (Math.hypot(g.x - st.p.x, g.y - st.p.y) < 46) {
            st.p.x = 300; st.p.y = 760; st.to = null; st.caught++; st.mistakes++;
            kfSnd("bad"); setFlash({ ok: false, text: "🕵️ Caught!" }); setTimeout(() => setFlash(null), 1200);
          }
        }
        let n = -1, best = 70;
        st.items.forEach((w, i) => { const d = Math.hypot(w.x - st.p.x, w.y - st.p.y); if (d < best) { best = d; n = i; } });
        st.near = n;
        setNear(o => (o === n ? o : n));
        if (st.targets.length && st.targets.every(t => t.found) && !st.open && !lock && Math.hypot(300 - st.p.x, 95 - st.p.y) < 70) {
          const last = st.targets[st.targets.length - 1];
          const ch = qCanHear(last) ? { id: uid(), how: "spell", text: last.text, audio: last.audio || null, options: [] }
            : qMake(pool, [], ["see", "hear"]) || { id: uid(), how: "see", text: last.text, emoji: last.emoji, options: qOptions(pool, last, 3, true) };
          setLock(ch);
        }
        // draw: tiles, walls, the door, the things, coins, the guard, him
        c.clearRect(0, 0, cv.width, cv.height);
        for (let y = 0; y < H; y += 60) for (let x = 0; x < W; x += 60) { c.fillStyle = ((x + y) / 60) % 2 ? C.floor[0] : C.floor[1]; c.fillRect(x * k, y * k, 60 * k + 1, 60 * k + 1); }
        c.fillStyle = "#2B2620"; c.fillRect(0, 0, W * k, 40 * k); c.fillRect(0, 0, 18 * k, H * k); c.fillRect((W - 18) * k, 0, 18 * k, H * k); c.fillRect(0, (H - 18) * k, W * k, 18 * k);
        c.fillStyle = st.open ? "#3B7A4F" : "#6B4A2E"; c.fillRect(250 * k, 20 * k, 100 * k, 50 * k);
        qEmoji(c, st.open ? "🚪" : "🔒", 300, 46, 34, k);
        st.items.forEach((w, i) => {
          if (i === st.near && !lock) { c.strokeStyle = "rgba(255,226,122,.9)"; c.lineWidth = 4 * k; c.beginPath(); c.arc(w.x * k, w.y * k, 40 * k, 0, 7); c.stroke(); }
          if (st.picMode) qEmoji(c, w.emoji, w.x, w.y, 50, k, w.found ? 0.35 : 1);
          else {
            qEmoji(c, "📦", w.x, w.y, 54, k, w.found ? 0.35 : 1);
            c.fillStyle = "#FFF7E0"; c.font = "700 " + 22 * k + "px Andika, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
            c.fillText(w.text, w.x * k, (w.y + 34) * k);
          }
        });
        for (const cn of st.coinsAt) if (!cn.got) qEmoji(c, "🪙", cn.x, cn.y + Math.sin(st.T * 4 + cn.x) * 3, 28, k);
        if (st.guard) qEmoji(c, "🕵️", st.guard.x, st.guard.y, 50, k);
        if (st.to) { c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 3 * k; c.beginPath(); c.arc(st.to.x * k, st.to.y * k, 14 * k, 0, 7); c.stroke(); }
        qWho(c, st.p.x, st.p.y, k, kit.top || kit.gi || "#F2C230", kit.skin, false);
      };
      raf = requestAnimationFrame(loop);
      const tap = e => {
        if (lock) return;
        const r = cv.getBoundingClientRect(), u = W / r.width;
        st.to = { x: Math.max(40, Math.min(W - 40, (e.clientX - r.left) * u)), y: Math.max(80, Math.min(H - 40, (e.clientY - r.top) * u)) };
      };
      cv.addEventListener("pointerdown", tap);
      return () => { cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", tap); };
    }, [lock]);
    function search() {
      const w = st.items[near];
      if (!w || w.found || !target) return;
      if (w === target) {
        w.found = true; chime(true); setCoins(gCoins(5)); kfNoteWord(w.text, true);
        setFlash({ ok: true, text: "✓" }); setTimeout(() => setFlash(null), 900);
        setClue(clue + 1);
      } else {
        st.mistakes++; chime(false); kfNoteWord(target.text, false);
        setFlash({ ok: false, text: "✗" }); setTimeout(() => setFlash(null), 900);
      }
    }
    function hint() {
      if (!target) return;
      if (gLoad().coins < 2) { toast("You need 2 coins for a hint."); return; }
      setCoins(gCoins(-2)); st.hints++; qPlay(target);
    }
    const doneAll = st.targets.length && clue >= st.targets.length;
    return html`<div class="qscene">
      <div class="qbar">
        <button class="iconbtn light" onClick=${onExit} aria-label="Leave"><${Ic.x} size=${24}/></button>
        <div class="qclue">${doneAll ? html`<span class="qgo">🚪 ⬆</span>`
          : st.picMode ? html`<span class="qfind">🔍</span><b class="qword">${target ? target.text : ""}</b>`
          : html`<button class="big light qhear" onClick=${() => qPlay(target)} aria-label="Hear the clue"><${Ic.speaker} size=${26}/></button>`}</div>
        <span class="qcoins">🪙 ${coins}</span>
      </div>
      <div class="qdots">${st.targets.map((t, i) => html`<i key=${i} class=${t.found ? "on" : ""}></i>`)}</div>
      <div class="qarena" ref=${wrapRef}><canvas ref=${cvRef} aria-label="The room"></canvas>
        ${flash ? html`<div class=${"kfres " + (flash.ok ? "ok" : "no")}>${flash.text}</div>` : null}
      </div>
      ${lock ? html`<div class="qlock"><div class="qlockhead">🔒</div><${WordChallenge} c=${lock} ix=${ix} lessons=${lessons}
          onDone=${ok => { if (ok) { st.open = true; setLock(null); setCoins(gCoins(5)); setTimeout(() => onDone(st.mistakes + st.hints === 0 ? 3 : st.mistakes + st.hints <= 2 ? 2 : 1), 900); } else { st.mistakes++; setLock(null); st.p.y += 60; } }}/></div>`
        : html`<div class="qpad">
          ${st.picMode && !doneAll ? html`<button class="big alt" onClick=${hint} aria-label="Hear the clue, 2 coins"><${Ic.speaker} size=${26}/></button>` : html`<span></span>`}
          <button class=${"big qsearch" + (near >= 0 && !doneAll ? "" : " off")} disabled=${near < 0 || doneAll} onClick=${search} aria-label="Search here">🖐️</button>
          <span></span>
        </div>`}
    </div>`;
  }

  // ---- 2. The chase: read the sign in time and steer into the right lane ----
  function DriveScene({ C, pool, ix, carCol, onDone, onExit }) {
    const wrapRef = useRef(null), cvRef = useRef(null), S = useRef(null);
    const [prompt, setPrompt] = useState(null), [hearts, setHearts] = useState(3), [coins, setCoins] = useState(gLoad().coins);
    const [over, setOver] = useState(null), [flash, setFlash] = useState(null), [round, setRound] = useState(0);
    const W = 600, H = 820, LX = [150, 300, 450], CARY = 690;
    useEffect(() => {
      const pics = pool.words.filter(w => w.emoji), hears = pool.words.filter(qCanHear), recent = [];
      const gates = [];
      for (let i = 0; i < C.gates; i++) {
        const usePic = pics.length >= 3 && (!hears.length || Math.random() < 0.55);
        const list = usePic ? pics : hears;
        if (!list.length || pool.words.length < 3) break;
        const t = qTarget(list, recent);
        const opts = qOptions(pool, t, 3, false).slice(0, 3);
        gates.push({ t, how: usePic ? "see" : "hear", words: opts.map(o => o.text), y: -80 - i * 640, done: false, shown: false });
      }
      if (!gates.length) { onDone(3); return; }
      S.current = { gates, lane: 1, x: LX[1], speed: 230, crashes: 0, roadT: 0, coinsOn: [], shake: 0, hearts: 3 };
      setHearts(3); setOver(null);
      const st = S.current;
      window.__qd = st;
      const cv = cvRef.current, wrap = wrapRef.current, c = cv.getContext("2d"), last = {};
      let raf = 0, prev = performance.now(), ended = false;
      for (let i = 0; i < gates.length; i++) st.coinsOn.push({ lane: Math.floor(Math.random() * 3), y: gates[i].y + 320, got: false });
      const loop = now => {
        raf = requestAnimationFrame(loop);
        const k = qFit(cv, wrap, W, H, last), dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        if (ended) return;
        const v = st.speed;
        st.roadT += v * dt;
        st.x += (LX[st.lane] - st.x) * Math.min(1, dt * 12);
        st.shake = Math.max(0, st.shake - dt);
        for (const g of st.gates) {
          g.y += v * dt;
          if (!g.shown && g.y > -60) { g.shown = true; setPrompt(g); if (g.how === "hear") qPlay(g.t); }
          if (!g.done && g.y >= CARY - 40) {
            g.done = true;
            const picked = g.words[st.lane];
            if (picked === g.t.text) { st.speed += 14; setCoins(gCoins(3)); chime(true); kfNoteWord(g.t.text, true); setFlash({ ok: true, text: "✓" }); }
            else {
              st.crashes++; st.hearts--; setHearts(st.hearts); st.shake = 0.5; kfSnd("big"); kfNoteWord(g.t.text, false);
              setFlash({ ok: false, text: g.t.emoji ? g.t.emoji + " " + g.t.text : g.t.text });
              if (st.hearts <= 0) { ended = true; setOver("crash"); }
            }
            setTimeout(() => setFlash(null), 900);
            const nx = st.gates.find(x => !x.done);
            if (!nx && !ended) { ended = true; setTimeout(() => onDone(st.crashes === 0 ? 3 : st.crashes === 1 ? 2 : 1), 900); }
          }
        }
        for (const cn of st.coinsOn) { cn.y += v * dt; if (!cn.got && Math.abs(cn.y - CARY) < 30 && cn.lane === st.lane) { cn.got = true; setCoins(gCoins(1)); } }
        // draw the road
        const sx = st.shake ? (Math.random() - 0.5) * 16 * k : 0;
        c.save(); c.translate(sx, 0);
        c.fillStyle = "#3E6B3A"; c.fillRect(0, 0, W * k, H * k);
        c.fillStyle = "#3A3A3E"; c.fillRect(70 * k, 0, 460 * k, H * k);
        c.fillStyle = "#E8E2D0"; c.fillRect(70 * k, 0, 6 * k, H * k); c.fillRect(524 * k, 0, 6 * k, H * k);
        c.fillStyle = "rgba(240,236,220,.7)";
        for (const lx of [225, 375]) for (let y = -80 + (st.roadT % 80); y < H; y += 80) c.fillRect((lx - 3) * k, y * k, 6 * k, 40 * k);
        for (let y = -100 + (st.roadT * 0.9 % 200); y < H; y += 200) { qEmoji(c, "🌳", 34, y, 40, k); qEmoji(c, "🌴", 566, y + 100, 40, k); }
        const nextG = st.gates.find(g => !g.done);
        qEmoji(c, "🚐", 300, nextG ? Math.max(60, Math.min(160, nextG.y - 260)) : 80, 54, k, 0.9);
        for (const cn of st.coinsOn) if (!cn.got && cn.y > -40 && cn.y < H) qEmoji(c, "🪙", LX[cn.lane], cn.y, 30, k);
        for (const g of st.gates) {
          if (g.y < -70 || g.y > H + 40 || g.done) continue;
          g.words.forEach((w, i) => {
            c.fillStyle = "#F4F0E2"; c.fillRect((LX[i] - 66) * k, (g.y - 30) * k, 132 * k, 60 * k);
            c.strokeStyle = "#2E7D5B"; c.lineWidth = 4 * k; c.strokeRect((LX[i] - 66) * k, (g.y - 30) * k, 132 * k, 60 * k);
            c.fillStyle = "#1B2B22"; c.font = "700 " + 34 * k + "px Andika, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
            c.fillText(w, LX[i] * k, g.y * k + 2 * k);
          });
        }
        // the car
        c.save(); c.translate(st.x * k, CARY * k);
        c.fillStyle = "rgba(0,0,0,.3)"; c.fillRect(-34 * k, -54 * k, 72 * k, 116 * k);
        c.fillStyle = carCol; kfRR(c, -36 * k, -58 * k, 72 * k, 116 * k, 16 * k); c.fill();
        c.fillStyle = "#1E2A33"; kfRR(c, -26 * k, -34 * k, 52 * k, 26 * k, 6 * k); c.fill(); kfRR(c, -26 * k, 18 * k, 52 * k, 20 * k, 6 * k); c.fill();
        c.fillStyle = "#FFF3B0"; c.fillRect(-28 * k, -60 * k, 14 * k, 6 * k); c.fillRect(14 * k, -60 * k, 14 * k, 6 * k);
        c.restore();
        c.restore();
      };
      raf = requestAnimationFrame(loop);
      let sx0 = null;
      const down = e => { sx0 = e.clientX; };
      const up = e => { if (sx0 == null) return; const dx = e.clientX - sx0; sx0 = null; if (Math.abs(dx) > 30) steer(dx > 0 ? 1 : -1); };
      cv.addEventListener("pointerdown", down); cv.addEventListener("pointerup", up);
      return () => { cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointerup", up); };
    }, [round]);
    function steer(d) { const st = S.current; if (!st) return; st.lane = Math.max(0, Math.min(2, st.lane + d)); }
    return html`<div class="qscene drive">
      <div class="qbar">
        <button class="iconbtn light" onClick=${onExit} aria-label="Leave"><${Ic.x} size=${24}/></button>
        <div class="qclue">${prompt ? (prompt.how === "see"
          ? html`<span class="qsign">${prompt.t.emoji}</span>`
          : html`<button class="big light qhear" onClick=${() => qPlay(prompt.t)} aria-label="Hear it again"><${Ic.speaker} size=${26}/></button>`) : null}</div>
        <span class="qcoins">${"❤".repeat(Math.max(0, hearts))} 🪙 ${coins}</span>
      </div>
      <div class="qarena" ref=${wrapRef}><canvas ref=${cvRef} aria-label="The road"></canvas>
        ${flash ? html`<div class=${"kfres " + (flash.ok ? "ok" : "no")}>${flash.text}</div>` : null}
        ${over ? html`<div class="kfover"><div class="kfwin">💥</div><div class="kfagain"><button class="btn light" onClick=${() => setRound(r => r + 1)}>Try again</button></div></div>` : null}
      </div>
      <div class="qpad">
        <button class="big alt" onPointerDown=${e => { e.preventDefault(); steer(-1); }} aria-label="Left"><${Ic.back} size=${34} sw=${3}/></button>
        <span></span>
        <button class="big alt qright" onPointerDown=${e => { e.preventDefault(); steer(1); }} aria-label="Right"><${Ic.back} size=${34} sw=${3}/></button>
      </div>
    </div>`;
  }

  // ---- the chapter, start to finish: story, room, chase, boss ----
  function ChapterPlay({ n, student, lessons, ix, uIdx, onExit, onNext }) {
    const C = QCH[n];
    const [step, setStep] = useState("intro");
    const score = useRef({ explore: 0, drive: 0 });
    const pool = useMemo(() => qPool(lessons, uIdx, ix), []);
    const gs = gLoad();
    const look = (() => { try { const v = parseInt(localStorage.getItem("rc.kf.me") || "1", 10); return isNaN(v) ? 1 : v; } catch (e) { return 1; } })();
    const kit = kfMyChar(look), car = (CARS.find(x => x.id === gs.car) || CARS[0]).col;
    const [earned, setEarned] = useState(0);
    useEffect(() => { if (step === "intro") setTimeout(() => qSay(C.intro), 400); }, [step]);
    if (!pool.words.length || (!pool.words.some(w => w.emoji) && !pool.words.some(qCanHear))) {
      return html`<div class="qscene"><div class="qpanel"><div class="qbigemo">🎙️</div><p>Ask your teacher to record the sounds in your lessons first.</p>
        <button class="btn light" onClick=${onExit}>OK</button></div></div>`;
    }
    if (step === "intro") return html`<div class="qscene"><div class="qpanel">
      <div class="qch">${n + 1}</div>
      <div class="qbigemo">${C.emo}</div>
      <div class="qstory">${n === 0 ? "👩🏾 🚐💨" : n === QCH.length - 1 ? "🔒👩🏾" : "🔍 👣"}</div>
      <p class="qcap">${C.intro}</p>
      <div class="kfagain"><button class="big light" onClick=${() => qSay(C.intro)} aria-label="Hear the story"><${Ic.speaker} size=${26}/></button>
        <button class="big qplay" onClick=${() => setStep("explore")} aria-label="Start"><${Ic.play} size=${32}/></button></div>
    </div></div>`;
    if (step === "explore") return html`<${ExploreScene} C=${C} pool=${pool} ix=${ix} lessons=${lessons} kit=${kit}
      onDone=${s => { score.current.explore = s; setStep("drive"); }} onExit=${onExit}/>`;
    if (step === "drive") return html`<${DriveScene} C=${C} pool=${pool} ix=${ix} carCol=${car}
      onDone=${s => { score.current.drive = s; setStep("boss"); }} onExit=${onExit}/>`;
    if (step === "boss") return html`<${Fight} mode="solo" student=${student} lessons=${lessons} ix=${ix} uIdx=${uIdx} onClose=${onExit}
      story=${{ level: C.level, foe: C.foe, name: KF_FOES[C.foe].name, onWin: () => {
        const stars = Math.max(1, Math.round((score.current.explore + score.current.drive + 3) / 3));
        const st = gLoad(); st.stars[C.id] = Math.max(st.stars[C.id] || 0, stars); gSave(st);
        const bonus = 20 + stars * 10; gCoins(bonus); setEarned(bonus); score.current.stars = stars; setStep("done");
      } }}/>`;
    const stars = score.current.stars || 1, last = n === QCH.length - 1;
    return html`<div class="qscene"><div class="qpanel won">
      ${last ? html`<div class="qbigemo">🎉👩🏾🎉</div><b class="qtitle">Nala is free!</b>` : html`<div class="qbigemo">🏆</div>`}
      <div class="qstars">${[1, 2, 3].map(i => html`<span key=${i} class=${i <= stars ? "on" : ""}>★</span>`)}</div>
      <div class="qcoins big">🪙 +${earned}</div>
      <div class="kfagain">
        ${!last ? html`<button class="big qplay" onClick=${onNext} aria-label="Next chapter"><${Ic.play} size=${32}/></button>` : null}
        <button class="big light" onClick=${onExit} aria-label="Back to the map">🗺️</button>
      </div>
    </div></div>`;
  }

  function StoryMap({ gs, uIdx, lessons, onPlay }) {
    return html`<div class="qmap">${QCH.map((C, n) => {
      const open = qOpen(n, gs, uIdx), stars = gs.stars[C.id] || 0, byLesson = uIdx < C.need;
      return html`<button key=${C.id} class=${"qnode" + (open ? "" : " shut")} disabled=${!open} onClick=${() => onPlay(n)} aria-label=${"Chapter " + (n + 1)}>
        <span class="qn">${n + 1}</span><span class="qnemo">${open ? C.emo : "🔒"}</span>
        <span class="qnst">${open || stars ? [1, 2, 3].map(i => html`<i key=${i} class=${i <= stars ? "on" : ""}>★</i>`) : byLesson ? html`<small>📖 ${C.need + 1}</small>` : null}</span>
      </button>`;
    })}</div>`;
  }

  function Shop({ gs, onChange }) {
    const buy = (item, kind) => {
      const st = gLoad();
      if (st.owned.indexOf(item.id) < 0) {
        if (st.coins < item.price) { toast("You need " + item.price + " coins."); return; }
        st.coins -= item.price; st.owned.push(item.id); chime(true);
      }
      if (kind === "kit") st.kit = st.kit === item.id ? null : item.id; else st.car = item.id;
      gSave(st); onChange();
    };
    const row = (item, kind, sw) => {
      const owned = gs.owned.indexOf(item.id) >= 0, on = kind === "kit" ? gs.kit === item.id : gs.car === item.id;
      return html`<button key=${item.id} class=${"qitem" + (on ? " on" : "")} onClick=${() => buy(item, kind)} aria-label=${item.name}>
        <span class="qsw">${sw}</span><b>${item.name}</b><span class="qprice">${on ? "✓" : owned ? "" : "🪙 " + item.price}</span></button>`;
    };
    return html`<div class="qshop">
      <h3>🥊</h3>
      <div class="qgrid">${KITS.map(kt => row(kt, "kit", html`<i style=${"background:" + kt.top}></i><i style=${"background:" + kt.shorts}></i><i style=${"background:" + kt.gloves}></i>`))}</div>
      <h3>🚗</h3>
      <div class="qgrid">${CARS.map(cr => row(cr, "car", html`<i style=${"background:" + cr.col + ";width:34px;border-radius:8px"}></i>`))}</div>
    </div>`;
  }

  /* ================= the free-roam arena: move anywhere, get behind people ================= */
  const FRM = { p: { wind: 0.12, act: 0.1, total: 0.42, reach: 1.0, dmg: 7, cone: 0.85 }, k: { wind: 0.2, act: 0.12, total: 0.62, reach: 1.35, dmg: 11, cone: 0.7 } };
  const FR_R = 6;
  const frAngTo = (a, b) => Math.atan2(b.x - a.x, b.z - a.z);
  const frDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  function frFighter(team, x, z, ang, cpu) { return { team, x, z, y: 0, ang, hp: 100, act: "idle", t: 0, hit: false, keys: { mx: 0, mz: 0, b: 0 }, guard: 0, gt: -9, cd: 0.8 + Math.random(), cpu, spd: 0, side: Math.random() < 0.5 ? -1 : 1, blockT: 0 }; }
  function frNew(nOpp, lv, diff) {
    const f = [Object.assign(frFighter(0, 0, 3, Math.PI, false), { human: true, S: 50 })];
    for (let i = 0; i < nOpp; i++) f.push(frFighter(1, nOpp === 1 ? 0 : (i ? 1.6 : -1.6), -3, 0, true));
    return { f, S: 50, over: false, winTeam: -1, fx: [], fxId: 0, reading: false, slowT: 0, wt: 0, T: 0, go: 1.4, lv: lv || 1, diff: diff || 2, cpuDmg: FR_DIFF[diff || 2].dmg * (nOpp > 1 ? 0.8 : 1) };
  }
  function frClamp(f) { const d = Math.hypot(f.x, f.z); if (d > FR_R) { f.x *= FR_R / d; f.z *= FR_R / d; } }
  function frNearest(g, f, maxD, cone) {
    let best = null, bd = maxD;
    for (const o of g.f) {
      if (o === f || o.team === f.team || o.act === "ko") continue;
      const d = Math.hypot(o.x - f.x, o.z - f.z);
      if (d < bd && (cone == null || Math.abs(frDiff(frAngTo(f, o), f.ang)) < cone)) { bd = d; best = o; }
    }
    return best;
  }
  // Speed is skill: a tap during a strike is kept and fires the moment it ends, and quick follow-ups get faster.
  function frStart(g, f, k) {
    const chain = f.lastEnd != null && g.T - f.lastEnd < 0.45;

  /* ================= shared pieces ================= */
  const Loading = () => html`<div class="center"><div class="loader" aria-label="Loading"><i></i><i></i><i></i></div></div>`;
  const Center = p => html`<div class="center"><div class=${"msgbox" + (p.wide ? " wide" : "")}>${p.children}</div></div>`;
  const Offline = () => html`<${Center}>
    <div class="bigicon"><${Ic.wifi} size=${54} sw=${1.8}/></div>
    <p><b>No connection.</b></p>
    <p class="help">Check your data, then try again.</p>
    <button class="btn" onClick=${() => location.reload()}><${Ic.replay} size=${20}/>Try again</button>
  </${Center}>`;
  const ErrorScreen = ({ err }) => html`<${Center}>
    <div class="bigicon"><${Ic.wifi} size=${54} sw=${1.8}/></div>
    <p class="help">${err || "Something went wrong."}</p>

  </${Center}>`;
  const NoLink = ({ hint }) => html`<${Center}>
    <div class="bigicon"><${Ic.link} size=${54} sw=${1.8}/></div>
    <p><b>This link doesn't work anymore.</b></p>

    ${hint ? html`<p class="help">${hint}</p>` : null}
    <button class="linkbtn" onClick=${() => store.set({ phase: "signin", wantTeacher: true })}>Teacher sign in</button>
  </${Center}>`;
  const NotTeacher = ({ email }) => html`<${Center} wide=${true}>
    <div class="bigicon"><${Ic.lock} size=${54} sw=${1.8}/></div>
    <p><b>${email || "This account"} isn't the teacher of this class.</b></p>
    <p class="help">The first account that signed in became the teacher. Sign in with that one.</p>
