          const dx = st.to.x - st.p.x, dy = st.to.y - st.p.y, d = Math.hypot(dx, dy), step = 280 * dt;
          if (d <= step) { st.p.x = st.to.x; st.p.y = st.to.y; st.to = null; } else { st.p.x += dx / d * step; st.p.y += dy / d * step; }
        }
        for (const cn of st.coinsAt) if (!cn.got && Math.hypot(cn.x - st.p.x, cn.y - st.p.y) < 34) { cn.got = true; setCoins(gCoins(2)); kfSnd("power"); }
        if (st.guard && !lock) {
          const g = st.guard; g.x += g.d * (95 + C.level * 15) * dt;
          if (g.x > 530) g.d = -1; if (g.x < 70) g.d = 1;
          if (Math.hypot(g.x - st.p.x, g.y - st.p.y) < 46) {
            st.p.x = 300; st.p.y = 760; st.to = null; st.caught++; st.mistakes++;
            kfSnd("bad"); setFlash({ ok: false, text: "🕵️ Caught!" }); setTimeout(() => setFlash(null), 1200);
          }
        }
        let n = -1, best = 70;
        st.items.forEach((w, i) => { const d = Math.hypot(w.x - st.p.x, w.y - st.p.y); if (d < best) { best = d; n = i; } });
        st.near = n;
        setNear(o => (o === n ? o : n));
        if (st.targets.length && st.targets.every(t => t.found) && !st.open && !lock && Math.hypot(300 - st.p.x, 95 - st.p.y) < 70) {
          const last = st.targets[st.targets.length - 1];
          const ch = qCanHear(last) ? { id: uid(), how: "spell", text: last.text, audio: last.audio || null, options: [] }
            : qMake(pool, [], ["see", "hear"]) || { id: uid(), how: "see", text: last.text, emoji: last.emoji, options: qOptions(pool, last, 3, true) };
          setLock(ch);
        }
        // draw: tiles, walls, the door, the things, coins, the guard, him
        c.clearRect(0, 0, cv.width, cv.height);
        for (let y = 0; y < H; y += 60) for (let x = 0; x < W; x += 60) { c.fillStyle = ((x + y) / 60) % 2 ? C.floor[0] : C.floor[1]; c.fillRect(x * k, y * k, 60 * k + 1, 60 * k + 1); }
        c.fillStyle = "#2B2620"; c.fillRect(0, 0, W * k, 40 * k); c.fillRect(0, 0, 18 * k, H * k); c.fillRect((W - 18) * k, 0, 18 * k, H * k); c.fillRect(0, (H - 18) * k, W * k, 18 * k);
        c.fillStyle = st.open ? "#3B7A4F" : "#6B4A2E"; c.fillRect(250 * k, 20 * k, 100 * k, 50 * k);
        qEmoji(c, st.open ? "🚪" : "🔒", 300, 46, 34, k);
        st.items.forEach((w, i) => {
          if (i === st.near && !lock) { c.strokeStyle = "rgba(255,226,122,.9)"; c.lineWidth = 4 * k; c.beginPath(); c.arc(w.x * k, w.y * k, 40 * k, 0, 7); c.stroke(); }
          if (st.picMode) qEmoji(c, w.emoji, w.x, w.y, 50, k, w.found ? 0.35 : 1);
          else {
            qEmoji(c, "📦", w.x, w.y, 54, k, w.found ? 0.35 : 1);
            c.fillStyle = "#FFF7E0"; c.font = "700 " + 22 * k + "px Andika, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
            c.fillText(w.text, w.x * k, (w.y + 34) * k);
          }
        });
        for (const cn of st.coinsAt) if (!cn.got) qEmoji(c, "🪙", cn.x, cn.y + Math.sin(st.T * 4 + cn.x) * 3, 28, k);
        if (st.guard) qEmoji(c, "🕵️", st.guard.x, st.guard.y, 50, k);
        if (st.to) { c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 3 * k; c.beginPath(); c.arc(st.to.x * k, st.to.y * k, 14 * k, 0, 7); c.stroke(); }
        qWho(c, st.p.x, st.p.y, k, kit.top || kit.gi || "#F2C230", kit.skin, false);
      };
      raf = requestAnimationFrame(loop);
      const tap = e => {
        if (lock) return;
        const r = cv.getBoundingClientRect(), u = W / r.width;
        st.to = { x: Math.max(40, Math.min(W - 40, (e.clientX - r.left) * u)), y: Math.max(80, Math.min(H - 40, (e.clientY - r.top) * u)) };
      };
      cv.addEventListener("pointerdown", tap);
      return () => { cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", tap); };
    }, [lock]);
    function search() {
      const w = st.items[near];
      if (!w || w.found || !target) return;
      if (w === target) {
        w.found = true; chime(true); setCoins(gCoins(5)); kfNoteWord(w.text, true);
        setFlash({ ok: true, text: "✓" }); setTimeout(() => setFlash(null), 900);
        setClue(clue + 1);
      } else {
        st.mistakes++; chime(false); kfNoteWord(target.text, false);
        setFlash({ ok: false, text: "✗" }); setTimeout(() => setFlash(null), 900);
      }
    }
    function hint() {
      if (!target) return;
      if (gLoad().coins < 2) { toast("You need 2 coins for a hint."); return; }
      setCoins(gCoins(-2)); st.hints++; qPlay(target);
    }
    const doneAll = st.targets.length && clue >= st.targets.length;
    return html`<div class="qscene">
      <div class="qbar">
        <button class="iconbtn light" onClick=${onExit} aria-label="Leave"><${Ic.x} size=${24}/></button>
        <div class="qclue">${doneAll ? html`<span class="qgo">🚪 ⬆</span>`
          : st.picMode ? html`<span class="qfind">🔍</span><b class="qword">${target ? target.text : ""}</b>`
          : html`<button class="big light qhear" onClick=${() => qPlay(target)} aria-label="Hear the clue"><${Ic.speaker} size=${26}/></button>`}</div>
        <span class="qcoins">🪙 ${coins}</span>
      </div>
      <div class="qdots">${st.targets.map((t, i) => html`<i key=${i} class=${t.found ? "on" : ""}></i>`)}</div>
      <div class="qarena" ref=${wrapRef}><canvas ref=${cvRef} aria-label="The room"></canvas>
        ${flash ? html`<div class=${"kfres " + (flash.ok ? "ok" : "no")}>${flash.text}</div>` : null}
      </div>
      ${lock ? html`<div class="qlock"><div class="qlockhead">🔒</div><${WordChallenge} c=${lock} ix=${ix} lessons=${lessons}
          onDone=${ok => { if (ok) { st.open = true; setLock(null); setCoins(gCoins(5)); setTimeout(() => onDone(st.mistakes + st.hints === 0 ? 3 : st.mistakes + st.hints <= 2 ? 2 : 1), 900); } else { st.mistakes++; setLock(null); st.p.y += 60; } }}/></div>`
        : html`<div class="qpad">
          ${st.picMode && !doneAll ? html`<button class="big alt" onClick=${hint} aria-label="Hear the clue, 2 coins"><${Ic.speaker} size=${26}/></button>` : html`<span></span>`}
          <button class=${"big qsearch" + (near >= 0 && !doneAll ? "" : " off")} disabled=${near < 0 || doneAll} onClick=${search} aria-label="Search here">🖐️</button>
          <span></span>
        </div>`}
    </div>`;
  }

  // ---- 2. The chase: read the sign in time and steer into the right lane ----
  function DriveScene({ C, pool, ix, carCol, onDone, onExit }) {
    const wrapRef = useRef(null), cvRef = useRef(null), S = useRef(null);
    const [prompt, setPrompt] = useState(null), [hearts, setHearts] = useState(3), [coins, setCoins] = useState(gLoad().coins);
    const [over, setOver] = useState(null), [flash, setFlash] = useState(null), [round, setRound] = useState(0);
    const W = 600, H = 820, LX = [150, 300, 450], CARY = 690;
    useEffect(() => {
      const pics = pool.words.filter(w => w.emoji), hears = pool.words.filter(qCanHear), recent = [];
      const gates = [];
      for (let i = 0; i < C.gates; i++) {
        const usePic = pics.length >= 3 && (!hears.length || Math.random() < 0.55);
        const list = usePic ? pics : hears;
        if (!list.length || pool.words.length < 3) break;
        const t = qTarget(list, recent);
        const opts = qOptions(pool, t, 3, false).slice(0, 3);
        gates.push({ t, how: usePic ? "see" : "hear", words: opts.map(o => o.text), y: -80 - i * 640, done: false, shown: false });
      }
      if (!gates.length) { onDone(3); return; }
      S.current = { gates, lane: 1, x: LX[1], speed: 230, crashes: 0, roadT: 0, coinsOn: [], shake: 0, hearts: 3 };
      setHearts(3); setOver(null);
      const st = S.current;
      window.__qd = st;
      const cv = cvRef.current, wrap = wrapRef.current, c = cv.getContext("2d"), last = {};
      let raf = 0, prev = performance.now(), ended = false;
      for (let i = 0; i < gates.length; i++) st.coinsOn.push({ lane: Math.floor(Math.random() * 3), y: gates[i].y + 320, got: false });
      const loop = now => {
        raf = requestAnimationFrame(loop);
        const k = qFit(cv, wrap, W, H, last), dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        if (ended) return;
        const v = st.speed;
        st.roadT += v * dt;
        st.x += (LX[st.lane] - st.x) * Math.min(1, dt * 12);
        st.shake = Math.max(0, st.shake - dt);
        for (const g of st.gates) {
          g.y += v * dt;
          if (!g.shown && g.y > -60) { g.shown = true; setPrompt(g); if (g.how === "hear") qPlay(g.t); }
          if (!g.done && g.y >= CARY - 40) {
            g.done = true;
            const picked = g.words[st.lane];
            if (picked === g.t.text) { st.speed += 14; setCoins(gCoins(3)); chime(true); kfNoteWord(g.t.text, true); setFlash({ ok: true, text: "✓" }); }
            else {
              st.crashes++; st.hearts--; setHearts(st.hearts); st.shake = 0.5; kfSnd("big"); kfNoteWord(g.t.text, false);
              setFlash({ ok: false, text: g.t.emoji ? g.t.emoji + " " + g.t.text : g.t.text });
              if (st.hearts <= 0) { ended = true; setOver("crash"); }
            }
            setTimeout(() => setFlash(null), 900);
            const nx = st.gates.find(x => !x.done);
            if (!nx && !ended) { ended = true; setTimeout(() => onDone(st.crashes === 0 ? 3 : st.crashes === 1 ? 2 : 1), 900); }
          }
        }
        for (const cn of st.coinsOn) { cn.y += v * dt; if (!cn.got && Math.abs(cn.y - CARY) < 30 && cn.lane === st.lane) { cn.got = true; setCoins(gCoins(1)); } }
        // draw the road
        const sx = st.shake ? (Math.random() - 0.5) * 16 * k : 0;
        c.save(); c.translate(sx, 0);
        c.fillStyle = "#3E6B3A"; c.fillRect(0, 0, W * k, H * k);
        c.fillStyle = "#3A3A3E"; c.fillRect(70 * k, 0, 460 * k, H * k);
        c.fillStyle = "#E8E2D0"; c.fillRect(70 * k, 0, 6 * k, H * k); c.fillRect(524 * k, 0, 6 * k, H * k);
        c.fillStyle = "rgba(240,236,220,.7)";
        for (const lx of [225, 375]) for (let y = -80 + (st.roadT % 80); y < H; y += 80) c.fillRect((lx - 3) * k, y * k, 6 * k, 40 * k);
        for (let y = -100 + (st.roadT * 0.9 % 200); y < H; y += 200) { qEmoji(c, "🌳", 34, y, 40, k); qEmoji(c, "🌴", 566, y + 100, 40, k); }
        const nextG = st.gates.find(g => !g.done);
        qEmoji(c, "🚐", 300, nextG ? Math.max(60, Math.min(160, nextG.y - 260)) : 80, 54, k, 0.9);
        for (const cn of st.coinsOn) if (!cn.got && cn.y > -40 && cn.y < H) qEmoji(c, "🪙", LX[cn.lane], cn.y, 30, k);
        for (const g of st.gates) {
          if (g.y < -70 || g.y > H + 40 || g.done) continue;
          g.words.forEach((w, i) => {
            c.fillStyle = "#F4F0E2"; c.fillRect((LX[i] - 66) * k, (g.y - 30) * k, 132 * k, 60 * k);
            c.strokeStyle = "#2E7D5B"; c.lineWidth = 4 * k; c.strokeRect((LX[i] - 66) * k, (g.y - 30) * k, 132 * k, 60 * k);
            c.fillStyle = "#1B2B22"; c.font = "700 " + 34 * k + "px Andika, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
            c.fillText(w, LX[i] * k, g.y * k + 2 * k);
          });
        }
        // the car
        c.save(); c.translate(st.x * k, CARY * k);
        c.fillStyle = "rgba(0,0,0,.3)"; c.fillRect(-34 * k, -54 * k, 72 * k, 116 * k);
        c.fillStyle = carCol; kfRR(c, -36 * k, -58 * k, 72 * k, 116 * k, 16 * k); c.fill();
        c.fillStyle = "#1E2A33"; kfRR(c, -26 * k, -34 * k, 52 * k, 26 * k, 6 * k); c.fill(); kfRR(c, -26 * k, 18 * k, 52 * k, 20 * k, 6 * k); c.fill();
        c.fillStyle = "#FFF3B0"; c.fillRect(-28 * k, -60 * k, 14 * k, 6 * k); c.fillRect(14 * k, -60 * k, 14 * k, 6 * k);
        c.restore();
        c.restore();
      };
      raf = requestAnimationFrame(loop);
      let sx0 = null;
      const down = e => { sx0 = e.clientX; };
      const up = e => { if (sx0 == null) return; const dx = e.clientX - sx0; sx0 = null; if (Math.abs(dx) > 30) steer(dx > 0 ? 1 : -1); };
      cv.addEventListener("pointerdown", down); cv.addEventListener("pointerup", up);
      return () => { cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointerup", up); };
    }, [round]);
    function steer(d) { const st = S.current; if (!st) return; st.lane = Math.max(0, Math.min(2, st.lane + d)); }
    return html`<div class="qscene drive">
      <div class="qbar">
        <button class="iconbtn light" onClick=${onExit} aria-label="Leave"><${Ic.x} size=${24}/></button>
        <div class="qclue">${prompt ? (prompt.how === "see"
          ? html`<span class="qsign">${prompt.t.emoji}</span>`
          : html`<button class="big light qhear" onClick=${() => qPlay(prompt.t)} aria-label="Hear it again"><${Ic.speaker} size=${26}/></button>`) : null}</div>
        <span class="qcoins">${"❤".repeat(Math.max(0, hearts))} 🪙 ${coins}</span>
      </div>
      <div class="qarena" ref=${wrapRef}><canvas ref=${cvRef} aria-label="The road"></canvas>
        ${flash ? html`<div class=${"kfres " + (flash.ok ? "ok" : "no")}>${flash.text}</div>` : null}
        ${over ? html`<div class="kfover"><div class="kfwin">💥</div><div class="kfagain"><button class="btn light" onClick=${() => setRound(r => r + 1)}>Try again</button></div></div>` : null}
      </div>
      <div class="qpad">
        <button class="big alt" onPointerDown=${e => { e.preventDefault(); steer(-1); }} aria-label="Left"><${Ic.back} size=${34} sw=${3}/></button>
        <span></span>
        <button class="big alt qright" onPointerDown=${e => { e.preventDefault(); steer(1); }} aria-label="Right"><${Ic.back} size=${34} sw=${3}/></button>
      </div>
    </div>`;
  }

  // ---- the chapter, start to finish: story, room, chase, boss ----
  function ChapterPlay({ n, student, lessons, ix, uIdx, onExit, onNext }) {
    const C = QCH[n];
    const [step, setStep] = useState("intro");
    const score = useRef({ explore: 0, drive: 0 });
    const pool = useMemo(() => qPool(lessons, uIdx, ix), []);
    const gs = gLoad();
    const look = (() => { try { const v = parseInt(localStorage.getItem("rc.kf.me") || "1", 10); return isNaN(v) ? 1 : v; } catch (e) { return 1; } })();
    const kit = kfMyChar(look), car = (CARS.find(x => x.id === gs.car) || CARS[0]).col;
    const [earned, setEarned] = useState(0);
    useEffect(() => { if (step === "intro") setTimeout(() => qSay(C.intro), 400); }, [step]);
    if (!pool.words.length || (!pool.words.some(w => w.emoji) && !pool.words.some(qCanHear))) {
      return html`<div class="qscene"><div class="qpanel"><div class="qbigemo">🎙️</div><p>Ask your teacher to record the sounds in your lessons first.</p>
        <button class="btn light" onClick=${onExit}>OK</button></div></div>`;
    }
    if (step === "intro") return html`<div class="qscene"><div class="qpanel">
      <div class="qch">${n + 1}</div>
      <div class="qbigemo">${C.emo}</div>
      <div class="qstory">${n === 0 ? "👩🏾 🚐💨" : n === QCH.length - 1 ? "🔒👩🏾" : "🔍 👣"}</div>
      <p class="qcap">${C.intro}</p>
      <div class="kfagain"><button class="big light" onClick=${() => qSay(C.intro)} aria-label="Hear the story"><${Ic.speaker} size=${26}/></button>
        <button class="big qplay" onClick=${() => setStep("explore")} aria-label="Start"><${Ic.play} size=${32}/></button></div>
    </div></div>`;
    if (step === "explore") return html`<${ExploreScene} C=${C} pool=${pool} ix=${ix} lessons=${lessons} kit=${kit}
      onDone=${s => { score.current.explore = s; setStep("drive"); }} onExit=${onExit}/>`;
    if (step === "drive") return html`<${DriveScene} C=${C} pool=${pool} ix=${ix} carCol=${car}
      onDone=${s => { score.current.drive = s; setStep("boss"); }} onExit=${onExit}/>`;
    if (step === "boss") return html`<${Fight} mode="solo" student=${student} lessons=${lessons} ix=${ix} uIdx=${uIdx} onClose=${onExit}
      story=${{ level: C.level, foe: C.foe, name: KF_FOES[C.foe].name, onWin: () => {
        const stars = Math.max(1, Math.round((score.current.explore + score.current.drive + 3) / 3));
        const st = gLoad(); st.stars[C.id] = Math.max(st.stars[C.id] || 0, stars); gSave(st);
        const bonus = 20 + stars * 10; gCoins(bonus); setEarned(bonus); score.current.stars = stars; setStep("done");
      } }}/>`;
    const stars = score.current.stars || 1, last = n === QCH.length - 1;
    return html`<div class="qscene"><div class="qpanel won">
      ${last ? html`<div class="qbigemo">🎉👩🏾🎉</div><b class="qtitle">Nala is free!</b>` : html`<div class="qbigemo">🏆</div>`}
      <div class="qstars">${[1, 2, 3].map(i => html`<span key=${i} class=${i <= stars ? "on" : ""}>★</span>`)}</div>
      <div class="qcoins big">🪙 +${earned}</div>
      <div class="kfagain">
        ${!last ? html`<button class="big qplay" onClick=${onNext} aria-label="Next chapter"><${Ic.play} size=${32}/></button>` : null}
        <button class="big light" onClick=${onExit} aria-label="Back to the map">🗺️</button>
      </div>
    </div></div>`;
  }

  function StoryMap({ gs, uIdx, lessons, onPlay }) {
    return html`<div class="qmap">${QCH.map((C, n) => {
      const open = qOpen(n, gs, uIdx), stars = gs.stars[C.id] || 0, byLesson = uIdx < C.need;
      return html`<button key=${C.id} class=${"qnode" + (open ? "" : " shut")} disabled=${!open} onClick=${() => onPlay(n)} aria-label=${"Chapter " + (n + 1)}>
        <span class="qn">${n + 1}</span><span class="qnemo">${open ? C.emo : "🔒"}</span>
        <span class="qnst">${open || stars ? [1, 2, 3].map(i => html`<i key=${i} class=${i <= stars ? "on" : ""}>★</i>`) : byLesson ? html`<small>📖 ${C.need + 1}</small>` : null}</span>
      </button>`;
    })}</div>`;
  }

  function Shop({ gs, onChange }) {
    const buy = (item, kind) => {
      const st = gLoad();
      if (st.owned.indexOf(item.id) < 0) {
        if (st.coins < item.price) { toast("You need " + item.price + " coins."); return; }
        st.coins -= item.price; st.owned.push(item.id); chime(true);
      }
      if (kind === "kit") st.kit = st.kit === item.id ? null : item.id; else st.car = item.id;
      gSave(st); onChange();
    };
    const row = (item, kind, sw) => {
      const owned = gs.owned.indexOf(item.id) >= 0, on = kind === "kit" ? gs.kit === item.id : gs.car === item.id;
      return html`<button key=${item.id} class=${"qitem" + (on ? " on" : "")} onClick=${() => buy(item, kind)} aria-label=${item.name}>
        <span class="qsw">${sw}</span><b>${item.name}</b><span class="qprice">${on ? "✓" : owned ? "" : "🪙 " + item.price}</span></button>`;
    };
    return html`<div class="qshop">
      <h3>🥊</h3>
      <div class="qgrid">${KITS.map(kt => row(kt, "kit", html`<i style=${"background:" + kt.top}></i><i style=${"background:" + kt.shorts}></i><i style=${"background:" + kt.gloves}></i>`))}</div>
      <h3>🚗</h3>
      <div class="qgrid">${CARS.map(cr => row(cr, "car", html`<i style=${"background:" + cr.col + ";width:34px;border-radius:8px"}></i>`))}</div>
    </div>`;
  }

  /* ================= the free-roam arena: move anywhere, get behind people ================= */
  const FRM = { p: { wind: 0.09, act: 0.09, total: 0.32, reach: 1.0, dmg: 7, cone: 0.85 }, k: { wind: 0.15, act: 0.11, total: 0.48, reach: 1.35, dmg: 11, cone: 0.7 } };
  const FR_R = 6;
  const frAngTo = (a, b) => Math.atan2(b.x - a.x, b.z - a.z);
  const frDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  function frFighter(team, x, z, ang, cpu) { return { pT: FRM.p.total, kT: FRM.k.total, team, x, z, y: 0, ang, hp: 100, act: "idle", t: 0, hit: false, keys: { mx: 0, mz: 0, b: 0 }, guard: 0, gt: -9, cd: 0.8 + Math.random(), cpu, spd: 0, side: Math.random() < 0.5 ? -1 : 1, blockT: 0 }; }
  function frNew(nOpp, lv, diff) {
    const f = [Object.assign(frFighter(0, 0, 3, Math.PI, false), { human: true, S: 50 })];
    for (let i = 0; i < nOpp; i++) f.push(frFighter(1, nOpp === 1 ? 0 : (i ? 1.6 : -1.6), -3, 0, true));
    return { f, S: 50, over: false, winTeam: -1, fx: [], fxId: 0, reading: false, slowT: 0, wt: 0, T: 0, go: 1.4, lv: lv || 1, diff: diff || 2, cpuDmg: FR_DIFF[diff || 2].dmg * (nOpp > 1 ? 0.6 : 1), tok: 1, tokT: 0 };
  }
  function frClamp(f) { const d = Math.hypot(f.x, f.z); if (d > FR_R) { f.x *= FR_R / d; f.z *= FR_R / d; } }

    const big = Math.max(vt.displayWidth, vt.displayHeight), wide = vt.displayWidth >= vt.displayHeight;
    const size = big > 1280 ? (wide ? { width: 1280 } : { height: 1280 }) : {};
    const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: "in-memory" }), target: new MB.BufferTarget() });
    const conv = await MB.Conversion.init({ input, output, video: Object.assign({ bitrate: 1200000 }, size), audio: { bitrate: 96000 } });
    if (!conv.isValid) throw new Error("invalid");
    conv.onProgress = v => onP && onP(v);
    await conv.execute();
    const out = new Blob([output.target.buffer], { type: "video/mp4" });
    out.secs = secs;
    return out;
  }
  async function uploadBlob(blob) {
    if (!rt.assets) throw { code: "not_granted" };
    const type = assetTypeFor(blob);
    if (!type) throw { code: "unsupported_type" };
    const res = await retry(() => rt.assets.upload(blob, { type }));
    try { blobUrls.set(res.id, URL.createObjectURL(blob)); } catch (e) {}
    return res.id;
  }
  function probeDuration(blob) {
    return new Promise(res => {
      let done = false;
      const a = new Audio(), u = URL.createObjectURL(blob);
      const fin = v => { if (done) return; done = true; URL.revokeObjectURL(u); res(v); };
      a.preload = "metadata";
      a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0);
      a.onerror = () => fin(0);
      setTimeout(() => fin(0), 4000);
      a.src = u;
    });
  }
  async function transcode(file) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !window.MediaRecorder) throw { code: "unsupported_type" };
    const ctx = new AC();
    try {
      if (ctx.state === "suspended") { try { await ctx.resume(); } catch (e) {} }
      if (ctx.state !== "running") throw { code: "unsupported_type" };
      const ab = await file.arrayBuffer();
      const buf = await new Promise((res, rej) => { const r = ctx.decodeAudioData(ab, res, rej); if (r && r.then) r.then(res, rej); });
      if (buf.duration > 20 * 60) throw { code: "too_large" };
      const dest = ctx.createMediaStreamDestination();
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(dest);
      const r = recorder.start(dest.stream);
      await new Promise(res => { src.onended = res; src.start(); setTimeout(res, buf.duration * 1000 + 3000); });
      await sleep(200);
      const out = await r.stop();
      return { blob: out.blob, secs: buf.duration };
    } catch (e) {
      throw e && e.code ? e : { code: "unsupported_type" };
    } finally { try { ctx.close(); } catch (e) {} }
  }
  async function audioFromFile(file) {
    const t = String(file.type || "").toLowerCase(), name = String(file.name || "").toLowerCase();
    const isWebm = t.indexOf("webm") >= 0 || /\.webm$/.test(name);
    const isMp4 = t.indexOf("mp4") >= 0 || t.indexOf("m4a") >= 0 || /\.(m4a|mp4)$/.test(name);
    if (isWebm || isMp4) {
      const blob = new Blob([file], { type: isWebm ? "audio/webm" : "audio/mp4" });
      return { blob, secs: await probeDuration(blob) };
    }
    return transcode(file);
  }
  async function compressImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1400;
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale)), hh = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = hh;
      c.getContext("2d").drawImage(img, 0, 0, w, hh);
      const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.74));
      if (blob) return blob;
      if (/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      throw new Error("encode");
    } finally { URL.revokeObjectURL(url); }
  }

          <input id="su" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder="https://xxxx.supabase.co" value=${url} onInput=${e => setUrl(e.target.value)}/></div>
        <div class="field"><label for="sk">Publishable or anon key</label>
          <input id="sk" autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder="sb_publishable_…" value=${key} onInput=${e => setKey(e.target.value)}/></div>
        ${err ? html`<p class="err" role="alert">${err}</p>` : null}
        <button class="btn" disabled=${busy || !url.trim() || !key.trim()} onClick=${connect}>${busy ? "Checking…" : "Connect"}</button>
      </div></div>
    </div>`;
  }
  const Waiting = ({ onBack }) => html`<div class="center"><div class="msgbox">
    <div class="bigicon"><${Ic.wait} size=${54} sw=${1.8}/></div>
    <p class="help">The first lesson isn't ready yet.</p>
    ${onBack ? html`<button class="btn quiet" onClick=${onBack}>Back</button>` : null}
  </div></div>`;
  function posOf(rowsOf, cue) {
    if (!cue || !cue.tile) return null;
    if (cue.r != null && rowsOf[cue.r] && rowsOf[cue.r][cue.c] && rowsOf[cue.r][cue.c].t === cue.tile) return { r: cue.r, c: cue.c };
    for (let r = 0; r < rowsOf.length; r++) for (let c = 0; c < rowsOf[r].length; c++) if (rowsOf[r][c].t === cue.tile) return { r, c };
    return null;
  }
  // The teacher's tools in a live class: the same as when recording, sent to the students as you use them.
  function LiveTools({ lesson, tool, setTool, pen, setPen, stage }) {
    const [media, setMedia] = useState(() => { const m = (lesson.cues || []).find(c => c.k === "m"); return m && Array.isArray(m.media) ? m.media : []; });
    const [busy, setBusy] = useState(false);
    const fileRef = useRef(null);
    useEffect(() => { const m = (lesson.cues || []).find(c => c.k === "m"); setMedia(m && Array.isArray(m.media) ? m.media : []); }, [lesson.id]);
    const wipe = () => { if (stage && stage.marks.length) live.fx({ k: "ox" }); if (stage && stage.strip.length) live.fx({ k: "sx" }); if (stage && stage.img) live.fx({ k: "imgx" }); live.set({ point: null }); };
    async function addMedia(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
      const isVid = /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm)$/i.test(f.name || "");
      if (isVid && (store.s.schemaVer || 0) < 7) { toast("To add videos, run the database update first (the blue box on your home screen)."); return; }
      setBusy(true);
      try {
        let blob = f, secs = 0;
        if (isVid) { try { blob = await shrinkVideo(f); secs = blob.secs; } catch (err) { if (err && err.message === "toolong") throw { code: "toolong" }; blob = f; } }
        else blob = await shrinkImage(f);
        const a = await uploadBlob(blob);
        setMedia(ms => ms.concat({ a, type: isVid ? "vid" : "img", secs: round1(secs || 0) }));
      } catch (err) { toast(err && err.code === "toolong" ? "That video is longer than 3 minutes. Pick a shorter clip." : errText(err, "That file couldn't be added.")); }
      setBusy(false);
    }
    const show = m => {
      if (m.type === "vid") { live.fx({ k: "vid", a: m.a, secs: 0 }); return; }
      live.fx(stage && stage.img && stage.img.a === m.a ? { k: "imgx" } : { k: "img", a: m.a });
    };
    return html`<div class="livetools">
      <div class="tools" role="toolbar" aria-label="Board tools">
        ${STUDIO_TOOLS.map(([k, ic, lbl]) => html`<button key=${k} class=${"tool" + (tool === k ? " on" : "")} aria-pressed=${tool === k ? "true" : "false"} onClick=${() => setTool(k)}><span>${ic}</span>${lbl}</button>`)}
        <button class="tool" onClick=${wipe}><span>🧽</span>Wipe</button>
      </div>
      ${tool === "pen" ? html`<div class="subbar">${PEN_COLS.map(c => html`<button key=${c} class=${"swatch" + (pen === c ? " on" : "")} style=${"background:" + c} onClick=${() => setPen(c)} aria-label="Chalk colour"></button>`)}<span class="help">Draw on the board with your finger.</span></div>` : null}
      ${tool === "word" ? html`<div class="subbar"><span class="help">Tap letters on the board to bring them down.</span><button class="chip" onClick=${() => live.fx({ k: "sx" })}>Clear word</button></div>` : null}
      <div class="mtray">
        ${media.map(m => html`<button key=${m.a} class=${"mthumb" + (m.type === "img" && stage && stage.img && stage.img.a === m.a ? " on" : "")} onClick=${() => show(m)} aria-label=${m.type === "vid" ? "Play this video for them" : "Show this picture"}>
          ${m.type === "vid" ? html`<video src=${srcFor(m.a) + "#t=0.5"} preload="metadata" muted playsinline></video><span class="mbadge">▶</span>` : html`<img src=${srcFor(m.a)} alt=""/>`}</button>`)}
        <button class="mthumb madd" disabled=${busy} onClick=${() => fileRef.current && fileRef.current.click()} aria-label="Add a picture or video"><span>${busy ? "…" : "＋"}</span><small>Picture / video</small></button>
        <input ref=${fileRef} type="file" accept="image/*,video/*" style="display:none" onChange=${addMedia}/>
      </div>
    </div>`;
  }
  function Board({ lesson, number, ix, tkey, onTile, points, edit, cue, mark, turn, flash, hint, follow, stage, clip, onClipEnd, clipLabel, strip, voice, onPen, penCol }) {
    const rowsOf = useMemo(() => parseBoard(lesson.board, lesson.stage === 3), [lesson.board]);
    const boardRef = useRef(null), stickRef = useRef(null);
    const cp = posOf(rowsOf, cue), mp = posOf(rowsOf, mark), hp = posOf(rowsOf, hint);
    const cpKey = cp ? cp.r + "-" + cp.c : "";
    useLayoutEffect(() => {
      const b = boardRef.current, stick = stickRef.current;
      if (!b || !stick) return;
      const el = cpKey ? b.querySelector('[data-rc="' + cpKey + '"]') : null;
      if (!el) { stick.style.opacity = "0"; return; }
      const x = el.offsetLeft + el.offsetWidth * 0.5, y = el.offsetTop + el.offsetHeight - 6;
      stick.style.opacity = "1";
      stick.style.transform = "translate(" + x + "px," + y + "px) rotate(-38deg)";
      if (follow) {
        const r = el.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 130) el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }, [cpKey, lesson.board, follow]);
    const at = (p, ri, ti) => p && p.r === ri && p.c === ti;
    return html`<div class=${"boardwrap" + (edit ? " edit" : "")}>
      <div class=${"board" + (cp ? " cueing" : "") + (turn ? " turn" : "") + (lesson.stage === 3 ? " passage" : "") + (strip || (stage && stage.strip.length) ? " hasstrip" : "") + (onPen ? " pening" : "")} ref=${boardRef}>
        <div class="bnum" aria-label=${"Lesson " + number}>Lesson ${number}</div>
        ${voice ? html`<${VoiceBars} src=${voice.src} secs=${voice.secs} k=${voice.k}/>` : null}
        ${turn ? html`<div class="turnhint" aria-label="Your turn"><${Ic.hand} size=${32}/></div>` : null}
        ${rowsOf.length ? rowsOf.map((row, ri) => html`<div class="brow" key=${ri} style=${row.some(t => (t.d || t.t).length > 2) ? "--cols:" + Math.max(1, Math.min(5, row.length)) : null}>${row.map((t, ti) => {
          const snd = soundFor(ix, lesson.id, t.t);
          const cls = "tile" + (t.s ? " sent" : "") + (tkey === "tile:" + lesson.id + ":" + t.t ? " on" : "") + (!snd ? " mute" : "") +
            (edit ? (snd ? (snd.own ? " own" : " borrow") : " miss") : "") + (points && points.indexOf(t.t) >= 0 ? " pt" : "") +
            (at(cp, ri, ti) ? " cue" : "") + (at(mp, ri, ti) ? " mark" : "") + (at(hp, ri, ti) ? " hint" : "") +
            (flash && flash.r === ri && flash.c === ti ? (flash.ok ? " good" : " bad") : "");
          return html`<button key=${ti} class=${cls} data-rc=${ri + "-" + ti} onClick=${() => onTile(t, snd, ri, ti)}>${t.d || t.t}</button>`;
        })}</div>`) : html`<div class="bempty">${edit ? "The board is empty. Write its rows below." : html`<${Ic.wait} size=${40} sw=${1.6}/>`}</div>`}
        <div class="stick" ref=${stickRef} aria-hidden="true"><i></i></div>
        ${stage || clip || onPen ? html`<${BoardFx} boardRef=${boardRef} rowsKey=${lesson.board} stage=${stage} clip=${clip} onClipEnd=${onClipEnd} clipLabel=${clipLabel} onPen=${onPen} penCol=${penCol}/>` : null}
      </div>
      <div class="ledge"><i></i></div>
    </div>`;
  }

  function Rail({ lessons, uIdx, vIdx, unreadBy, teacher, onPick, onBook, onFight, bell }) {
    const ref = useRef(null);
    useEffect(() => {
      const rail = ref.current; if (!rail) return;
      const el = rail.querySelectorAll(".dot")[vIdx]; if (!el) return;
      const left = el.offsetLeft - rail.clientWidth / 2 + el.clientWidth / 2;
      try { rail.scrollTo({ left, behavior: "smooth" }); } catch (e) { rail.scrollLeft = left; }
    }, [vIdx, lessons.length]);
    return html`<nav class="rail" ref=${ref} aria-label="Lessons">${bell ? html`<${PushBell} studentId=${bell} rail=${true}/>` : null}${onBook ? html`<button class="railbook railw" onClick=${onBook} aria-label="My exercise book"><${Ic.book} size=${20}/><span>Book</span></button>` : null}${onFight ? html`<button class="railbook railfight railw" onClick=${onFight} aria-label="Games">🎮<span>Game</span></button>` : null}${onBook || onFight ? html`<span class="raillbl">Lessons</span>` : null}${lessons.map((l, i) => {
      const state = i < uIdx ? "done" : i === uIdx ? "cur" : "locked";
      const can = teacher || i <= uIdx;
      return html`<button key=${l.id} class=${"dot " + state + (i === vIdx ? " view" : "") + (teacher && i === vIdx ? " tview" : "")} disabled=${!can} onClick=${() => onPick(l.id)} aria-label=${"Lesson " + (i + 1)} aria-current=${i === vIdx ? "true" : null}>
        ${i + 1}
        ${state === "done" ? html`<span class="tk"><${Ic.tick} size=${13} sw=${3.2}/></span>` : null}
        ${unreadBy[l.id] ? html`<span class="bd"></span>` : null}
      </button>`;
    })}</nav>`;
  }

  function Voice({ m, pst }) {
    const key = "msg:" + (m.cid || m.id);
    const on = pst.key === key;
    const dur = m.secs || (on ? pst.dur : 0);
    const frac = on && dur ? Math.min(1, pst.cur / dur) : 0;
    const bars = useMemo(() => waveBars(m.cid || m.id, 26), [m.cid || m.id]);
    const src = m.localUrl || (m.asset ? srcFor(m.asset) : null);
    return html`<div class="voice">
      <button class="vplay" disabled=${!src} onClick=${() => src && player.play(key, src)} aria-label=${on && pst.playing ? "Pause" : "Play"}>
        ${on && pst.playing ? html`<${Ic.pause} size=${20}/>` : html`<${Ic.play} size=${20}/>`}
      </button>
      <div class="wave">${bars.map((b, i) => html`<i key=${i} class=${(i + 0.5) / bars.length <= frac ? "f" : ""} style=${"height:" + b + "%"}></i>`)}</div>
      <span class="vdur">${fmtDur(on && pst.cur > 0 ? pst.cur : dur)}</span>
    </div>`;
  }

  function Meta({ m, me, teacher, onDel, onRetry }) {
    const [arm, setArm] = useState(false);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 3500); return () => clearTimeout(t); }, [arm]);
    return html`<div class="meta">
      ${m.pending ? (m.state === "fail"
        ? html`<button class="failbtn" onClick=${onRetry} aria-label="Not sent. Try again">!</button>`
        : html`<span class="spin" aria-label="Sending"></span>`) : null}
      <span>${fmtClock(m.at)}</span>
      ${me && !m.pending ? html`<span class=${"ticks" + (m.seen ? " seen" : "")} aria-label=${m.seen ? "Seen" : "Sent"}>${m.seen ? "✓✓" : "✓"}</span>` : null}
      ${teacher && !m.pending ? html`<button class=${"delbtn" + (arm ? " arm" : "")} onClick=${() => (arm ? onDel() : setArm(true))} aria-label="Delete message">${arm ? "Delete?" : html`<${Ic.trash} size=${15}/>`}</button>` : null}
    </div>`;
  }

  function Msg({ m, role, teacher, pst, lessons, onGoto, onRetry, onDel, onPhoto, msgs, onHw, onAns }) {
    if (m.kind === "hwmark") return null;
    if (m.kind === "hw" || m.kind === "hwans") {
      const mine = m.from === role;
      return html`<div data-mid=${m.id} class=${"msg " + (mine ? "me" : "them")}>
        ${m.kind === "hw" ? html`<${HwCard} m=${m} msgs=${msgs || []} teacher=${teacher} onOpen=${() => onHw && onHw(m)}/>` : html`<${AnsChip} m=${m} msgs=${msgs || []} teacher=${teacher} onOpen=${() => onAns && onAns(m)}/>`}
        <${Meta} m=${m} me=${mine} teacher=${teacher} onDel=${onDel} onRetry=${onRetry}/>
      </div>`;
    }
    const me = m.from === role;
    if (m.kind === "pass") {
      const ni = m.next ? lessons.findIndex(l => l.id === m.next) : -1;
      return html`<div class="stamp">
        <div class="stamp-ring" aria-label="Lesson passed"><${Ic.tick} size=${54} sw=${3}/></div>
        ${ni >= 0 ? html`<button class="nextbtn" onClick=${() => onGoto(m.next)} aria-label=${"Go to lesson " + (ni + 1)}><span>${ni + 1}</span><${Ic.arrow} size=${26} sw=${2.6}/></button>` : null}
        ${teacher ? html`<${Meta} m=${m} me=${true} teacher=${true} onDel=${onDel}/>` : null}
      </div>`;
    }
    const photoSrc = m.localUrl || (m.asset ? srcFor(m.asset) : null);
    return html`<div data-mid=${m.id} class=${"msg " + (me ? "me" : "them")}>

        ${m.hw ? html`<span class="hwtag"><${Ic.book} size=${18}/>Homework</span>` : null}
        ${m.point && m.point.length ? html`<div class="pts" aria-label="Pointing at">${m.point.map(p => html`<span key=${p}>👉 ${p}</span>`)}</div>` : null}
        ${m.kind === "voice" ? html`<${Voice} m=${m} pst=${pst}/>` : null}
        ${m.kind === "photo" && photoSrc ? html`<img class="ph" src=${photoSrc} alt="Photo" loading="lazy" onClick=${() => onPhoto(photoSrc)}/>` : null}
        ${m.kind === "text" ? html`<div class="txt">${m.text}</div>` : null}
      </div>
      <${Meta} m=${m} me=${me} teacher=${teacher} onDel=${onDel} onRetry=${onRetry}/>
    </div>`;
  }

  function Listen({ lesson, pst, turn, onResume }) {
    const key = "explain:" + lesson.id;
    const on = pst.key === key;
    const dur = lesson.explainSecs || (on ? pst.dur : 0);
    const frac = on && dur ? Math.min(1, pst.cur / dur) : 0;
    const C = 2 * Math.PI * 35;
    const ring = html`<svg class="ring" viewBox="0 0 78 78" aria-hidden="true"><circle class="rbg" cx="39" cy="39" r="35"/><circle class="rfg" cx="39" cy="39" r="35" style=${"stroke-dasharray:" + C + ";stroke-dashoffset:" + C * (1 - frac)}/></svg>`;
    if (turn) {
      return html`<div class="listen">
        ${turn.cue.tile
          ? html`<button class="big grey" onClick=${onResume} aria-label="Skip this question">${ring}<${Ic.hand} size=${30}/></button>`
          : html`<button class="big turnbtn" onClick=${onResume} aria-label="Continue">${ring}<${Ic.play} size=${30}/></button>`}
      </div>`;
    }
    return html`<div class="listen">
      <button class="big" disabled=${!lesson.explain} onClick=${() => lesson.explain && player.play(key, srcFor(lesson.explain))} aria-label=${on && pst.playing ? "Pause the teacher" : "Play the teacher"}>
        ${ring}
        ${on && pst.playing ? html`<${Ic.pause} size=${30}/>` : html`<${Ic.play} size=${30}/>`}
      </button>
      ${on ? html`<button class="mid" onClick=${() => player.seek(-10)} aria-label="Back 10 seconds"><${Ic.replay} size=${24}/></button>` : null}
    </div>`;
  }

  /* ================= composer (bottom bar) ================= */
  function Composer({ teacher, lesson, pst, canSend, onSend, points, setPoints, hw, setHw, turn, onResume }) {
    const [mode, setMode] = useState("idle");
    const [t0, setT0] = useState(0);
    const [now, setNow] = useState(0);
    const [take, setTake] = useState(null);
    const [photo, setPhoto] = useState(null);
    const [text, setText] = useState("");
    const recRef = useRef(null), streamRef = useRef(null), camRef = useRef(null), audRef = useRef(null), taRef = useRef(null);

    useEffect(() => { if (mode !== "rec") return; const i = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(i); }, [mode]);
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(streamRef.current); }, []);
    useEffect(() => { reset(); }, [lesson.id]);

    function reset() {
      if (recRef.current) { recRef.current.cancel(); recRef.current = null; }
      recorder.close(streamRef.current); streamRef.current = null;
      if (player.key === "take") player.stop();
      setTake(null); setMode("idle"); setPoints(null);
    }
    function micTap() {
      if (recorder.blocked) { audRef.current && audRef.current.click(); return; }
      startRec();
    }
    async function startRec() {
      player.stop();
      tilePlayer.stop();
      try {
        const st = await recorder.open();
        streamRef.current = st;
        recRef.current = recorder.start(st);
        setT0(Date.now()); setNow(Date.now()); setMode("rec");
        if (!teacher) setPoints([]);
      } catch (e) {
        toast("The microphone isn't available here. Tap the mic again to use your phone's recorder.");
        recorder.blocked = true;
      }
    }
    async function stopRec() {
      const r = recRef.current; recRef.current = null;
      if (!r) return;
      const out = await r.stop();
      recorder.close(streamRef.current); streamRef.current = null;
      if (out.secs < 0.8 || !out.blob.size) { setMode("idle"); setPoints(null); toast("That was too short. Tap the mic, talk, then tap stop."); return; }
      setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
      setMode("review");
    }
    function sendTake() {
      const tk = take;
      if (player.key === "take") player.stop();
      setTake(null); setMode("idle");
      onSend({ kind: "voice", blob: tk.blob, secs: tk.secs, point: points || [] });
      setPoints(null);
    }
    async function onPhotoFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      try { const blob = await compressImage(f); setPhoto({ blob, url: URL.createObjectURL(blob) }); }
      catch (err) { toast("That photo couldn't be opened. Try taking it again."); }
    }
    async function onAudioFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      try {
        toast("Getting the recording ready…");
        const out = await audioFromFile(f);
        setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
        setMode("review");
      } catch (err) { toast(errText(err, "That recording couldn't be used. Try again.")); }
    }
    function sendText() {
      const tx = text.trim(); if (!tx) return;
      setText("");
      if (taRef.current) { taRef.current.style.height = ""; }
      onSend({ kind: "text", text: tx });
    }

    const inputs = html`
      <input ref=${camRef} type="file" accept="image/*" capture=${teacher ? null : "environment"} style="display:none" onChange=${onPhotoFile}/>
      <input ref=${audRef} type="file" accept="audio/*" capture="" style="display:none" onChange=${onAudioFile}/>`;

    let bar;
    if (mode === "rec") {
      bar = html`<div class="bar"><div class="bar-in">
        <button class="big grey" onClick=${reset} aria-label="Cancel recording"><${Ic.x} size=${28}/></button>
        <div class="recind" role="timer"><span class="recdot"></span>${fmtDur((now - t0) / 1000)}</div>
        <button class="big red" onClick=${stopRec} aria-label="Stop recording"><${Ic.stop} size=${28}/></button>
      </div></div>`;
    } else if (mode === "review" && take) {
      const on = pst.key === "take";
      bar = html`<div class="bar"><div class="bar-in">
        <button class="big grey" onClick=${reset} aria-label="Delete this recording"><${Ic.trash} size=${28}/></button>
        <div class="take">
          <button class="vplay" onClick=${() => player.play("take", take.url)} aria-label="Listen before sending">${on && pst.playing ? html`<${Ic.pause} size=${20}/>` : html`<${Ic.play} size=${20}/>`}</button>
          <span class="vdur">${fmtDur(on && pst.cur > 0 ? pst.cur : take.secs)}</span>
        </div>
        <button class="big" onClick=${sendTake} aria-label="Send"><${Ic.send} size=${28}/></button>
      </div></div>`;
    } else if (teacher) {
      bar = html`<div class="bar t"><div class="bar-in">
        <button class=${"hwbtn" + (hw ? " on" : "")} onClick=${() => setHw(!hw)} aria-pressed=${hw ? "true" : "false"} aria-label="Mark as homework"><${Ic.book} size=${22}/></button>
        <textarea ref=${taRef} class="tin" rows="1" placeholder=${hw ? "Homework for this lesson" : "Message"} value=${text} onInput=${e => { setText(e.target.value); autosize(e.target); }}></textarea>
        <button class="big alt" onClick=${() => camRef.current && camRef.current.click()} aria-label="Send a photo"><${Ic.cam} size=${24}/></button>
        ${text.trim()
          ? html`<button class="big" onClick=${sendText} aria-label="Send message"><${Ic.send} size=${24}/></button>`
          : html`<button class="big" onClick=${micTap} aria-label="Record a voice note"><${Ic.mic} size=${24}/></button>`}
      </div></div>`;
    } else {
      bar = html`<div class="bar"><div class="bar-in">
        <${Listen} lesson=${lesson} pst=${pst} turn=${turn} onResume=${onResume}/><small class="lbx">Listen</small>
        <div class="grow"></div>
        ${canSend ? html`
          <span class="lbl"><button class="big alt" onClick=${() => camRef.current && camRef.current.click()} aria-label="Send a photo"><${Ic.cam} size=${30}/></button><small>Photo</small></span>
          <span class="lbl"><button class="big" onClick=${micTap} aria-label="Record a voice note"><${Ic.mic} size=${30}/></button><small>Talk</small></span>`
          : html`<span class="nosend"><${Ic.lock} size=${18}/>Can listen, can't send yet</span>`}
      </div></div>`;
    }
    return html`${inputs}${bar}
      ${points && points.length && (mode === "rec" || mode === "review") ? html`<div class="pointbar">${points.map(p => html`<span key=${p}>👉 ${p}</span>`)}</div>` : null}
      ${photo ? html`<div class="lb" role="dialog" aria-label="Photo to send">
        <div class="imgwrap"><img src=${photo.url} alt="Photo to send"/></div>
        <div class="bar"><div class="bar-in">

  /* ================= the classroom ================= */
  const markedSeen = new Set();
  // Scrolls to one message and makes it flash, once it's on screen.
  function flashMsg(id) {

  }
  function Room({ s, ix, student, mode, onBack, startEditing, focus }) {
    const teacher = mode === "teacher";

    const tkey = useTileKey();
    const Lraw = useLive();
    const L = teacher && Lraw.sid !== student.id ? LIVE_OFF : Lraw;

    const [viewId, setViewId] = useState(() => (focus && focus.lesson ? focus.lesson : lessons[uIdx] ? lessons[uIdx].id : null));
    useEffect(() => { if (focus && focus.msg) flashMsg(focus.msg); }, []);
    let vIdx = lessons.findIndex(l => l.id === viewId);
    const liveView = !teacher && L.on && vIdx >= 0 && lessons[vIdx].id === L.lesson;
    if (vIdx < 0 || (!teacher && vIdx > uIdx && !liveView)) vIdx = uIdx;
    const lesson = lessons[vIdx];
    const [pending, setPending] = useState([]);
    const [points, setPoints] = useState(null);
    const [hw, setHw] = useState(false);
    const [lightbox, setLightbox] = useState(null);
    const [editing, setEditing] = useState(!!startEditing);
    const [hwEdit, setHwEdit] = useState(false);
    const [fight, setFight] = useState(null);
    const [arena, setArena] = useState(null);
    useEffect(() => {
      if (teacher) return;

      return () => frBus.subs.delete(f);
    }, [teacher]);
    useEffect(() => {
      if (teacher) return;
      const f = m => { if (m.type === "kf-start") setFight("live"); };

      return () => kfBus.subs.delete(f);
    }, [teacher]);
    const [hwRun, setHwRun] = useState(null);
    const [hwRev, setHwRev] = useState(null);
    const [bookOpen, setBookOpen] = useState(false);
    function openHw(hw) {
      const a = answersFor(hw.id, s.msgs.filter(x => x.student === student.id));
      if (teacher) { if (a) setHwRev(a); else setHwRun({ hw, preview: true }); }
      else setHwRun({ hw });
    }
    function openAns(a) {
      if (teacher) { setHwRev(a); return; }
      const hw = s.msgs.find(x => x.id === hwData(a).hw);
      if (hw) setHwRun({ hw });
    }
    const [endVis, setEndVis] = useState(false);
    const [vis, setVis] = useState(document.visibilityState !== "hidden");
    const [turn, setTurn] = useState(null);

    const unreadBy = {};

    useEffect(() => { if (pending.some(p => cids.has(p.cid))) setPending(ps => ps.filter(p => !cids.has(p.cid))); }, [s.msgs]);
    const explCue = useCueSync("explain:" + lid, lesson ? lesson.cues : null, true, c => setTurn({ cue: c, tries: 0 }), pst);

    { t: "Magic e", r: "Vowel, consonant, then e at the end: the e makes no sound but makes the vowel say its name.", ex: "cap → cape · pin → pine · hop → hope · cut → cute", x: "Common words that break it: have, give, live, come, some, done, love, one.", say: "\"Magic e jumps over the letter and makes the vowel say its name.\"" },
    { t: "Soft c and soft g", r: "c says /s/ before e, i or y, and /k/ before everything else. g often says /j/ before e, i or y.", ex: "conceal: con (k) + ceal (s) · cent · city · cycle · cat · cut · gem · giant · gym", x: "Hard g stays in some common words: get, give, girl, gift, begin.", say: "\"Look at the letter after c. If it's e, i or y, c says /s/.\"" },

  /* ================= reading passages and ready-made lessons ================= */
  // Bring in a text or PDF file as a reading passage. No AI: the PDF's own text is read out of it.
  let pdfjsP = null;
  function loadPdfJs() {
    if (pdfjsP) return pdfjsP;
    pdfjsP = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      sc.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); } catch (e) { rej(e); } };
      sc.onerror = () => { pdfjsP = null; rej(new Error("pdf")); };
      document.head.appendChild(sc);
    });
    return pdfjsP;
  }
  async function fileToText(file) {
    const name = String(file.name || "").toLowerCase();
    if (file.type === "application/pdf" || name.endsWith(".pdf")) {
      const lib = await loadPdfJs();
      const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
      const out = [];
      for (let p = 1; p <= Math.min(pdf.numPages, 60); p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        let line = "";
        for (const it of tc.items) {
          line += it.str;
          if (it.hasEOL) { out.push(line); line = ""; } else if (it.str && !/\s$/.test(it.str)) line += " ";
        }
        if (line.trim()) out.push(line);
        out.push("");
      }
      return out.join("\n");
    }
    return await file.text();
  }
  // Wrapped lines join into paragraphs; a blank line starts a new paragraph.
  function tidyPassage(text) {
    return String(text || "").replace(/\r/g, "").replace(/-\n(?=[a-z])/g, "").split(/\n\s*\n/)
      .map(p => p.replace(/\s*\n\s*/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
  }
  // A long book becomes several lessons of about 150 words, split at paragraph ends.
  function splitPassage(text, size) {
    const parts = [];
    let cur = [], n = 0;
    for (const para of tidyPassage(text).split("\n")) {
      const w = para.split(/\s+/).length;
      if (n && n + w > size * 1.3) { parts.push(cur.join("\n")); cur = []; n = 0; }
      if (w > size * 1.6) {           // one huge paragraph: cut it at sentence ends
        let chunk = "";
        for (const sen of para.match(/[^.!?]+[.!?]*["')\]]*\s*/g) || [para]) {
          if (chunk && (chunk + sen).split(/\s+/).length > size) { cur.push(chunk.trim()); parts.push(cur.join("\n")); cur = []; n = 0; chunk = ""; }
          chunk += sen;
        }
        if (chunk.trim()) { cur.push(chunk.trim()); n += chunk.split(/\s+/).length; }
      } else { cur.push(para); n += w; }
    }
    if (cur.length) parts.push(cur.join("\n"));
    return parts.filter(Boolean);
  }

  const cueCount = cues => {

  // Which language you're recording in, right where you record.
