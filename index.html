        await sendRow({ student: student.id, lesson: lesson.id, from: "teacher", kind: "hw", hw: true, asset: introPath, secs: intro ? round1(intro.secs) : 0, text: JSON.stringify({ v: 1, type, items: out }) });
        toast(EX_TYPES[type] + " sent to " + who + ".");
        onClose();
      } catch (e) { toast(errText(e)); setBusy(false); }
    }
    const spell = type === "spelling";
    return html`<div class="full sheetpage" role="dialog" aria-label="New exercise">
      <div class="fhead"><span>New exercise, lesson ${number}</span><button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="sbody"><div class="ed">
        <div class="field"><span class="lbl">Type</span>
          <div class="segsmall">${Object.keys(EX_TYPES).map(k => html`<button key=${k} class=${type === k ? "on" : ""} onClick=${() => setType(k)}>${EX_TYPES[k]}</button>`)}</div>
          <p class="help">${spell ? "Record yourself saying each word. They hear it and write it underneath. The word you type stays hidden from them; it helps you mark."
            : type === "test" ? "Like homework, but it's saved in their book as a test with a score, so you can see how far they've come."
            : "Put what they should read on the board, and record what you want them to do."}</p>
        </div>
        <div class="field"><span class="lbl">Instructions for the whole exercise (optional)</span>
          <${RecClip} value=${intro} onChange=${setIntro} pst=${pst} label="Record instructions"/></div>
        ${items.map((x, i) => html`<div class="card qcard" key=${x.id}>
          <div class="qhead"><b>${spell ? "Word" : "Question"} ${i + 1}</b>${items.length > 1 ? html`<button class="iconbtn" onClick=${() => setItems(xs => xs.filter(y => y.id !== x.id))} aria-label="Remove"><${Ic.trash} size=${18}/></button>` : null}</div>
          <${RecClip} value=${x.rec} onChange=${v => upd(x.id, { rec: v })} pst=${pst} label=${spell ? "Record the word" : "Record the question"}/>
          <div class="field"><label for=${"qt" + x.id}>${spell ? "The word (only you see it)" : "On the board (optional)"}</label>
            <input id=${"qt" + x.id} value=${x.text} onInput=${e => upd(x.id, { text: e.target.value })} autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder=${spell ? "e.g. cat" : "e.g. c _ t"}/></div>
          <div class="field"><span class="lbl">They answer by</span>
            <div class="segsmall">${[["write", "Writing"], ["type", "Typing"], ["say", "Speaking"]].map(([k, l]) => html`<button key=${k} class=${x.mode === k ? "on" : ""} onClick=${() => upd(x.id, { mode: k })}>${l}</button>`)}</div></div>
        </div>`)}
        <button class="btn sec" onClick=${() => setItems(xs => xs.concat(blank(type)))}><${Ic.plus} size=${18}/>${spell ? "Add a word" : "Add a question"}</button>
        ${!ready ? html`<p class="help">${spell ? "Record every word before sending." : "Each question needs a recording or something on the board."}</p>` : null}
        <button class="btn" disabled=${!ready || busy} onClick=${send}>${busy ? "Sending…" : "Send to " + who}</button>
      </div></div>
    </div>`;
  }

  // Writing an answer in the exercise book, in blue pen.
  const PAD_W = 1000, PAD_H = 360;
  function InkPad({ strokes, onChange, readOnly, small }) {
    const wrapRef = useRef(null), cvRef = useRef(null), kRef = useRef(1);
    const sRef = useRef(strokes || []);
    sRef.current = strokes || [];
    const cbRef = useRef(onChange);
    cbRef.current = onChange;
    const paint = () => {
      const cv = cvRef.current; if (!cv) return;
      const ctx = cv.getContext("2d");
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const s of sRef.current) drawPts(ctx, s, kRef.current, 0);
    };
    useEffect(() => {
      const cv = cvRef.current, wrap = wrapRef.current;
      let lastW = 0;
      const fit = () => {
        const w = wrap.clientWidth; if (!w || w === lastW) return; lastW = w;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(w * PAD_H / PAD_W * dpr);
        cv.style.height = w * PAD_H / PAD_W + "px";
        kRef.current = cv.width / PAD_W;
        paint();
      };
      fit();
      const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
      if (ro) ro.observe(wrap);
      return () => { if (ro) ro.disconnect(); };
    }, []);
    useEffect(paint, [strokes]);
    useEffect(() => {
      if (readOnly) return;
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let cur = null;
      const units = e => { const r = cv.getBoundingClientRect(), u = PAD_W / r.width; return [Math.round((e.clientX - r.left) * u), Math.round((e.clientY - r.top) * u)]; };
      const add = (x, y) => {
        const p = cur.pts, n = p.length;
        if (n >= 2) { const dx = x - p[n - 2], dy = y - p[n - 1]; if (dx * dx + dy * dy < 9) return; }
        const from = n / 2; p.push(x, y); drawPts(ctx, cur, kRef.current, from);
      };
      const down = e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cur = { tool: "pen", w: 11, pts: [] }; const [x, y] = units(e); add(x, y); };
      const move = e => {
        if (!cur) return; e.preventDefault();
        const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        for (const ev of list && list.length ? list : [e]) { const [x, y] = units(ev); add(x, y); }
      };
      const up = () => { if (!cur) return; const s = cur; cur = null; cbRef.current(sRef.current.concat([s])); };
      cv.addEventListener("pointerdown", down); cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
      return () => { cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointermove", move); cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up); };
    }, [readOnly]);
    return html`<div class=${"inkpad" + (small ? " small" : "") + (readOnly ? " ro" : "")}>
      <div class="padwrap" ref=${wrapRef}><canvas ref=${cvRef}></canvas></div>
      ${!readOnly && !small ? html`<div class="padtools">
        <button class="mid" onClick=${() => cbRef.current(sRef.current.slice(0, -1))} aria-label="Undo"><${Ic.undo} size=${22}/></button>
        <button class="mid" onClick=${() => cbRef.current([])} aria-label="Clear"><${Ic.trash} size=${22}/></button>
      </div>` : null}
    </div>`;
  }

  function AnsVoice({ value, onChange, readOnly, pst }) {
    const [rec, setRec] = useState(false);
    const [t0, setT0] = useState(0);
    const now = useNow(rec);
    const recRef = useRef(null), st = useRef(null), key = useRef("ans:" + uid());
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(st.current); }, []);
    async function start() {
      player.stop();
      try { st.current = await recorder.open(); recRef.current = recorder.start(st.current); setRec(true); setT0(Date.now()); }
      catch (e) { toast("The microphone isn't available here."); }
    }
    async function stop() {
      const r = recRef.current; recRef.current = null; setRec(false);
      if (!r) return;
      const out = await r.stop(); recorder.close(st.current); st.current = null;
      if (out.secs < 0.5 || !out.blob.size) return;
      onChange({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
    }
    const on = pst.key === key.current;
    return html`<div class="ansvoice">
      ${rec ? html`<button class="big red" onClick=${stop} aria-label="Stop"><${Ic.stop} size=${30}/></button><span class="recind"><span class="recdot"></span>${fmtDur((now - t0) / 1000)}</span>`
        : value && value.url ? html`
          <button class="big" onClick=${() => player.play(key.current, value.url)} aria-label="Listen">${on && pst.playing ? html`<${Ic.pause} size=${30}/>` : html`<${Ic.play} size=${30}/>`}</button>
          <span class="vdur">${fmtDur(value.secs)}</span>
          ${!readOnly ? html`<button class="mid" onClick=${start} aria-label="Record again"><${Ic.mic} size=${22}/></button>` : null}`
        : readOnly ? html`<span class="help">No answer</span>`
        : html`<button class="big red" onClick=${start} aria-label="Record your answer"><${Ic.mic} size=${30}/></button>`}
    </div>`;
  }

  function AnswerView({ a, pst, small }) {
    if (!hasAnswer(a)) return html`<span class="noans">—</span>`;
    if (a.text && a.text.trim()) return html`<div class=${"ansline done" + (small ? " small" : "")}>${a.text}</div>`;
    if (a.strokes && a.strokes.length) return html`<${InkPad} strokes=${a.strokes} readOnly=${true} small=${small}/>`;
    const url = a.url || (a.audio ? srcFor(a.audio) : null);
    return small ? html`<span class="noans"><${Ic.speaker} size=${20}/></span>` : html`<${AnsVoice} value=${{ url, secs: a.secs }} readOnly=${true} pst=${pst}/>`;
  }
  const MarkIcon = ({ v, size }) => (v === true ? html`<span class="mk ok"><${Ic.tick} size=${size || 22} sw=${3}/></span>` : v === false ? html`<span class="mk no"><${Ic.x} size=${size || 22} sw=${3}/></span>` : null);

  // The student does an exercise, one question at a time. Answers are kept on the phone until sent.
  function HwRunner({ hw, msgs, student, ix, lessons, preview, onClose }) {
    const pst = usePlayer();
    const d = hwData(hw), items = d.items || [], spelling = d.type === "spelling";
    const ans = preview ? null : answersFor(hw.id, msgs);
    const mk = ans ? marksFor(ans.id, msgs) : null;
    const sc = scoreOf(mk);
    const done = !!ans;
    const draftKey = "rc.hw." + hw.id;
    const [answers, setAnswers] = useState(() => {
      if (done) return (hwData(ans).answers || []).map(a => Object.assign({}, a));
      try { return JSON.parse(localStorage.getItem(draftKey) || "[]") || []; } catch (e) { return []; }
    });
    const [i, setI] = useState(done ? -1 : hw.asset ? -2 : 0);
    const [how, setHow] = useState({});
    const [busy, setBusy] = useState(false);
    useEffect(() => {
      if (done || preview) return;
      try { localStorage.setItem(draftKey, JSON.stringify(answers.map(a => (a ? { text: a.text, strokes: a.strokes } : null)))); } catch (e) {}
    }, [answers]);
    useEffect(() => {
      if (i === -2 && hw.asset) player.play("hwi:" + hw.id, srcFor(hw.asset), true);
      else if (i >= 0 && items[i] && items[i].audio) player.play("hwq:" + hw.id + ":" + i, srcFor(items[i].audio), true);
      else player.stop();
    }, [i]);
    useEffect(() => () => { player.stop(); tilePlayer.stop(); }, []);
    const setA = (k, fn) => setAnswers(xs => { const n = xs.slice(); n[k] = Object.assign({}, n[k] || {}, typeof fn === "function" ? fn(n[k] || {}) : fn); return n; });
    const it = i >= 0 ? items[i] : null;
    const a = i >= 0 ? answers[i] || {} : {};
    let mode = it ? (it.mode === "say" ? "say" : how[i] || it.mode || "type") : null;
    if (done && it) mode = a.text ? "type" : a.strokes && a.strokes.length ? "write" : a.audio ? "say" : mode;
    const next = () => setI(k => (k < 0 ? 0 : k + 1 >= items.length ? -1 : k + 1));
    const prev = () => setI(k => (k === -1 ? items.length - 1 : k <= 0 ? (hw.asset ? -2 : 0) : k - 1));
    async function submit() {
      if (busy) return;
      setBusy(true);
      try {
        const out = [];
        for (let k = 0; k < items.length; k++) {
          const x = answers[k] || {}, o = { id: items[k].id };
          if (x.text && x.text.trim()) o.text = x.text.trim();
          if (x.strokes && x.strokes.length) o.strokes = x.strokes;
          if (x.blob) { o.audio = await uploadBlob(x.blob); o.secs = round1(x.secs); }
          out.push(o);
        }
        await sendRow({ student: student.id, lesson: hw.lesson, from: "student", kind: "hwans", text: JSON.stringify({ v: 1, hw: hw.id, answers: out }) });
        try { localStorage.removeItem(draftKey); } catch (e) {}
        chime(true);
      } catch (e) { toast(errText(e)); }
      setBusy(false);
    }
    const Dots = html`<div class="hwprog">${items.map((_, k) => html`<button key=${k} onClick=${() => setI(k)} aria-label=${"Question " + (k + 1)}
      class=${"pd" + (k === i ? " cur" : "") + (mk ? (mk.marks[k] === true ? " ok" : mk.marks[k] === false ? " no" : "") : hasAnswer(answers[k]) ? " done" : "")}>${k + 1}</button>`)}</div>`;
    let body;
    if (i === -2) {
      body = html`<div class="hwq"><div class="qboard tall">
        <${exIcon(d)} size=${44}/><div class="qtext small">${exLabel(d)}</div>
        <button class="big qplay" onClick=${() => player.play("hwi:" + hw.id, srcFor(hw.asset))} aria-label="Hear the instructions"><${Ic.speaker} size=${30}/></button>
      </div></div>`;
    } else if (i === -1) {
      body = html`<div class="hwsum">
        ${sc ? html`<div class="bigscore">${sc.right}/${sc.total}</div>` : done ? html`<div class="sentok"><${Ic.tick} size=${44} sw=${3}/></div>` : null}
        <div class="sumlist">${items.map((q, k) => html`<button class="sumrow" key=${k} onClick=${() => setI(k)}>
          <span class="num">${k + 1}</span>
          <span class="sumans"><${AnswerView} a=${answers[k]} pst=${pst} small=${true}/></span>
          ${mk ? html`<${MarkIcon} v=${mk.marks[k]}/>` : hasAnswer(answers[k]) ? null : html`<span class="noans">?</span>`}
        </button>`)}</div>
        ${preview ? html`<p class="help c">Preview: this is what they see.</p>` : null}
      </div>`;
    } else {
      const wrongSpell = mk && mk.marks[i] === false && it.text;
      body = html`<div class="hwq">
        <div class="qboard">
          <span class="bnum">${i + 1}</span>
          ${!spelling && it.text ? html`<div class="qtext">${it.text}</div>` : null}
          ${it.audio ? html`<button class="big qplay" onClick=${() => player.play("hwq:" + hw.id + ":" + i, srcFor(it.audio))} aria-label="Hear it again"><${Ic.speaker} size=${30}/></button>` : null}
          ${mk ? html`<div class="qmark"><${MarkIcon} v=${mk.marks[i]} size=${34}/></div>` : null}
        </div>
        <div class="ansbox">
          ${it.mode !== "say" && !done ? html`<div class="howsw">
            <button class=${mode === "write" ? "on" : ""} onClick=${() => setHow(h => Object.assign({}, h, { [i]: "write" }))} aria-label="Write with your finger"><${Ic.edit} size=${20}/></button>
            <button class=${mode === "type" ? "on" : ""} onClick=${() => setHow(h => Object.assign({}, h, { [i]: "type" }))} aria-label="Type"><${Ic.keys} size=${20}/></button>
          </div>` : null}
          ${mode === "type" ? html`<div class="ansline">${a.text || ""}${!done ? html`<span class="caret"></span>` : null}</div>` : null}
          ${mode === "write" ? html`<${InkPad} strokes=${a.strokes || []} onChange=${s => setA(i, { strokes: s })} readOnly=${done}/>` : null}
          ${mode === "say" ? html`<${AnsVoice} value=${a.url ? a : a.audio ? { url: srcFor(a.audio), secs: a.secs } : null} readOnly=${done} pst=${pst}
            onChange=${v => setA(i, v ? { blob: v.blob, secs: v.secs, url: v.url } : { blob: null, url: null })}/>` : null}
          ${wrongSpell ? html`<div class="correct" aria-label="Correct spelling">${it.text}</div>` : null}
        </div>
      </div>`;
    }
    const typing = it && mode === "type" && !done;
    return html`<div class="full hwrun" role="dialog" aria-label=${exLabel(d)}>
      <div class="fhead">
        <span class="hwtitle"><${exIcon(d)} size=${20}/></span>
        ${Dots}
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button>
      </div>
      <div class="sbody">${body}</div>
      <div class="hwnav">
        <button class="big grey" onClick=${prev} disabled=${i === -2 || (i === 0 && !hw.asset)} aria-label="Back"><${Ic.back} size=${28}/></button>
        <div class="grow"></div>
        ${i === -1
          ? (!done && !preview ? html`<button class="big send" onClick=${submit} disabled=${busy} aria-label="Send to your teacher">${busy ? html`<span class="spin"></span>` : html`<${Ic.send} size=${28}/>`}</button>` : html`<button class="big" onClick=${onClose} aria-label="Close"><${Ic.tick} size=${28} sw=${2.6}/></button>`)
          : html`<button class="big" onClick=${next} aria-label="Next"><${Ic.next} size=${28}/></button>`}
      </div>
      ${typing ? html`<${LetterKeys} ix=${ix} lessons=${lessons} onDone=${next}
        onKey=${ch => setA(i, x => ({ text: ((x.text || "") + ch).slice(0, 40) }))}
        onBack=${() => setA(i, x => ({ text: (x.text || "").slice(0, -1) }))}/>` : null}
    </div>`;
  }

  // The teacher marks answers in red pen. Typed spellings are pre-marked; handwriting and speech are up to you.
  function HwReview({ ans, msgs, onClose }) {
    const pst = usePlayer();
    const ad = hwData(ans), hw = msgs.find(m => m.id === ad.hw), d = hwData(hw), items = d.items || [];
    const answers = ad.answers || [];
    const prev = marksFor(ans.id, msgs);
    const auto = k => {
      const it = items[k] || {}, a = answers[k] || {};
      if (a.text && it.text) return a.text.trim().toLowerCase() === it.text.trim().toLowerCase();
      return null;
    };
    const [marks, setMarks] = useState(() => (prev && Array.isArray(prev.marks) ? prev.marks.slice() : items.map((_, k) => auto(k))));
    const [busy, setBusy] = useState(false);
    const setM = (k, v) => setMarks(ms => { const n = ms.slice(); n[k] = n[k] === v ? null : v; return n; });
    async function send() {
      setBusy(true);
      try {
        await sendRow({ student: ans.student, lesson: ans.lesson, from: "teacher", kind: "hwmark", text: JSON.stringify({ v: 1, ans: ans.id, marks }) });
        toast("Marks sent.");
        onClose();
      } catch (e) { toast(errText(e)); setBusy(false); }
    }
    const sc = scoreOf({ marks });
    useEffect(() => () => player.stop(), []);
    return html`<div class="full sheetpage" role="dialog" aria-label="Mark the answers">
      <div class="fhead"><span>Mark: ${exLabel(d)}</span><button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="sbody"><div class="ed">
        ${!hw ? html`<p class="help">The exercise these answers belong to was deleted.</p>` : null}
        ${items.map((it, k) => html`<div class="card revrow" key=${k}>
          <div class="qhead"><b>${d.type === "spelling" ? "Word" : "Question"} ${k + 1}</b>
            ${it.text ? html`<span class="expect">${it.text}</span>` : null}
            ${it.audio ? html`<button class="iconbtn" onClick=${() => player.play("rq:" + k, srcFor(it.audio))} aria-label="Hear the question"><${Ic.speaker} size=${20}/></button>` : null}</div>
          <${AnswerView} a=${answers[k]} pst=${pst}/>
          <div class="markrow">
            <button class=${"markbtn ok" + (marks[k] === true ? " on" : "")} onClick=${() => setM(k, true)} aria-label="Right"><${Ic.tick} size=${22} sw=${3}/></button>
            <button class=${"markbtn no" + (marks[k] === false ? " on" : "")} onClick=${() => setM(k, false)} aria-label="Wrong"><${Ic.x} size=${22} sw=${3}/></button>
          </div>
        </div>`)}
        <button class="btn" disabled=${busy || !hw} onClick=${send}>${busy ? "Sending…" : "Send marks" + (sc ? " (" + sc.right + "/" + sc.total + ")" : "")}</button>
      </div></div>
    </div>`;
  }

  function HwCard({ m, msgs, teacher, onOpen }) {
    const d = hwData(m), items = d.items || [];
    const ans = answersFor(m.id, msgs), mk = ans ? marksFor(ans.id, msgs) : null, sc = scoreOf(mk);
    return html`<button class=${"hwcard" + (d.type === "test" ? " test" : "")} onClick=${onOpen}>
      <span class="hwtop"><${exIcon(d)} size=${22}/><b>${exLabel(d)}</b><span class="hwn">${items.length}</span></span>
      <span class="hwdots">${items.map((_, k) => html`<i key=${k} class=${mk ? (mk.marks[k] === true ? "ok" : mk.marks[k] === false ? "no" : "") : ans ? "done" : ""}></i>`)}</span>
      <span class="hwfoot">${sc ? html`<span class="score">${sc.right}/${sc.total}</span>`
        : ans ? html`<${Ic.tick} size=${18} sw=${2.6}/>${teacher ? html`<span>Answered: tap to mark</span>` : null}`
        : teacher ? html`<span>Not done yet</span>` : html`<span class="hwgo"><${Ic.edit} size=${22}/></span>`}</span>
    </button>`;
  }
  function AnsChip({ m, msgs, teacher, onOpen }) {
    const mk = marksFor(m.id, msgs), sc = scoreOf(mk), hw = msgs.find(x => x.id === hwData(m).hw);
    return html`<button class="anschip" onClick=${onOpen}>
      <${Ic.book} size=${18}/><span>${hw ? exLabel(hwData(hw)) : "Answers"}</span>
      ${sc ? html`<b class="score">${sc.right}/${sc.total}</b>` : teacher ? html`<b class="markit">Mark it</b>` : html`<${Ic.tick} size=${18} sw=${2.6}/>`}
    </button>`;
  }

  // Everything the student has done, with the teacher's marks. "To practise" shows the ones with mistakes.
  function ExBook({ student, msgs, lessons, teacher, onOpen, onClose }) {
    const [tab, setTab] = useState("all");
    const rows = msgs.filter(m => m.kind === "hw" && m.student === student.id).map(hw => {
      const d = hwData(hw), ans = answersFor(hw.id, msgs), mk = ans ? marksFor(ans.id, msgs) : null;
      return { hw, d, ans, mk, sc: scoreOf(mk), wrong: !!(mk && mk.marks.some(x => x === false)) };
    }).sort((a, b) => (b.hw.at || 0) - (a.hw.at || 0));
    const shown = rows.filter(r => (tab === "practise" ? r.wrong : tab === "tests" ? r.d.type === "test" : true));
    const tests = rows.filter(r => r.d.type === "test" && r.sc).slice().reverse();
    const lessonNo = id => { const i = lessons.findIndex(l => l.id === id); return i >= 0 ? i + 1 : "?"; };
    return html`<div class="full sheetpage exbook" role="dialog" aria-label="Exercise book">
      <div class="fhead"><span class="bktitle"><${Ic.book} size=${22}/>${teacher ? (student.name || "Student") + "'s book" : ""}</span>
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button></div>
      <div class="bktabs">
        <button class=${tab === "all" ? "on" : ""} onClick=${() => setTab("all")} aria-label="Everything"><${Ic.book} size=${22}/>${teacher ? "All" : ""}</button>
        <button class=${tab === "practise" ? "on" : ""} onClick=${() => setTab("practise")} aria-label="To practise"><span class="mk no"><${Ic.x} size=${20} sw=${3}/></span>${teacher ? "To practise" : ""}</button>
        <button class=${tab === "tests" ? "on" : ""} onClick=${() => setTab("tests")} aria-label="Tests"><${Ic.test} size=${22}/>${teacher ? "Tests" : ""}</button>
      </div>
      <div class="sbody">
        ${teacher && tab === "tests" && tests.length ? html`<div class="trend">${tests.map((r, k) => html`<span key=${k}><b>${r.sc.right}/${r.sc.total}</b><small>${fmtDay(r.hw.at)}</small></span>`)}</div>` : null}
        ${shown.length ? html`<div class="bklist">${shown.map(r => html`<button class="bkrow" key=${r.hw.id} onClick=${() => onOpen(r.hw)}>
          <span class="num">${lessonNo(r.hw.lesson)}</span>
          <span class="bkmain"><span class="bkname"><${exIcon(r.d)} size=${18}/>${exLabel(r.d)}<small>${fmtDay(r.hw.at)}</small></span>
            <span class="hwdots">${(r.d.items || []).map((_, k) => html`<i key=${k} class=${r.mk ? (r.mk.marks[k] === true ? "ok" : r.mk.marks[k] === false ? "no" : "") : r.ans ? "done" : ""}></i>`)}</span></span>
          ${r.sc ? html`<span class="score">${r.sc.right}/${r.sc.total}</span>` : r.ans ? html`<${Ic.tick} size=${20}/>` : html`<${Ic.edit} size=${20}/>`}
        </button>`)}</div>` : html`<div class="empty"><${Ic.book} size=${44} sw=${1.6}/>${teacher ? html`<p>${tab === "practise" ? "Nothing to practise: no mistakes marked yet." : "No exercises yet."}</p>` : null}</div>`}
      </div>
    </div>`;
  }

  function WriteBoard({ canWrite, teacher, holder, name, ix, lessons }) {
    const wrapRef = useRef(null), cvRef = useRef(null), dusterRef = useRef(null), headRef = useRef(null);
    const [tool, setToolState] = useState("chalk");
    const toolRef = useRef(tool);
    toolRef.current = tool;
    const canRef = useRef(canWrite);
    canRef.current = canWrite;
    const [stamp, setStamp] = useState(0);
    const [full, setFull] = useState(false);
    const fullRef = useRef(false);
    fullRef.current = full;
    // If the phone won't turn sideways, turn the board ourselves so it still fills the screen.
    const [rot, setRot] = useState(false);
    const rotRef = useRef(false);
    rotRef.current = rot;
    const [, setVp] = useState(0);
    useEffect(() => {
      if (!full) { setRot(false); return; }
      const check = () => { setRot(window.innerHeight > window.innerWidth * 1.15); setVp(v => v + 1); };
      const t = setTimeout(check, 450);
      window.addEventListener("resize", check);
      return () => { clearTimeout(t); window.removeEventListener("resize", check); };
    }, [full]);
    const typingRef = useRef(null);
    const [, bump] = useState(0);
    const C = useCall();
    const kRef = useRef(1), cssK = useRef(1);
    const place = (el, x, y) => {
      const cv = cvRef.current;
      if (!el || !cv) return;
      el.style.opacity = "1";
      el.style.transform = "translate(" + (cv.offsetLeft + x * cssK.current) + "px," + (cv.offsetTop + y * cssK.current) + "px)";
    };
    const hide = el => { if (el) el.style.opacity = "0"; };
    const redraw = () => { const cv = cvRef.current; if (cv) renderAll(cv.getContext("2d"), kRef.current); };

    // typing on the board with the letter keyboard
    function sendText(t, done) { live.send({ type: "wb-text", id: t.id, text: t.text, x: t.x, y: t.y, h: t.h, done: !!done }); }
    function nextLine() { const n = wb.strokes.filter(s => s.tool === "text").length; return [140, 290, 430][n % 3]; }
    function typeEdit(fn) {
      let t = typingRef.current;
      if (!t) t = { id: uid(), tool: "text", text: "", x: 500, y: nextLine(), h: 120 };
      t = Object.assign({}, t, { text: fn(t.text).slice(0, 30) });
      typingRef.current = t;
      wb.open.set(t.id, t);
      redraw(); wb.emit({ kind: "redraw" }); bump(n => n + 1);
      sendText(t, false);
    }
    function commitTyping() {
      const t = typingRef.current;
      if (!t) return;
      typingRef.current = null;
      wb.open.delete(t.id);
      if (t.text.trim()) wb.commit(t);
      sendText(t, true);
      redraw(); wb.emit({ kind: "redraw" }); bump(n => n + 1);
    }
    function setTool(t) { if (toolRef.current === "type" && t !== "type") commitTyping(); setToolState(t); }
    useEffect(() => { if (!canWrite) { commitTyping(); setToolState("chalk"); } }, [canWrite]);
    useEffect(() => { if (!stamp) return; const t = setTimeout(() => setStamp(0), 2000); return () => clearTimeout(t); }, [stamp]);

    // full screen, turned sideways, so thumbs have room
    async function goFull() {
      setFull(true);
      try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) await el.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
    }
    function leaveFull() {
      setFull(false);
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    }
    useEffect(() => {
      const f = () => { if (!document.fullscreenElement && fullRef.current) { setFull(false); try { screen.orientation.unlock(); } catch (e) {} } };
      document.addEventListener("fullscreenchange", f);
      return () => {
        document.removeEventListener("fullscreenchange", f);
        commitTyping();
        if (fullRef.current) { try { screen.orientation.unlock(); } catch (e) {} try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} }
      };
    }, []);

    // size the canvas: the full width inline, or as big as fits when full screen
    useEffect(() => {
      const cv = cvRef.current, wrap = wrapRef.current;
      let last = "";
      const fit = () => {
        const W = wrap.clientWidth, H = wrap.clientHeight;
        const w = Math.floor(fullRef.current ? Math.min(W, H * WB_W / WB_H) : W);
        const key = w + ":" + (fullRef.current ? 1 : 0);
        if (!w || key === last) return;
        last = key;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(w * WB_H / WB_W * dpr);
        cv.style.width = w + "px"; cv.style.height = w * WB_H / WB_W + "px";
        kRef.current = cv.width / WB_W; cssK.current = w / WB_W;
        renderAll(cv.getContext("2d"), kRef.current);
      };
      wrap.__fit = fit;
      fit();
      const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
      if (ro) ro.observe(wrap);
      window.addEventListener("resize", fit);
      return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", fit); };
    }, []);
    useEffect(() => { const w = wrapRef.current; if (w && w.__fit) { requestAnimationFrame(() => w.__fit()); setTimeout(() => w.__fit(), 350); } }, [full, tool, rot]);

    // the other person's writing, typing, wiping and "good" arrive here
    useEffect(() => {
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let wiping = 0;
      const runWipe = () => {
        const path = wipePath(), s = { id: "wipe", tool: "rub", w: 200, hard: true, pts: [] };
        const total = path.length / 2, t0 = performance.now(), my = ++wiping;
        let done = 0;
        const step = now => {
          if (my !== wiping) return;
          const want = Math.min(total, Math.max(1, Math.ceil(((now - t0) / 1300) * total)));
          if (want > done) {
            const from = done;
            for (let i = done; i < want; i++) s.pts.push(path[i * 2], path[i * 2 + 1]);
            done = want;
            drawPts(ctx, s, kRef.current, from);
            place(dusterRef.current, path[(done - 1) * 2], path[(done - 1) * 2 + 1]);
          }
          if (done < total) requestAnimationFrame(step);
          else { hide(dusterRef.current); renderAll(ctx, kRef.current); }
        };
        requestAnimationFrame(step);
      };
      const f = evt => {
        const k = kRef.current;
        if (evt.kind === "seg") {
          drawPts(ctx, evt.s, k, evt.from);
          const p = evt.s.pts, n = p.length;
          if (n >= 2) place(evt.s.tool === "rub" ? dusterRef.current : headRef.current, p[n - 2], p[n - 1]);
        } else if (evt.kind === "end") { hide(headRef.current); hide(dusterRef.current); renderAll(ctx, k); }
        else if (evt.kind === "reset" || evt.kind === "redraw") renderAll(ctx, k);
        else if (evt.kind === "wipe") { typingRef.current = null; runWipe(); }
        else if (evt.kind === "good") setStamp(Date.now());
      };
      wb.listeners.add(f);
      return () => { wb.listeners.delete(f); wiping++; };
    }, []);

    // my own finger
    useEffect(() => {
      const cv = cvRef.current, ctx = cv.getContext("2d");
      let cur = null, queue = [], timer = null;
      const units = e => {
        const r = cv.getBoundingClientRect();
        if (rotRef.current) { const u = WB_W / r.height; return [Math.round((e.clientY - r.top) * u), Math.round((r.right - e.clientX) * u)]; }
        const u = WB_W / r.width;
        return [Math.round((e.clientX - r.left) * u), Math.round((e.clientY - r.top) * u)];
      };
      const flush = () => {
        timer = null;
        if (!cur || !queue.length) return;
        live.send({ type: "wb-seg", id: cur.id, tool: cur.tool, w: cur.w, pts: queue });
        queue = [];
      };
      const add = (x, y) => {
        x = Math.max(0, Math.min(WB_W, x)); y = Math.max(0, Math.min(WB_H, y));
        const p = cur.pts, n = p.length;
        if (n >= 2) { const dx = x - p[n - 2], dy = y - p[n - 1]; if (dx * dx + dy * dy < 9) return; }
        const from = n / 2;
        p.push(x, y); queue.push(x, y);
        drawPts(ctx, cur, kRef.current, from);
        wb.emit({ kind: "lseg", s: cur, from });
        if (cur.tool === "rub") place(dusterRef.current, x, y);
        if (!timer) timer = setTimeout(flush, 70);
      };
      const down = e => {
        if (!canRef.current || cur) return;
        e.preventDefault();
        const t = toolRef.current;
        if (t === "type") {
          // tap where the next word should go
          const [x, y] = units(e);
          const tt = typingRef.current;
          if (tt) { typingRef.current = Object.assign({}, tt, { x, y }); wb.open.set(tt.id, typingRef.current); redraw(); wb.emit({ kind: "redraw" }); sendText(typingRef.current, false); }
          else { typingRef.current = { id: uid(), tool: "text", text: "", x, y, h: 120 }; }
          return;
        }
        try { cv.setPointerCapture(e.pointerId); } catch (x) {}
        cur = { id: uid(), tool: t, w: WB_SIZE[t], pts: [] };
        wb.open.set(cur.id, cur);
        const [x, y] = units(e);
        add(x, y);
      };
      const move = e => {
        if (!cur) return;
        e.preventDefault();
        const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        for (const ev of list && list.length ? list : [e]) { const [x, y] = units(ev); add(x, y); }
      };
      const up = () => {
        if (!cur) return;
        clearTimeout(timer);
        flush();
        const s = cur;
        cur = null;
        wb.open.delete(s.id);
        wb.commit(s);
        wb.emit({ kind: "lend", s });
        live.send({ type: "wb-end", id: s.id, tool: s.tool, w: s.w, pts: s.pts });
        hide(dusterRef.current);
        renderAll(ctx, kRef.current);
      };
      cv.addEventListener("pointerdown", down);
      cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerup", up);
      cv.addEventListener("pointercancel", up);
      return () => {
        cv.removeEventListener("pointerdown", down); cv.removeEventListener("pointermove", move);
        cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up);
      };
    }, []);

    const mine = !teacher && canWrite;
    const sz = full ? 22 : 16;
    const toolList = canWrite ? [["chalk", Ic.chalk, "Chalk"], ["rub", Ic.duster, "Duster"], ["type", Ic.keys, "Type"]] : [];
    const label = (t) => (teacher ? t : null);
    const toolBtns = toolList.map(([k, I, t]) => html`<button key=${k} class=${"tool" + (tool === k ? " on" : "")} onClick=${() => setTool(k)} aria-label=${t}><${I} size=${sz}/>${label(t)}</button>`);
    const rotStyle = rot ? "width:" + window.innerHeight + "px;height:" + window.innerWidth + "px;left:" + window.innerWidth + "px" : "";
    return html`<div class=${"wbwrap" + (full ? " full" : "") + (rot ? " rot" : "")} style=${rotStyle}>
      ${teacher || full ? html`<div class=${"wbtools" + (full ? " side" : "")}>
        ${full
          ? html`<button class="tool exit" onClick=${leaveFull} aria-label="Smaller board"><${Ic.shrink} size=${sz}/>${label("Smaller")}</button>`
          : html`<button class="tool" onClick=${goFull}><${Ic.expand} size=${sz}/>Full screen</button>`}
        ${toolBtns}
        ${teacher ? html`
          <button class="tool" onClick=${() => { commitTyping(); live.wipe(); }} aria-label="Wipe board"><${Ic.wipe} size=${sz}/>${full ? "Wipe" : "Wipe board"}</button>
          <button class=${"tool" + (holder === "student" ? " on" : "")} onClick=${() => live.setHolder(holder === "student" ? "teacher" : "student")}><${Ic.chalk} size=${sz}/>${holder === "student" ? "Take the chalk back" : "Give " + name + " the chalk"}</button>
          <button class="tool good" onClick=${() => live.good()} aria-label="Good"><${Ic.tick} size=${sz} sw=${2.6}/>Good</button>` : null}
        ${full && C.joined ? html`<button class=${"tool" + (C.muted ? " on" : "")} onClick=${() => call.toggleMute()} aria-label=${C.muted ? "Unmute" : "Mute"}>${C.muted ? html`<${Ic.micoff} size=${sz}/>` : html`<${Ic.mic} size=${sz}/>`}${label(C.muted ? "Unmute" : "Mute")}</button>` : null}
      </div>` : null}
      <div class="wbmain">
        <div class=${"wb" + (mine ? " mine" : "") + (canWrite ? " can" : "") + (tool === "type" && canWrite ? " typing" : "")} ref=${wrapRef}>
          <canvas ref=${cvRef} aria-label="Writing board"></canvas>
          <div class="wbduster" ref=${dusterRef} aria-hidden="true"><i></i></div>
          <div class="wbhead" ref=${headRef} aria-hidden="true"><i></i></div>
          ${mine && !full ? html`<div class="wbhint" aria-hidden="true"><${Ic.chalk} size=${30}/></div>` : null}
          ${stamp ? html`<div class="wbstamp" key=${stamp} aria-label="Good"><${Ic.tick} size=${72} sw=${3}/></div>` : null}
          ${!full && !teacher ? html`<button class="wbexpand" onClick=${goFull} aria-label="Make the board bigger"><${Ic.expand} size=${22}/></button>` : null}
        </div>
        ${!full ? html`<div class="ledge"><i></i></div>` : null}
        ${canWrite && tool === "type" ? html`<${LetterKeys} ix=${ix} lessons=${lessons} compact=${full}
          onKey=${ch => typeEdit(t => t + ch)} onBack=${() => typeEdit(t => t.slice(0, -1))} onDone=${commitTyping}/>` : null}
        ${!full && mine ? html`<div class="stools">
          ${toolList.map(([k, I, t]) => html`<button key=${k} class=${"big" + (tool === k ? "" : " alt")} onClick=${() => setTool(k)} aria-label=${t}><${I} size=${28}/></button>`)}
        </div>` : null}
      </div>
    </div>`;
  }

  // In-app voice: a direct phone-to-phone audio call (WebRTC). Signals travel over the live channel;
  // a relay (TURN) from the Netlify function keeps it working on mobile data.
  const call = {
    pc: null, mic: null, remoteStream: null, audioEl: null, gen: 0, pending: [], role: null, joined: false,
    ice: null, iceAt: 0, relay: null, lastOffer: 0, restartT: null, loopT: null, answerT: null, wake: null,
    st: { phase: "idle", muted: false, since: 0, peerMuted: false, error: "" },
    subs: new Set(),
    set(p) { this.st = Object.assign({}, this.st, p); this.subs.forEach(f => f(this.st)); },
    async iceServers() {
      if (this.ice && Date.now() - this.iceAt < 6 * 3600 * 1000) return this.ice;
      const base = [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }];
      try {
        const r = await fetch("/.netlify/functions/turn", { method: "POST" });
        if (r.ok) {
          const j = await r.json();
          if (j && Array.isArray(j.iceServers) && j.iceServers.some(s => [].concat(s.urls).some(u => /^turns?:/.test(u)))) {
            this.ice = j.iceServers; this.iceAt = Date.now(); this.relay = true;
            return this.ice;
          }
        }
      } catch (e) {}
      this.relay = false;
      return base;
    },
    async getMic() {
      if (this.mic && this.mic.getAudioTracks().some(t => t.readyState === "live")) return this.mic;
      this.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      this.applyMute();
      classRec.addSource(this.mic);
      return this.mic;
    },
    ensureAudio() {
      if (!this.audioEl) {
        const a = document.createElement("audio");
        a.autoplay = true; a.setAttribute("playsinline", "");
        a.style.display = "none";
        document.body.appendChild(a);
        this.audioEl = a;
      }
      return this.audioEl;
    },
    closePc() {
      const pc = this.pc;
      this.pc = null;
      if (pc) { try { pc.ontrack = null; pc.onicecandidate = null; pc.onconnectionstatechange = null; pc.oniceconnectionstatechange = null; pc.close(); } catch (e) {} }
    },
    async makePc() {
      const ice = await this.iceServers();
      const mic = await this.getMic();
      const pc = new RTCPeerConnection({ iceServers: ice });
      this.pc = pc;
      mic.getAudioTracks().forEach(t => pc.addTrack(t, mic));
      pc.onicecandidate = e => { if (e.candidate && this.pc === pc) this.sendRtc({ kind: "ice", cand: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
      pc.ontrack = e => {
        const stream = (e.streams && e.streams[0]) || new MediaStream([e.track]);
        this.remoteStream = stream;
        const a = this.ensureAudio();
        a.srcObject = stream;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        classRec.addSource(stream);
      };
      pc.onconnectionstatechange = () => { if (this.pc === pc) this.onState(); };
      pc.oniceconnectionstatechange = () => { if (this.pc === pc) this.onState(); };
      return pc;
    },
    sendRtc(p) { live.send(Object.assign({ type: "rtc", gen: this.gen }, p)); },
    async flush() {
      const list = this.pending; this.pending = [];
      for (const c of list) { try { await this.pc.addIceCandidate(c); } catch (e) {} }
    },
    onState() {
      const pc = this.pc; if (!pc) return;
      const cs = pc.connectionState, is = pc.iceConnectionState;
      if (cs === "connected" || is === "connected" || is === "completed") {
        clearTimeout(this.restartT); clearTimeout(this.answerT);
        if (this.st.phase !== "connected") this.set({ phase: "connected", since: this.st.since || Date.now(), error: "" });
      } else if (cs === "failed" || is === "failed") {
        this.set({ phase: "reconnecting" });
        this.recover();
      } else if (cs === "disconnected" || is === "disconnected") {
        this.set({ phase: "reconnecting" });
        clearTimeout(this.restartT);
        this.restartT = setTimeout(() => this.recover(), 4000);
      }
    },
    recover() {
      if (!this.joined) return;
      if (this.role === "teacher") { this.lastOffer = 0; this.offer(); }
      else this.sendRtc({ kind: "ready" });
    },
    loop(kind) {
      clearInterval(this.loopT);
      this.loopT = setInterval(() => { if (this.joined && this.st.phase !== "connected") this.sendRtc({ kind }); }, 5000);
    },
    // ---------- teacher ----------
    async teacherStart() {
      this.role = "teacher";
      await this.getMic();
      this.joined = true;
      this.set({ phase: "waiting", error: "" });
      this.keepAwake();
      this.sendRtc({ kind: "invite" });
      this.loop("invite");
    },
    async offer() {
      if (!this.joined || Date.now() - this.lastOffer < 2500) return;
      this.lastOffer = Date.now();
      this.closePc();
      this.pending = [];
      this.gen = Date.now();
      const gen = this.gen;
      const pc = await this.makePc();
      if (this.gen !== gen) return;
      const o = await pc.createOffer();
      await pc.setLocalDescription(o);
      this.sendRtc({ kind: "offer", sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
      if (this.st.phase !== "connected") this.set({ phase: this.st.phase === "reconnecting" ? "reconnecting" : "connecting" });
      clearTimeout(this.answerT);
      this.answerT = setTimeout(() => { if (this.joined && this.st.phase === "connecting") this.set({ phase: "waiting" }); }, 15000);
    },
    // ---------- student ----------
    async studentJoin() {
      this.role = "student";
      await this.getMic();
      this.joined = true;
      const a = this.ensureAudio(); const p = a.play(); if (p && p.catch) p.catch(() => {});
      this.set({ phase: "connecting", error: "" });
      this.keepAwake();
      this.sendRtc({ kind: "ready" });
      this.loop("ready");
    },
    async onRtc(m) {
      try {
        if (m.kind === "invite") { if (this.role === "student" && this.joined && this.st.phase !== "connected") this.sendRtc({ kind: "ready" }); }
        else if (m.kind === "ready") { if (this.role === "teacher" && this.joined) await this.offer(); }
        else if (m.kind === "offer") {
          if (this.role !== "student" || !this.joined) return;
          this.closePc();
          this.pending = [];
          this.gen = m.gen;
          const gen = m.gen;
          const pc = await this.makePc();
          if (this.gen !== gen) return;
          await pc.setRemoteDescription(m.sdp);
          await this.flush();
          const a = await pc.createAnswer();
          await pc.setLocalDescription(a);
          this.sendRtc({ kind: "answer", sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
        } else if (m.kind === "answer") {
          if (this.role === "teacher" && this.pc && m.gen === this.gen && !this.pc.remoteDescription) { await this.pc.setRemoteDescription(m.sdp); await this.flush(); }
        } else if (m.kind === "ice") {
          if (m.gen !== this.gen) return;
          if (this.pc && this.pc.remoteDescription) { try { await this.pc.addIceCandidate(m.cand); } catch (e) {} }
          else this.pending.push(m.cand);
        } else if (m.kind === "bye") {
          this.closePc();

      const w = Math.max(1, Math.round(img.naturalWidth * scale)), hh = Math.max(1, Math.round(img.naturalHeight * scale));

      c.width = w; c.height = hh;
      c.getContext("2d").drawImage(img, 0, 0, w, hh);
      const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.74));
      if (blob) return blob;
      if (/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      throw new Error("encode");
    } finally { URL.revokeObjectURL(url); }

      const el = rail.querySelectorAll(".dot")[vIdx]; if (!el) return;
      const left = el.offsetLeft - rail.clientWidth / 2 + el.clientWidth / 2;
      try { rail.scrollTo({ left, behavior: "smooth" }); } catch (e) { rail.scrollLeft = left; }
    }, [vIdx, lessons.length]);
    return html`<nav class="rail" ref=${ref} aria-label="Lessons">${onBook ? html`<button class="railbook" onClick=${onBook} aria-label="My exercise book"><${Ic.book} size=${22}/></button>` : null}${lessons.map((l, i) => {
      const state = i < uIdx ? "done" : i === uIdx ? "cur" : "locked";
      const can = teacher || i <= uIdx;
      return html`<button key=${l.id} class=${"dot " + state + (i === vIdx ? " view" : "") + (teacher && i === vIdx ? " tview" : "")} disabled=${!can} onClick=${() => onPick(l.id)} aria-label=${"Lesson " + (i + 1)} aria-current=${i === vIdx ? "true" : null}>
        ${i + 1}
        ${state === "done" ? html`<span class="tk"><${Ic.tick} size=${13} sw=${3.2}/></span>` : null}
        ${unreadBy[l.id] ? html`<span class="bd"></span>` : null}
      </button>`;
    })}</nav>`;
  }

  function Voice({ m, pst }) {
    const key = "msg:" + (m.cid || m.id);
    const on = pst.key === key;
    const dur = m.secs || (on ? pst.dur : 0);
    const frac = on && dur ? Math.min(1, pst.cur / dur) : 0;
    const bars = useMemo(() => waveBars(m.cid || m.id, 26), [m.cid || m.id]);
    const src = m.localUrl || (m.asset ? srcFor(m.asset) : null);
    return html`<div class="voice">
      <button class="vplay" disabled=${!src} onClick=${() => src && player.play(key, src)} aria-label=${on && pst.playing ? "Pause" : "Play"}>
        ${on && pst.playing ? html`<${Ic.pause} size=${20}/>` : html`<${Ic.play} size=${20}/>`}
      </button>
      <div class="wave">${bars.map((b, i) => html`<i key=${i} class=${(i + 0.5) / bars.length <= frac ? "f" : ""} style=${"height:" + b + "%"}></i>`)}</div>
      <span class="vdur">${fmtDur(on && pst.cur > 0 ? pst.cur : dur)}</span>
    </div>`;
  }

  function Meta({ m, me, teacher, onDel, onRetry }) {
    const [arm, setArm] = useState(false);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 3500); return () => clearTimeout(t); }, [arm]);
    return html`<div class="meta">
      ${m.pending ? (m.state === "fail"
        ? html`<button class="failbtn" onClick=${onRetry} aria-label="Not sent. Try again">!</button>`
        : html`<span class="spin" aria-label="Sending"></span>`) : null}
      <span>${fmtClock(m.at)}</span>
      ${me && !m.pending ? html`<span class=${"ticks" + (m.seen ? " seen" : "")} aria-label=${m.seen ? "Seen" : "Sent"}>${m.seen ? "✓✓" : "✓"}</span>` : null}
      ${teacher && !m.pending ? html`<button class=${"delbtn" + (arm ? " arm" : "")} onClick=${() => (arm ? onDel() : setArm(true))} aria-label="Delete message">${arm ? "Delete?" : html`<${Ic.trash} size=${15}/>`}</button>` : null}
    </div>`;
  }

  function Msg({ m, role, teacher, pst, lessons, onGoto, onRetry, onDel, onPhoto, msgs, onHw, onAns }) {
    if (m.kind === "hwmark") return null;
    if (m.kind === "hw" || m.kind === "hwans") {
      const mine = m.from === role;
      return html`<div class=${"msg " + (mine ? "me" : "them")}>
        ${m.kind === "hw" ? html`<${HwCard} m=${m} msgs=${msgs || []} teacher=${teacher} onOpen=${() => onHw && onHw(m)}/>` : html`<${AnsChip} m=${m} msgs=${msgs || []} teacher=${teacher} onOpen=${() => onAns && onAns(m)}/>`}
        <${Meta} m=${m} me=${mine} teacher=${teacher} onDel=${onDel} onRetry=${onRetry}/>
      </div>`;
    }
    const me = m.from === role;
    if (m.kind === "pass") {
      const ni = m.next ? lessons.findIndex(l => l.id === m.next) : -1;
      return html`<div class="stamp">
        <div class="stamp-ring" aria-label="Lesson passed"><${Ic.tick} size=${54} sw=${3}/></div>
        ${ni >= 0 ? html`<button class="nextbtn" onClick=${() => onGoto(m.next)} aria-label=${"Go to lesson " + (ni + 1)}><span>${ni + 1}</span><${Ic.arrow} size=${26} sw=${2.6}/></button>` : null}
        ${teacher ? html`<${Meta} m=${m} me=${true} teacher=${true} onDel=${onDel}/>` : null}
      </div>`;
    }
    const photoSrc = m.localUrl || (m.asset ? srcFor(m.asset) : null);
    return html`<div class=${"msg " + (me ? "me" : "them")}>
      <div class=${"bub" + (m.hw ? " hw" : "")}>
        ${m.hw ? html`<span class="hwtag"><${Ic.book} size=${18}/>Homework</span>` : null}
        ${m.point && m.point.length ? html`<div class="pts" aria-label="Pointing at">${m.point.map(p => html`<span key=${p}>👉 ${p}</span>`)}</div>` : null}
        ${m.kind === "voice" ? html`<${Voice} m=${m} pst=${pst}/>` : null}
        ${m.kind === "photo" && photoSrc ? html`<img class="ph" src=${photoSrc} alt="Photo" loading="lazy" onClick=${() => onPhoto(photoSrc)}/>` : null}
        ${m.kind === "text" ? html`<div class="txt">${m.text}</div>` : null}
      </div>
      <${Meta} m=${m} me=${me} teacher=${teacher} onDel=${onDel} onRetry=${onRetry}/>
    </div>`;
  }

  function Listen({ lesson, pst, turn, onResume }) {
    const key = "explain:" + lesson.id;
    const on = pst.key === key;
    const dur = lesson.explainSecs || (on ? pst.dur : 0);
    const frac = on && dur ? Math.min(1, pst.cur / dur) : 0;
    const C = 2 * Math.PI * 35;
    const ring = html`<svg class="ring" viewBox="0 0 78 78" aria-hidden="true"><circle class="rbg" cx="39" cy="39" r="35"/><circle class="rfg" cx="39" cy="39" r="35" style=${"stroke-dasharray:" + C + ";stroke-dashoffset:" + C * (1 - frac)}/></svg>`;
    if (turn) {
      return html`<div class="listen">
        ${turn.cue.tile
          ? html`<button class="big grey" onClick=${onResume} aria-label="Skip this question">${ring}<${Ic.hand} size=${30}/></button>`
          : html`<button class="big turnbtn" onClick=${onResume} aria-label="Continue">${ring}<${Ic.play} size=${30}/></button>`}
      </div>`;
    }
    return html`<div class="listen">
      <button class="big" disabled=${!lesson.explain} onClick=${() => lesson.explain && player.play(key, srcFor(lesson.explain))} aria-label=${on && pst.playing ? "Pause the teacher" : "Play the teacher"}>
        ${ring}
        ${on && pst.playing ? html`<${Ic.pause} size=${30}/>` : html`<${Ic.play} size=${30}/>`}
      </button>
      ${on ? html`<button class="mid" onClick=${() => player.seek(-10)} aria-label="Back 10 seconds"><${Ic.replay} size=${24}/></button>` : null}
    </div>`;
  }

  /* ================= composer (bottom bar) ================= */
  function Composer({ teacher, lesson, pst, canSend, onSend, points, setPoints, hw, setHw, turn, onResume }) {
    const [mode, setMode] = useState("idle");
    const [t0, setT0] = useState(0);
    const [now, setNow] = useState(0);
    const [take, setTake] = useState(null);
    const [photo, setPhoto] = useState(null);
    const [text, setText] = useState("");
    const recRef = useRef(null), streamRef = useRef(null), camRef = useRef(null), audRef = useRef(null), taRef = useRef(null);

    useEffect(() => { if (mode !== "rec") return; const i = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(i); }, [mode]);
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(streamRef.current); }, []);
    useEffect(() => { reset(); }, [lesson.id]);

    function reset() {
      if (recRef.current) { recRef.current.cancel(); recRef.current = null; }
      recorder.close(streamRef.current); streamRef.current = null;
      if (player.key === "take") player.stop();
      setTake(null); setMode("idle"); setPoints(null);
    }
    function micTap() {
      if (recorder.blocked) { audRef.current && audRef.current.click(); return; }
      startRec();
    }
    async function startRec() {
      player.stop();
      tilePlayer.stop();
      try {
        const st = await recorder.open();
        streamRef.current = st;
        recRef.current = recorder.start(st);
        setT0(Date.now()); setNow(Date.now()); setMode("rec");
        if (!teacher) setPoints([]);
      } catch (e) {
        toast("The microphone isn't available here. Tap the mic again to use your phone's recorder.");
        recorder.blocked = true;
      }
    }
    async function stopRec() {
      const r = recRef.current; recRef.current = null;
      if (!r) return;
      const out = await r.stop();
      recorder.close(streamRef.current); streamRef.current = null;
      if (out.secs < 0.8 || !out.blob.size) { setMode("idle"); setPoints(null); toast("That was too short. Tap the mic, talk, then tap stop."); return; }
      setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
      setMode("review");
    }
    function sendTake() {
      const tk = take;
      if (player.key === "take") player.stop();
      setTake(null); setMode("idle");
      onSend({ kind: "voice", blob: tk.blob, secs: tk.secs, point: points || [] });
      setPoints(null);
    }
    async function onPhotoFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      try { const blob = await compressImage(f); setPhoto({ blob, url: URL.createObjectURL(blob) }); }
      catch (err) { toast("That photo couldn't be opened. Try taking it again."); }
    }
    async function onAudioFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      try {
        toast("Getting the recording ready…");
        const out = await audioFromFile(f);
        setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) });
        setMode("review");
      } catch (err) { toast(errText(err, "That recording couldn't be used. Try again.")); }
    }
    function sendText() {
      const tx = text.trim(); if (!tx) return;
      setText("");
      if (taRef.current) { taRef.current.style.height = ""; }
      onSend({ kind: "text", text: tx });
    }

    const inputs = html`
      <input ref=${camRef} type="file" accept="image/*" capture=${teacher ? null : "environment"} style="display:none" onChange=${onPhotoFile}/>
      <input ref=${audRef} type="file" accept="audio/*" capture="" style="display:none" onChange=${onAudioFile}/>`;

    let bar;
    if (mode === "rec") {
      bar = html`<div class="bar"><div class="bar-in">
        <button class="big grey" onClick=${reset} aria-label="Cancel recording"><${Ic.x} size=${28}/></button>
        <div class="recind" role="timer"><span class="recdot"></span>${fmtDur((now - t0) / 1000)}</div>
        <button class="big red" onClick=${stopRec} aria-label="Stop recording"><${Ic.stop} size=${28}/></button>
      </div></div>`;
    } else if (mode === "review" && take) {
      const on = pst.key === "take";
      bar = html`<div class="bar"><div class="bar-in">
        <button class="big grey" onClick=${reset} aria-label="Delete this recording"><${Ic.trash} size=${28}/></button>
        <div class="take">
          <button class="vplay" onClick=${() => player.play("take", take.url)} aria-label="Listen before sending">${on && pst.playing ? html`<${Ic.pause} size=${20}/>` : html`<${Ic.play} size=${20}/>`}</button>
          <span class="vdur">${fmtDur(on && pst.cur > 0 ? pst.cur : take.secs)}</span>
        </div>
        <button class="big" onClick=${sendTake} aria-label="Send"><${Ic.send} size=${28}/></button>
      </div></div>`;
    } else if (teacher) {
      bar = html`<div class="bar t"><div class="bar-in">
        <button class=${"hwbtn" + (hw ? " on" : "")} onClick=${() => setHw(!hw)} aria-pressed=${hw ? "true" : "false"} aria-label="Mark as homework"><${Ic.book} size=${22}/></button>
        <textarea ref=${taRef} class="tin" rows="1" placeholder=${hw ? "Homework for this lesson" : "Message"} value=${text} onInput=${e => { setText(e.target.value); autosize(e.target); }}></textarea>
        <button class="big alt" onClick=${() => camRef.current && camRef.current.click()} aria-label="Send a photo"><${Ic.cam} size=${24}/></button>
        ${text.trim()
          ? html`<button class="big" onClick=${sendText} aria-label="Send message"><${Ic.send} size=${24}/></button>`
          : html`<button class="big" onClick=${micTap} aria-label="Record a voice note"><${Ic.mic} size=${24}/></button>`}
      </div></div>`;
    } else {
      bar = html`<div class="bar"><div class="bar-in">
        <${Listen} lesson=${lesson} pst=${pst} turn=${turn} onResume=${onResume}/>
        <div class="grow"></div>
        ${canSend ? html`
          <button class="big alt" onClick=${() => camRef.current && camRef.current.click()} aria-label="Send a photo"><${Ic.cam} size=${30}/></button>
          <button class="big" onClick=${micTap} aria-label="Record a voice note"><${Ic.mic} size=${30}/></button>`
          : html`<span class="nosend"><${Ic.lock} size=${18}/>Can listen, can't send yet</span>`}
      </div></div>`;
    }
    return html`${inputs}${bar}
      ${points && points.length && (mode === "rec" || mode === "review") ? html`<div class="pointbar">${points.map(p => html`<span key=${p}>👉 ${p}</span>`)}</div>` : null}
      ${photo ? html`<div class="lb" role="dialog" aria-label="Photo to send">
        <div class="imgwrap"><img src=${photo.url} alt="Photo to send"/></div>
        <div class="bar"><div class="bar-in">
          <button class="big grey" onClick=${() => { URL.revokeObjectURL(photo.url); setPhoto(null); }} aria-label="Delete this photo"><${Ic.trash} size=${28}/></button>
          <div class="grow"></div>
          <button class="big" onClick=${() => { const p = photo; setPhoto(null); onSend({ kind: "photo", blob: p.blob, localUrl: p.url }); }} aria-label="Send photo"><${Ic.send} size=${28}/></button>
        </div></div>
      </div>` : null}`;
  }

  /* ================= the classroom ================= */
  const markedSeen = new Set();
  function Room({ s, ix, student, mode, onBack, startEditing }) {
    const teacher = mode === "teacher";
    const role = teacher ? "teacher" : "student";
    const lessons = s.lessons;
    const pst = usePlayer();
    const tkey = useTileKey();
    const Lraw = useLive();
    const L = teacher && Lraw.sid !== student.id ? LIVE_OFF : Lraw;
    const uFound = lessons.findIndex(l => l.id === student.unlocked);
    const uIdx = uFound >= 0 ? uFound : 0;
    const [viewId, setViewId] = useState(() => (lessons[uIdx] ? lessons[uIdx].id : null));
    let vIdx = lessons.findIndex(l => l.id === viewId);
    const liveView = !teacher && L.on && vIdx >= 0 && lessons[vIdx].id === L.lesson;
    if (vIdx < 0 || (!teacher && vIdx > uIdx && !liveView)) vIdx = uIdx;
    const lesson = lessons[vIdx];
    const [pending, setPending] = useState([]);
    const [points, setPoints] = useState(null);
    const [hw, setHw] = useState(false);
    const [lightbox, setLightbox] = useState(null);
    const [editing, setEditing] = useState(!!startEditing);
    const [hwEdit, setHwEdit] = useState(false);
    const [hwRun, setHwRun] = useState(null);
    const [hwRev, setHwRev] = useState(null);
    const [bookOpen, setBookOpen] = useState(false);
    function openHw(hw) {
      const a = answersFor(hw.id, s.msgs.filter(x => x.student === student.id));
      if (teacher) { if (a) setHwRev(a); else setHwRun({ hw, preview: true }); }
      else setHwRun({ hw });
    }
    function openAns(a) {
      if (teacher) { setHwRev(a); return; }
      const hw = s.msgs.find(x => x.id === hwData(a).hw);
      if (hw) setHwRun({ hw });
    }
    const [endVis, setEndVis] = useState(false);
    const [vis, setVis] = useState(document.visibilityState !== "hidden");
    const [turn, setTurn] = useState(null);
    const [flash, setFlash] = useState(null);
    const endRef = useRef(null);
    const uploaded = useRef(new Map());
    const lid = lesson ? lesson.id : null;

    const mine = s.msgs.filter(m => m.student === student.id);
    const cids = new Set(mine.map(m => m.cid).filter(Boolean));
    const unsent = pending.filter(p => !cids.has(p.cid));
    const thread = mine.filter(m => m.lesson === lid).concat(unsent.filter(p => p.lesson === lid)).sort((a, b) => a.at - b.at);
    const unreadBy = {};
    for (const m of mine) if (m.from !== role && !m.seen) unreadBy[m.lesson] = (unreadBy[m.lesson] || 0) + 1;
    const unreadHere = lid ? unreadBy[lid] || 0 : 0;
    const unseenIds = thread.filter(m => !m.pending && m.from !== role && !m.seen).map(m => m.id);

    useEffect(() => { if (pending.some(p => cids.has(p.cid))) setPending(ps => ps.filter(p => !cids.has(p.cid))); }, [s.msgs]);
    const explCue = useCueSync("explain:" + lid, lesson ? lesson.cues : null, true, c => setTurn({ cue: c, tries: 0 }), pst);
    useEffect(() => { player.stop(); tilePlayer.stop(); setTurn(null); setFlash(null); window.scrollTo(0, 0); }, [lid]);
    useEffect(() => { if (!flash) return; const t = setTimeout(() => setFlash(null), 800); return () => clearTimeout(t); }, [flash]);
    // live class
    useEffect(() => {
      if (!teacher) { live.join(student.id, "student"); return; }
      if (!live.st.on) live.join(student.id, "teacher");
      return () => { if (!live.st.on) live.leave(); };
    }, [student.id, role]);
    useEffect(() => {
      if (teacher || !s.hasLive) return;
      const row = (s.live || []).find(r => r.id === student.id && Date.now() - (r.updatedAt || 0) < LIVE_STALE);
      live.classFromDb(row || null);
    }, [s.live, s.hasLive]);
    useEffect(() => { if (!teacher && L.on && L.lesson && L.lesson !== viewId && lessons.some(l => l.id === L.lesson)) setViewId(L.lesson); }, [L.on, L.lesson]);
    useEffect(() => { if (teacher && L.on && lid) live.setLesson(lid); }, [lid, L.on]);
    useEffect(() => {
      if (!teacher) live.onSound = (tile, lessonId) => { const x = soundFor(ix, lessonId, tile); if (x) tilePlayer.play("tile:" + lessonId + ":" + tile, srcFor(x.rec.audio)); };
    });
    useEffect(() => {
      if (!lesson) return;
      const ids = [];
      for (const t of uniqueTiles(parseBoard(lesson.board))) { const x = soundFor(ix, lesson.id, t.t); if (x) ids.push(x.rec.audio); }
      prefetch(ids.slice(0, 160));
    }, [lid, lesson && lesson.board, s.recs]);
    useEffect(() => {
      const f = () => setVis(document.visibilityState !== "hidden");
      document.addEventListener("visibilitychange", f);
      return () => document.removeEventListener("visibilitychange", f);
    }, []);
    useEffect(() => {
      const el = endRef.current;
      if (!el || !("IntersectionObserver" in window)) { setEndVis(true); return; }
      const io = new IntersectionObserver(es => setEndVis(es[0].isIntersecting), { rootMargin: "0px 0px -96px 0px" });
      io.observe(el);
      return () => io.disconnect();
    }, [lid]);
    useEffect(() => {
      if (!vis || !endVis || !unseenIds.length) return;
      const todo = unseenIds.filter(id => !markedSeen.has(id));
      if (!todo.length) return;
      todo.forEach(id => markedSeen.add(id));
      (async () => {
        for (const id of todo) {
          try { await update("msgs/" + id, { seen: true }); } catch (e) { /* read-only viewer: leave it */ }
        }
      })();
    }, [vis, endVis, unseenIds.join(",")]);

    if (!lesson) return html`<${Waiting} onBack=${onBack}/>`;

    const scrollEnd = () => requestAnimationFrame(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior: "smooth", block: "end" }); });

    async function deliver(p) {
      setPending(ps => ps.map(x => (x.cid === p.cid ? Object.assign({}, x, { state: "up" }) : x)));
      try {
        let asset = uploaded.current.get(p.cid) || null;
        if (p.blob && !asset) { asset = await uploadBlob(p.blob); uploaded.current.set(p.cid, asset); }
        await retry(() => rt.db.collection("msgs").doc().set({
          student: p.student, lesson: p.lesson, from: p.from, kind: p.kind, asset: asset || null,
          secs: round1(p.secs), text: p.text || "", hw: !!p.hw, point: p.point || [], seen: false, at: p.at, cid: p.cid,
        }));
      } catch (e) {
        setPending(ps => ps.map(x => (x.cid === p.cid ? Object.assign({}, x, { state: "fail" }) : x)));
        toast(errText(e, "Not sent. Tap the red mark to try again."));
      }
    }
    function send(item) {
      const cid = uid();
      const p = {
        id: "p_" + cid, cid, pending: true, state: "up", student: student.id, lesson: lesson.id, from: role,
        kind: item.kind, secs: item.secs || 0, text: item.text || "", hw: teacher && hw, point: item.point || [],
        at: Date.now(), blob: item.blob || null, localUrl: item.localUrl || (item.blob ? URL.createObjectURL(item.blob) : null),
      };
      setPending(ps => ps.concat(p));
      scrollEnd();
      deliver(p);
    }
    async function delMsg(m) {
      try {
        await remove("msgs/" + m.id);
        if (m.asset && rt.assets) { try { await rt.assets.delete(m.asset); } catch (e) {} }
      } catch (e) { toast(errText(e)); }
    }
    function resume() {
      setTurn(null);
      if (player.key === "explain:" + lid && player.a) player.a.play().catch(() => {});
    }
    function onTile(t, snd, r, c) {
      if (points) { setPoints(ps => (ps.indexOf(t.t) >= 0 ? ps.filter(x => x !== t.t) : ps.concat(t.t).slice(-6))); return; }
      if (turn && turn.cue.tile) {
        const ok = t.t === turn.cue.tile;
        setFlash({ r, c, ok });
        chime(ok);
        if (ok) setTimeout(resume, 700);
        else setTurn(x => (x ? Object.assign({}, x, { tries: x.tries + 1 }) : x));
        return;
      }
      if (teacher && L.on) { live.point(t.t, r, c, lid); return; }
      if (snd) tilePlayer.play("tile:" + lid + ":" + t.t, srcFor(snd.rec.audio));
      if (!teacher && L.on) live.spoint(t.t, r, c, lid);
    }
    async function pass() {
      const next = lessons[uIdx + 1];
      try {
        if (next) await update("students/" + student.id, { unlocked: next.id });
        await retry(() => rt.db.collection("msgs").doc().set({
          student: student.id, lesson: lesson.id, from: "teacher", kind: "pass", asset: null, secs: 0, text: "",
          hw: false, point: [], seen: false, at: Date.now(), cid: uid(), next: next ? next.id : null,
        }));
        toast(next ? "Passed. Lesson " + (uIdx + 2) + " is now open." : "Passed. That was the last lesson.");
        scrollEnd();
      } catch (e) { toast(errText(e)); }
    }
    async function startClass() {
      if (store.s.needsUpdate || !store.s.hasLive) { toast("Do the one-time database update first. It's at the top of your home screen."); return; }

        cue=${explCue || livePoint} mark=${liveMark} turn=${!!turn} flash=${flash} hint=${hint} follow=${!!explCue && pst.playing}/>`}

  /* ================= teacher screens ================= */
  function StudentSheet({ student, onClose, onDeleted }) {

    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 3500); return () => clearTimeout(t); }, [arm]);
    const save = patch => update("students/" + student.id, patch).catch(e => toast(errText(e)));

  const cueCount = cues => {
    const np = (cues || []).filter(c => c.k === "p").length, nw = (cues || []).filter(c => c.k === "w").length;
    return np + " point" + (np === 1 ? "" : "s") + ", " + nw + " your-turn" + (nw === 1 ? "" : "s");
  };
  function ExplainRecorder({ lesson, pst, onStudio }) {
    const [mode, setMode] = useState("idle");
    const [take, setTake] = useState(null);
    const [arm, setArm] = useState(false);
    const fileRef = useRef(null);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 3500); return () => clearTimeout(t); }, [arm]);
    const withCues = (patch, cues) => (store.s.needsUpdate ? patch : Object.assign(patch, { cues }));
    async function onFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
      try { toast("Getting the recording ready…"); const out = await audioFromFile(f); setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) }); setMode("review"); }
      catch (err) { toast(errText(err, "That file couldn't be used.")); }
    }
    function cancel() { if (player.key === "etake") player.stop(); setTake(null); setMode("idle"); }
    async function save() {
      const tk = take;
      if (player.key === "etake") player.stop();
      setMode("saving");
      try {
        const id = await uploadBlob(tk.blob);
        const old = lesson.explain;
        await update("lessons/" + lesson.id, withCues({ explain: id, explainSecs: round1(tk.secs), updatedAt: Date.now() }, []));
        if (old && old !== id && rt.assets) { try { await rt.assets.delete(old); } catch (e) {} }
        toast("Explanation saved.");
        setTake(null); setMode("idle");
      } catch (e) { toast(errText(e)); setMode("review"); }
    }
    async function del() {
      if (!arm) { setArm(true); return; }
      const old = lesson.explain;
      try {
        await update("lessons/" + lesson.id, withCues({ explain: null, explainSecs: 0, updatedAt: Date.now() }, []));
        if (old && rt.assets) { try { await rt.assets.delete(old); } catch (e) {} }
        setArm(false);
      } catch (e) { toast(errText(e)); }
    }
    const fileInput = html`<input ref=${fileRef} type="file" accept="audio/*" style="display:none" onChange=${onFile}/>`;
    if (mode === "review" || mode === "saving") {
      const on = pst.key === "etake";
      return html`<div class="exrow">
        <button class="btn quiet" onClick=${() => player.play("etake", take.url)}>${on && pst.playing ? html`<${Ic.pause} size=${18}/>` : html`<${Ic.play} size=${18}/>`}Listen, ${fmtDur(take.secs)}</button>
        <button class="btn" disabled=${mode === "saving"} onClick=${save}>${mode === "saving" ? "Saving…" : "Save it"}</button>

    const key = "explain:" + lesson.id, on = pst.key === key, cues = lesson.cues || [];
    return html`<div class="exrow">
      ${lesson.explain ? html`<button class="btn quiet" onClick=${() => player.play(key, srcFor(lesson.explain))}>${on && pst.playing ? html`<${Ic.pause} size=${18}/>` : html`<${Ic.play} size=${18}/>`}Play, ${fmtDur(on && pst.cur > 0 ? pst.cur : lesson.explainSecs)}</button>` : null}
      <button class="btn" onClick=${onStudio}><${Ic.mic} size=${18}/>${lesson.explain ? "Record again with the board" : "Record with the board"}</button>
      <button class="btn quiet" onClick=${() => fileRef.current && fileRef.current.click()}><${Ic.upload} size=${18}/>Use a file</button>
      ${lesson.explain ? html`<button class=${"btn danger" + (arm ? " arm" : "")} onClick=${del}>${arm ? "Tap again to remove" : "Remove"}</button>` : null}
      ${fileInput}
    </div>
    ${lesson.explain ? html`<p class="help">${cues.length ? "Stick: " + cueCount(cues) + "." : "No stick pointing on this one. Record with the board to add it."}</p>` : null}`;
  }

  function ExplainStudio({ ix, lesson, number, onClose }) {
    const pst = usePlayer();
    const tkey = useTileKey();
    const [mode, setMode] = useState("ready");
    const [now, setNow] = useState(0);
    const [cues, setCuesState] = useState([]);
    const cuesRef = useRef([]);
    const [arming, setArming] = useState(null);
    const armRef = useRef(null);
    const [pointer, setPointer] = useState(null);
    const [take, setTake] = useState(null);
    const [turnFlash, setTurnFlash] = useState(false);
    const r = useRef(null), st = useRef(null), t0 = useRef(0);
    const setCues = list => { cuesRef.current = list; setCuesState(list); };
    useEffect(() => { if (mode !== "rec") return; const i = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(i); }, [mode]);
    useEffect(() => () => { if (r.current) r.current.cancel(); recorder.close(st.current); if (player.key === "studio") player.stop(); }, []);
    const preview = useCueSync("studio", cues, false, () => { setTurnFlash(true); setTimeout(() => setTurnFlash(false), 1500); }, pst);
    const elapsed = () => round2((Date.now() - t0.current) / 1000);
    async function start() {
      player.stop(); tilePlayer.stop();
      try {
        st.current = await recorder.open();
        r.current = recorder.start(st.current);
        t0.current = r.current.t0;
        setCues([]); setPointer(null); armRef.current = null; setArming(null); setNow(Date.now()); setMode("rec");
      } catch (e) {
        toast("The microphone isn't available here. Use a recording file instead (it won't have the stick).");
        onClose();
      }
    }
    function onTile(t, snd, ri, ti) {
      if (mode === "rec") {
        if (armRef.current != null) {
          setCues(cuesRef.current.concat({ t: armRef.current, k: "w", tile: t.t, r: ri, c: ti }));
          armRef.current = null; setArming(null); setPointer(null);
          return;
        }
        const c = { t: elapsed(), k: "p", tile: t.t, r: ri, c: ti };
        setCues(cuesRef.current.concat(c)); setPointer(c);
        return;
      }
      if (snd) tilePlayer.play("tile:" + lesson.id + ":" + t.t, srcFor(snd.rec.audio));
    }
    function yourTurn() { armRef.current = elapsed(); setArming(armRef.current); setPointer(null); }
    function noAnswer() {
      if (armRef.current == null) return;
      setCues(cuesRef.current.concat({ t: armRef.current, k: "w", tile: null }));
      armRef.current = null; setArming(null);
    }
    async function stop() {
      const c = r.current; r.current = null; if (!c) return;
      noAnswer();
      const out = await c.stop(); recorder.close(st.current); st.current = null;
      if (out.secs < 1) { setMode("ready"); toast("That was too short."); return; }
      setTake({ blob: out.blob, secs: out.secs, url: URL.createObjectURL(out.blob) }); setPointer(null); setMode("review");
    }
    function discard() { if (player.key === "studio") player.stop(); setTake(null); setCues([]); setMode("ready"); }
    async function save() {
      if (store.s.needsUpdate) { toast("Do the one-time database update first. It's at the top of your home screen."); return; }
      if (player.key === "studio") player.stop();
      setMode("saving");
      try {
        const id = await uploadBlob(take.blob);
        const old = lesson.explain;
        const list = cuesRef.current.slice().sort((a, b) => a.t - b.t);
        await update("lessons/" + lesson.id, { explain: id, explainSecs: round1(take.secs), cues: list, updatedAt: Date.now() });
        if (old && old !== id && rt.assets) { try { await rt.assets.delete(old); } catch (e) {} }
        toast("Explanation saved: " + cueCount(list) + ".");
        onClose();
      } catch (e) { toast(errText(e)); setMode("review"); }
    }
    const on = pst.key === "studio";
    return html`<div class="full studio" role="dialog" aria-label="Record the explanation">
      <div class="fhead">
        <span>Lesson ${number}: ${lesson.title}</span>
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button>
      </div>
      <div class="sbody">
        <${Board} lesson=${lesson} number=${number} ix=${ix} tkey=${tkey} onTile=${onTile}
          cue=${mode === "rec" ? pointer : mode === "review" ? preview : null} turn=${arming != null || turnFlash}/>
      </div>
      <div class="sfoot">
        ${mode === "ready" ? html`
          <p class="help">Talk them through the board. Tap each tile as you mention it: they'll see your stick point at it at that exact moment. Tap <b>Your turn</b> when they should answer, then tap the right tile, or <b>No answer</b> if they should just say it or write it. The recording stops there until they do.</p>
          <button class="big red" onClick=${start} aria-label="Start recording"><${Ic.mic} size=${30}/></button>` : null}
        ${mode === "rec" ? html`
          <div class="srow"><span class="recind"><span class="recdot"></span>${fmtDur((now - t0.current) / 1000)}</span><span class="help">${cueCount(cues)}</span></div>
          ${arming != null ? html`<p class="armnote">Now tap the right answer on the board, or <button class="linkbtn" onClick=${noAnswer}>No answer</button></p>` : null}
          <div class="srow">
            <button class="btn quiet" disabled=${arming != null} onClick=${yourTurn}><${Ic.hand} size=${20}/>Your turn</button>
            <button class="big red" onClick=${stop} aria-label="Stop recording"><${Ic.stop} size=${28}/></button>
          </div>` : null}
        ${mode === "review" || mode === "saving" ? html`
          <p class="help">${fmtDur(take.secs)}, ${cueCount(cues)}. Listen to check the stick, then save.</p>
          <div class="srow">
            <button class="btn quiet" disabled=${mode === "saving"} onClick=${discard}>Discard</button>
            <button class="btn quiet" onClick=${() => player.play("studio", take.url)}>${on && pst.playing ? html`<${Ic.pause} size=${18}/>` : html`<${Ic.play} size=${18}/>`}Listen</button>
            <button class="btn" disabled=${mode === "saving"} onClick=${save}>${mode === "saving" ? "Saving…" : "Save"}</button>
          </div>` : null}
      </div>
    </div>`;
  }

  function StepRecorder({ ix, lesson, onClose }) {
    const [list] = useState(() => {
      const tiles = uniqueTiles(parseBoard(lesson.board));
      const missing = tiles.filter(t => !soundFor(ix, lesson.id, t.t));
      return missing.length ? missing : tiles;
    });
    const [i, setI] = useState(0);
    const [recOn, setRecOn] = useState(false);
    const [t0, setT0] = useState(0), [now, setNow] = useState(0);
    const [micErr, setMicErr] = useState(recorder.blocked);
    const [busy, setBusy] = useState(0);
    const [last, setLast] = useState(null);
    const streamRef = useRef(null), recRef = useRef(null), chain = useRef(Promise.resolve()), fileRef = useRef(null);
    useEffect(() => { if (!recOn) return; const t = setInterval(() => setNow(Date.now()), 200); return () => clearInterval(t); }, [recOn]);
    useEffect(() => () => { if (recRef.current) recRef.current.cancel(); recorder.close(streamRef.current); player.stop(); }, []);
    const cur = list[i];
    const done = i >= list.length;
    function queueSave(t, idx, out) {
      setLast({ t: t.t, idx, url: URL.createObjectURL(out.blob) });
      setI(idx + 1);
      setBusy(b => b + 1);
      chain.current = chain.current.then(() => saveTileRec(lesson.id, t.t, out)).then(
        () => setBusy(b => b - 1),
        e => { setBusy(b => b - 1); toast(errText(e, "Couldn't save “" + t.t + "”. Tap it on the board to record it again.")); });
    }
    async function toggle() {
      if (recRef.current) {

        if (out.secs < 0.3 || !out.blob.size) { toast("That was too short. Try again."); return; }
        queueSave(cur, i, out);
        return;
      }
      player.stop();
      try {
        if (!streamRef.current) streamRef.current = await recorder.open();

        setT0(Date.now()); setNow(Date.now()); setRecOn(true);
