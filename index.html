  function SignIn({ s }) {
    const [open, setOpen] = useState(!!s.wantTeacher);
    const [create, setCreate] = useState(!!s.wantTeacher && !!s.fresh);
    const [email, setEmail] = useState(""), [pw, setPw] = useState("");
    const [busy, setBusy] = useState(false), [err, setErr] = useState(""), [note, setNote] = useState("");
    async function go() {
      setErr(""); setNote("");
      if (!/.+@.+\..+/.test(email.trim())) { setErr("Enter your email address."); return; }
      if (pw.length < 6) { setErr("The password needs at least 6 characters."); return; }
      setBusy(true);
      try {
        const r = await teacherAuth(email.trim(), pw, create);
        if (r === "confirm") { setNote("Account made. Supabase sent you a confirmation email: tap its link, then sign in here. (Or turn off Confirm email in Supabase and sign in straight away.)"); setCreate(false); }
      } catch (e) {
        const m = String((e && e.message) || "");
        setErr(/Invalid login/i.test(m) ? "Wrong email or password."
          : /already registered|already exists/i.test(m) ? "That email already has an account. Sign in instead."
          : /not confirmed/i.test(m) ? "Confirm your email first (check your inbox), or turn off Confirm email in Supabase."
          : /fetch|network|load failed/i.test(m) ? "No connection. Try again."
          : m || "That didn't work. Try again.");
      }
      setBusy(false);
    }
    if (!open) return html`<${Center}>
      <div class="bigicon"><${Ic.link} size=${54} sw=${1.8}/></div>
      <p class="help">Open the link your teacher sent you.</p>
      <button class="linkbtn" onClick=${() => setOpen(true)}>Teacher sign in</button>
    </${Center}>`;
    return html`<div class="setup">
      <h1>${create ? "Create your teacher account" : "Teacher sign in"}</h1>
      ${create ? html`<p class="help">The first account made here becomes the teacher of this class.</p>` : null}
      <div class="card">
        <div class="field"><label for="em">Email</label>
          <input id="em" type="email" autocomplete="email" inputmode="email" autocapitalize="off" value=${email} onInput=${e => setEmail(e.target.value)}/></div>
        <div class="field"><label for="pw">Password</label>
          <input id="pw" type="password" autocomplete=${create ? "new-password" : "current-password"} value=${pw} onInput=${e => setPw(e.target.value)} onKeyDown=${e => { if (e.key === "Enter") go(); }}/></div>
        ${err ? html`<p class="err" role="alert">${err}</p>` : null}
        ${note ? html`<p class="help">${note}</p>` : null}
        <button class="btn" disabled=${busy} onClick=${go}>${busy ? "One moment…" : create ? "Create account" : "Sign in"}</button>
        <button class="linkbtn" onClick=${() => { setCreate(!create); setErr(""); setNote(""); }}>${create ? "I already have an account" : "Create the teacher account"}</button>
      </div>
    </div>`;
  }

  function Setup() {
    const [url, setUrl] = useState(""), [key, setKey] = useState("");
    const [busy, setBusy] = useState(false), [err, setErr] = useState(""), [copied, setCopied] = useState(false);
    const sql = useMemo(() => ((document.getElementById("setup-sql") || {}).textContent || "").trim() + "\n", []);
    async function copySql() {
      let ok = false;
      try { await navigator.clipboard.writeText(sql); ok = true; } catch (e) {}
      if (!ok) {
        try {
          const ta = document.createElement("textarea");
          ta.value = sql; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
        } catch (e) {}
      }
      setCopied(ok);
      if (!ok) toast("Couldn't copy. Open “Show the code” below, select all of it and copy.");
    }
    async function connect() {
      setErr(""); setBusy(true);
      try {
        await connectProject(url, key);
        store.set({ phase: "loading", wantTeacher: true, fresh: true });
        await boot();
      } catch (e) {
        setErr({
          url: "That doesn't look like a Supabase project URL. It starts with https:// and ends in .supabase.co",
          key: "The key was refused. Copy the publishable (or anon) key again, all of it.",
          sql: "Connected, but the setup code hasn't run yet. Do step 1, then tap Connect again.",
          net: "Couldn't reach that project. Check the URL and your connection.",
        }[e && e.message] || "Couldn't connect. Check both values.");
      }
      setBusy(false);
    }
    return html`<div class="setup">
      <h1>Reading class</h1>
      <p class="help">Setting up takes about five minutes, all from your phone. You only do it once.</p>
      <div class="step"><span class="stepn">1</span><div class="stepb">
        <p>Copy the setup code. In Supabase, open <b>SQL Editor</b>, start a new query, paste it and tap <b>Run</b>.</p>
        <button class=${"btn" + (copied ? " sec" : "")} onClick=${copySql}>${copied ? html`<${Ic.tick} size=${18}/>Copied` : "Copy setup code"}</button>
        <details><summary>Show the code</summary><textarea class="sqlbox" readonly value=${sql}></textarea></details>
      </div></div>
      <div class="step"><span class="stepn">2</span><div class="stepb">
        <p>In Supabase, open <b>Authentication</b>, then <b>Sign In / Providers</b>. Turn on <b>Allow anonymous sign-ins</b>: that's how your student gets in with just a link. On the same page open <b>Email</b>, turn off <b>Confirm email</b> and save.</p>
      </div></div>
      <div class="step"><span class="stepn">3</span><div class="stepb">
        <p>In Supabase, tap <b>Connect</b> at the top of your project (or open Project Settings, then API Keys). Copy the project URL and the publishable key (the older anon key works too) and paste them here.</p>
        <div class="field"><label for="su">Project URL</label>
          <input id="su" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder="https://xxxx.supabase.co" value=${url} onInput=${e => setUrl(e.target.value)}/></div>
        <div class="field"><label for="sk">Publishable or anon key</label>
          <input id="sk" autocomplete="off" autocapitalize="off" spellcheck=${false} placeholder="sb_publishable_…" value=${key} onInput=${e => setKey(e.target.value)}/></div>
        ${err ? html`<p class="err" role="alert">${err}</p>` : null}
        <button class="btn" disabled=${busy || !url.trim() || !key.trim()} onClick=${connect}>${busy ? "Checking…" : "Connect"}</button>
      </div></div>
    </div>`;
  }
  const Waiting = ({ onBack }) => html`<div class="center"><div class="msgbox">
    <div class="bigicon"><${Ic.wait} size=${54} sw=${1.8}/></div>
    <p class="help">The first lesson isn't ready yet.</p>
    ${onBack ? html`<button class="btn quiet" onClick=${onBack}>Back</button>` : null}
  </div></div>`;
  function posOf(rowsOf, cue) {
    if (!cue || !cue.tile) return null;
    if (cue.r != null && rowsOf[cue.r] && rowsOf[cue.r][cue.c] && rowsOf[cue.r][cue.c].t === cue.tile) return { r: cue.r, c: cue.c };
    for (let r = 0; r < rowsOf.length; r++) for (let c = 0; c < rowsOf[r].length; c++) if (rowsOf[r][c].t === cue.tile) return { r, c };
    return null;
  }
  function Board({ lesson, number, ix, tkey, onTile, points, edit, cue, mark, turn, flash, hint, follow }) {
    const rowsOf = useMemo(() => parseBoard(lesson.board, lesson.stage === 3), [lesson.board]);
    const boardRef = useRef(null), stickRef = useRef(null);
    const cp = posOf(rowsOf, cue), mp = posOf(rowsOf, mark), hp = posOf(rowsOf, hint);
    const cpKey = cp ? cp.r + "-" + cp.c : "";
    useLayoutEffect(() => {
      const b = boardRef.current, stick = stickRef.current;
      if (!b || !stick) return;
      const el = cpKey ? b.querySelector('[data-rc="' + cpKey + '"]') : null;
      if (!el) { stick.style.opacity = "0"; return; }
      const x = el.offsetLeft + el.offsetWidth * 0.5, y = el.offsetTop + el.offsetHeight - 6;
      stick.style.opacity = "1";
      stick.style.transform = "translate(" + x + "px," + y + "px) rotate(-38deg)";
      if (follow) {
        const r = el.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 130) el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }, [cpKey, lesson.board, follow]);
    const at = (p, ri, ti) => p && p.r === ri && p.c === ti;
    return html`<div class=${"boardwrap" + (edit ? " edit" : "")}>
      <div class=${"board" + (cp ? " cueing" : "") + (turn ? " turn" : "") + (lesson.stage === 3 ? " passage" : "")} ref=${boardRef}>
        <div class="bnum" aria-label=${"Lesson " + number}>Lesson ${number}</div>
        ${turn ? html`<div class="turnhint" aria-label="Your turn"><${Ic.hand} size=${32}/></div>` : null}
        ${rowsOf.length ? rowsOf.map((row, ri) => html`<div class="brow" key=${ri}>${row.map((t, ti) => {
          const snd = soundFor(ix, lesson.id, t.t);
          const cls = "tile" + (t.s ? " sent" : "") + (tkey === "tile:" + lesson.id + ":" + t.t ? " on" : "") + (!snd ? " mute" : "") +
            (edit ? (snd ? (snd.own ? " own" : " borrow") : " miss") : "") + (points && points.indexOf(t.t) >= 0 ? " pt" : "") +
            (at(cp, ri, ti) ? " cue" : "") + (at(mp, ri, ti) ? " mark" : "") + (at(hp, ri, ti) ? " hint" : "") +
            (flash && flash.r === ri && flash.c === ti ? (flash.ok ? " good" : " bad") : "");
          return html`<button key=${ti} class=${cls} data-rc=${ri + "-" + ti} onClick=${() => onTile(t, snd, ri, ti)}>${t.d || t.t}</button>`;
        })}</div>`) : html`<div class="bempty">${edit ? "The board is empty. Write its rows below." : html`<${Ic.wait} size=${40} sw=${1.6}/>`}</div>`}
        <div class="stick" ref=${stickRef} aria-hidden="true"><i></i></div>
      </div>
      <div class="ledge"><i></i></div>
    </div>`;
  }

  function Rail({ lessons, uIdx, vIdx, unreadBy, teacher, onPick, onBook, onFight }) {
    const ref = useRef(null);
    useEffect(() => {
      const rail = ref.current; if (!rail) return;
      const el = rail.querySelectorAll(".dot")[vIdx]; if (!el) return;
      const left = el.offsetLeft - rail.clientWidth / 2 + el.clientWidth / 2;
      try { rail.scrollTo({ left, behavior: "smooth" }); } catch (e) { rail.scrollLeft = left; }
    }, [vIdx, lessons.length]);
    return html`<nav class="rail" ref=${ref} aria-label="Lessons">${onBook ? html`<button class="railbook railw" onClick=${onBook} aria-label="My exercise book"><${Ic.book} size=${20}/><span>Book</span></button>` : null}${onFight ? html`<button class="railbook railfight railw" onClick=${onFight} aria-label="Games">🎮<span>Game</span></button>` : null}${onBook || onFight ? html`<span class="raillbl">Lessons</span>` : null}${lessons.map((l, i) => {
      const state = i < uIdx ? "done" : i === uIdx ? "cur" : "locked";
      const can = teacher || i <= uIdx;
      return html`<button key=${l.id} class=${"dot " + state + (i === vIdx ? " view" : "") + (teacher && i === vIdx ? " tview" : "")} disabled=${!can} onClick=${() => onPick(l.id)} aria-label=${"Lesson " + (i + 1)} aria-current=${i === vIdx ? "true" : null}>
        ${i + 1}
        ${state === "done" ? html`<span class="tk"><${Ic.tick} size=${13} sw=${3.2}/></span>` : null}
        ${unreadBy[l.id] ? html`<span class="bd"></span>` : null}
      </button>`;
    })}</nav>`;
  }

  function Voice({ m, pst }) {
    const key = "msg:" + (m.cid || m.id);
    const on = pst.key === key;
    const dur = m.secs || (on ? pst.dur : 0);
    const frac = on && dur ? Math.min(1, pst.cur / dur) : 0;
    const bars = useMemo(() => waveBars(m.cid || m.id, 26), [m.cid || m.id]);
    const src = m.localUrl || (m.asset ? srcFor(m.asset) : null);
    return html`<div class="voice">
      <button class="vplay" disabled=${!src} onClick=${() => src && player.play(key, src)} aria-label=${on && pst.playing ? "Pause" : "Play"}>
        ${on && pst.playing ? html`<${Ic.pause} size=${20}/>` : html`<${Ic.play} size=${20}/>`}
      </button>

  /* ================= the classroom ================= */
  const markedSeen = new Set();
  // Scrolls to one message and makes it flash, once it's on screen.
  function flashMsg(id) {
    let n = 0;
    const tryIt = () => {
      const el = document.querySelector('[data-mid="' + id + '"]');
      if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2600); return; }

  function Room({ s, ix, student, mode, onBack, startEditing, focus }) {

    const L = teacher && Lraw.sid !== student.id ? LIVE_OFF : Lraw;

    const uIdx = uFound >= 0 ? uFound : 0;
    const [viewId, setViewId] = useState(() => (focus && focus.lesson ? focus.lesson : lessons[uIdx] ? lessons[uIdx].id : null));
    useEffect(() => { if (focus && focus.msg) flashMsg(focus.msg); }, []);
    let vIdx = lessons.findIndex(l => l.id === viewId);
    const liveView = !teacher && L.on && vIdx >= 0 && lessons[vIdx].id === L.lesson;
    if (vIdx < 0 || (!teacher && vIdx > uIdx && !liveView)) vIdx = uIdx;
    const lesson = lessons[vIdx];
    const [pending, setPending] = useState([]);
    const [points, setPoints] = useState(null);
    const [hw, setHw] = useState(false);
    const [lightbox, setLightbox] = useState(null);
    const [editing, setEditing] = useState(!!startEditing);
    const [hwEdit, setHwEdit] = useState(false);
    const [fight, setFight] = useState(null);
    const [arena, setArena] = useState(null);
    useEffect(() => {

    }, [teacher]);
    useEffect(() => {

    }, [teacher]);
    const [hwRun, setHwRun] = useState(null);

    const [bookOpen, setBookOpen] = useState(false);
    function openHw(hw) {

    function openAns(a) {

    const [endVis, setEndVis] = useState(false);

    const mine = s.msgs.filter(m => m.student === student.id);
    const cids = new Set(mine.map(m => m.cid).filter(Boolean));
    const unsent = pending.filter(p => !cids.has(p.cid));
    const thread = mine.filter(m => m.lesson === lid).concat(unsent.filter(p => p.lesson === lid)).sort((a, b) => a.at - b.at);
    const unreadBy = {};
    for (const m of mine) if (m.from !== role && !m.seen) unreadBy[m.lesson] = (unreadBy[m.lesson] || 0) + 1;
    const unreadHere = lid ? unreadBy[lid] || 0 : 0;
    const unseenIds = thread.filter(m => !m.pending && m.from !== role && !m.seen).map(m => m.id);

    useEffect(() => { if (pending.some(p => cids.has(p.cid))) setPending(ps => ps.filter(p => !cids.has(p.cid))); }, [s.msgs]);
    const explCue = useCueSync("explain:" + lid, lesson ? lesson.cues : null, true, c => setTurn({ cue: c, tries: 0 }), pst);
    useEffect(() => { player.stop(); tilePlayer.stop(); setTurn(null); setFlash(null); window.scrollTo(0, 0); }, [lid]);
    useEffect(() => { if (!flash) return; const t = setTimeout(() => setFlash(null), 800); return () => clearTimeout(t); }, [flash]);

    useEffect(() => { if (!teacher && L.on && L.lesson && L.lesson !== viewId && lessons.some(l => l.id === L.lesson)) setViewId(L.lesson); }, [L.on, L.lesson]);
    useEffect(() => { if (teacher && L.on && lid) live.setLesson(lid); }, [lid, L.on]);

    function send(item) {

        kind: item.kind, secs: item.secs || 0, text: item.text || "", hw: teacher && hw, point: item.point || [],
        at: Date.now(), blob: item.blob || null, localUrl: item.localUrl || (item.blob ? URL.createObjectURL(item.blob) : null),

  /* ================= reading passages and ready-made lessons ================= */
  // Bring in a text or PDF file as a reading passage. No AI: the PDF's own text is read out of it.
  let pdfjsP = null;
  function loadPdfJs() {
    if (pdfjsP) return pdfjsP;
    pdfjsP = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      sc.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); } catch (e) { rej(e); } };
      sc.onerror = () => { pdfjsP = null; rej(new Error("pdf")); };
      document.head.appendChild(sc);
    });
    return pdfjsP;
  }
  async function fileToText(file) {
    const name = String(file.name || "").toLowerCase();
    if (file.type === "application/pdf" || name.endsWith(".pdf")) {
      const lib = await loadPdfJs();
      const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
      const out = [];
      for (let p = 1; p <= Math.min(pdf.numPages, 60); p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        let line = "";
        for (const it of tc.items) {
          line += it.str;
          if (it.hasEOL) { out.push(line); line = ""; } else if (it.str && !/\s$/.test(it.str)) line += " ";
        }
        if (line.trim()) out.push(line);
        out.push("");
      }
      return out.join("\n");
    }
    return await file.text();
  }
  // Wrapped lines join into paragraphs; a blank line starts a new paragraph.
  function tidyPassage(text) {
    return String(text || "").replace(/\r/g, "").replace(/-\n(?=[a-z])/g, "").split(/\n\s*\n/)
      .map(p => p.replace(/\s*\n\s*/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
  }
  // A long book becomes several lessons of about 150 words, split at paragraph ends.
  function splitPassage(text, size) {
    const parts = [];
    let cur = [], n = 0;
    for (const para of tidyPassage(text).split("\n")) {
      const w = para.split(/\s+/).length;
      if (n && n + w > size * 1.3) { parts.push(cur.join("\n")); cur = []; n = 0; }
      if (w > size * 1.6) {           // one huge paragraph: cut it at sentence ends
        let chunk = "";
        for (const sen of para.match(/[^.!?]+[.!?]*["')\]]*\s*/g) || [para]) {
          if (chunk && (chunk + sen).split(/\s+/).length > size) { cur.push(chunk.trim()); parts.push(cur.join("\n")); cur = []; n = 0; chunk = ""; }
          chunk += sen;
        }
        if (chunk.trim()) { cur.push(chunk.trim()); n += chunk.split(/\s+/).length; }
      } else { cur.push(para); n += w; }
    }
    if (cur.length) parts.push(cur.join("\n"));
    return parts.filter(Boolean);

      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f || !cur) return;
      try { const out = await audioFromFile(f); queueSave(cur, i, out); }
      catch (err) { toast(errText(err, "That file couldn't be used.")); }
    }
    return html`<div class="full" role="dialog" aria-label="Record the board">
      <div class="fhead">
        <span>${done ? "All done" : (i + 1) + " of " + list.length}</span>
        ${busy ? html`<span class="saving"><span class="spin"></span>Saving</span>` : null}
        <button class="iconbtn" onClick=${onClose} aria-label="Close"><${Ic.x}/></button>
      </div>
      <div class="fbody">${done
        ? html`<div class="fdone"><${Ic.tick} size=${64} sw=${2.4}/><p>${busy ? "Finishing the last saves…" : "Every tile in this round is recorded."}</p></div>`
        : html`<div class=${"ftile" + (cur.s ? " sent" : "")}>${cur.t}</div>`}</div>
      <div class="ffoot">
        ${last ? html`<div class="lastrow"><span>Last: <b>${last.t}</b></span>
          <button class="chip" disabled=${recOn} onClick=${() => player.play("steplast", last.url, true)}><${Ic.play} size=${16}/>Hear it</button>
          <button class="chip" disabled=${recOn} onClick=${() => { setI(last.idx); setLast(null); }}><${Ic.replay} size=${16}/>Redo</button></div>` : null}
        ${done ? html`<button class="btn light" onClick=${onClose}>Close</button>`
          : micErr ? html`<p class="fhelp">The microphone isn't available here. Record the tile with your phone's recorder, then pick the file.</p>
              <button class="btn light" onClick=${() => fileRef.current && fileRef.current.click()}><${Ic.upload} size=${20}/>Choose recording for “${cur.t}”</button>
              <button class="chip" onClick=${() => setI(x => x + 1)}>Skip</button>`
          : html`<div class="frow">
              <button class="chip" disabled=${recOn} onClick=${() => setI(x => x + 1)}>Skip</button>
              <button class=${"big " + (recOn ? "red" : "chalk")} onClick=${toggle} aria-label=${recOn ? "Stop and save" : "Record this tile"}>${recOn ? html`<${Ic.stop} size=${30}/>` : html`<${Ic.mic} size=${30}/>`}</button>
              <span class="ftime">${recOn ? fmtDur((now - t0) / 1000) : ""}</span>
            </div>
            <p class="fhelp">${recOn ? "Tap again when you've said it. It saves and moves on." : "Tap, say the tile, tap again."}</p>`}
      </div>
      <input ref=${fileRef} type="file" accept="audio/*" capture="" style="display:none" onChange=${onFile}/>
    </div>`;
  }

  function TileSheet({ ix, lesson, lessons, text, onClose }) {
    const pst = usePlayer();
    const snd = soundFor(ix, lesson.id, text);
    const [recOn, setRecOn] = useState(false), [saving, setSaving] = useState(false), [arm, setArm] = useState(false);
    const [t0, setT0] = useState(0), [now, setNow] = useState(0);
    const r = useRef(null), st = useRef(null), fileRef = useRef(null);
    useEffect(() => { if (!recOn) return; const t = setInterval(() => setNow(Date.now()), 200); return () => clearInterval(t); }, [recOn]);
    useEffect(() => () => { if (r.current) r.current.cancel(); recorder.close(st.current); }, []);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 3500); return () => clearTimeout(t); }, [arm]);
    async function saveOut(out) {
      setSaving(true);
      try { await saveTileRec(lesson.id, text, out); toast("Saved “" + text + "”."); } catch (e) { toast(errText(e)); }
      setSaving(false);
    }
    async function toggle() {
      if (r.current) {
        const c = r.current; r.current = null; setRecOn(false);
        const out = await c.stop(); recorder.close(st.current); st.current = null;
        if (out.secs < 0.3 || !out.blob.size) { toast("That was too short. Try again."); return; }
        return saveOut(out);
      }
      if (recorder.blocked) { fileRef.current && fileRef.current.click(); return; }
      player.stop();
      try { st.current = await recorder.open(); r.current = recorder.start(st.current); setT0(Date.now()); setNow(Date.now()); setRecOn(true); }
      catch (e) { toast("The microphone isn't available here. Tap again to choose a recording file."); }
    }
    async function onFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
      try { saveOut(await audioFromFile(f)); } catch (err) { toast(errText(err, "That file couldn't be used.")); }
    }
    async function del() {
      if (!arm) { setArm(true); return; }
      try { await removeTileRec(lesson.id, text); toast("Recording removed."); } catch (e) { toast(errText(e)); }
      setArm(false);
    }
    const fromLesson = snd && !snd.own ? lessons[snd.from] : null;
    const status = !snd ? "No recording yet." : snd.own ? "Recorded for this lesson."
      : "Reusing the recording from lesson " + (snd.from + 1) + (fromLesson ? " (" + fromLesson.title + ")" : "") + ". Record it here if it should sound different in this lesson.";
    const key = "sheet:" + text, on = pst.key === key;
    return html`<div class="scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="sheet" role="dialog" aria-label=${"Recording for " + text}>
        <div class="sheettile">${text}</div>
        <p class="help c">${status}</p>
        <div class="row2">
          ${snd ? html`<button class="btn quiet" disabled=${recOn} onClick=${() => player.play(key, srcFor(snd.rec.audio), !on)}>${on && pst.playing ? html`<${Ic.pause} size=${18}/>` : html`<${Ic.play} size=${18}/>`}Play</button>` : null}
          <button class=${"btn" + (recOn ? " rec" : "")} disabled=${saving} onClick=${toggle}>
            ${recOn ? html`<${Ic.stop} size=${18}/>Stop, ${fmtDur((now - t0) / 1000)}` : saving ? "Saving…" : html`<${Ic.mic} size=${18}/>${snd && snd.own ? "Record again" : "Record"}`}
          </button>
        </div>
        <button class="btn quiet" disabled=${recOn || saving} onClick=${() => fileRef.current && fileRef.current.click()}><${Ic.upload} size=${18}/>Use a recording file</button>
        ${snd && snd.own ? html`<button class=${"btn danger" + (arm ? " arm" : "")} onClick=${del}>${arm ? "Tap again to remove" : "Remove this lesson's recording"}</button>` : null}
        <button class="btn quiet" onClick=${onClose}>Close</button>
        <input ref=${fileRef} type="file" accept="audio/*" style="display:none" onChange=${onFile}/>
      </div>
    </div>`;
  }

  function LessonEditor({ s, ix, lesson, onBack }) {
    const pst = usePlayer();
    const idx = s.lessons.findIndex(l => l.id === lesson.id);
    const [title, setTitle] = useState(lesson.title || "");
    const [note, setNote] = useState(lesson.note || "");
    const [board, setBoard] = useState(lesson.board || "");
    const [dirty, setDirty] = useState(false);
    const [importing, setImporting] = useState(false);
    const [split, setSplit] = useState(null);
    const importRef = useRef(null);
    async function importFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      setImporting(true);
      try {
        const all = tidyPassage(await fileToText(f));
        const words = all ? all.split(/\s+/).length : 0;
        if (!words) toast("No text found in that file. If it's a scanned book, type the page in instead.");
        else if (words > 220) setSplit({ all, words, parts: splitPassage(all, 150), name: String(f.name || "Book").replace(/\.[^.]+$/, "") });
        else { setBoard(all); setDirty(true); toast("Imported. Check it, then tap Save passage."); }
      } catch (err) { toast("Couldn't read that file. Try a .txt or a PDF that has real text in it."); }
      setImporting(false);
    }
    async function splitIntoLessons() {
      const sp = split;
      setSplit(null);
      try {
        const title = (lesson.title && lesson.title !== "New reading passage") ? lesson.title : sp.name;
        await update("lessons/" + lesson.id, { board: sp.parts[0], title: title + ", part 1", updatedAt: Date.now() });
        setBoard(sp.parts[0]); setDirty(false);
        const later = s.lessons.filter(l => (l.stage || 1) === 3 && (l.order || 0) > (lesson.order || 0));
        for (const l of later) await update("lessons/" + l.id, { order: (l.order || 0) + sp.parts.length - 1 });
        for (let i = 1; i < sp.parts.length; i++) {
          await rt.db.collection("lessons").doc().set({ stage: 3, order: (lesson.order || 0) + i, title: title + ", part " + (i + 1), note: "", board: sp.parts[i], explain: null, explainSecs: 0, updatedAt: Date.now() });
        }
        toast("Made " + sp.parts.length + " reading lessons.");
      } catch (err) { toast(errText(err)); }
    }
    const [stepOpen, setStepOpen] = useState(false);
    const [studio, setStudio] = useState(false);
    const [tile, setTile] = useState(null);
    const [armDel, setArmDel] = useState(false);
    useEffect(() => { if (!dirty) setBoard(lesson.board || ""); }, [lesson.board]);
    useEffect(() => { if (!armDel) return; const t = setTimeout(() => setArmDel(false), 3500); return () => clearTimeout(t); }, [armDel]);
    useEffect(() => () => player.stop(), []);
    const rowsOf = useMemo(() => parseBoard(lesson.board, lesson.stage === 3), [lesson.board]);
    const tiles = useMemo(() => uniqueTiles(rowsOf), [rowsOf]);
    let own = 0, bor = 0, miss = 0;
    for (const t of tiles) { const x = soundFor(ix, lesson.id, t.t); if (!x) miss++; else if (x.own) own++; else bor++; }
    const save = patch => update("lessons/" + lesson.id, Object.assign({ updatedAt: Date.now() }, patch)).catch(e => toast(errText(e)));

    async function saveBoard() {
      const clean = board.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
      await save({ board: clean });
      setBoard(clean); setDirty(false);
      toast("Board saved.");
    }
    async function changeStage(n) {
      const order = s.lessons.filter(l => (l.stage || 1) === n && l.id !== lesson.id).reduce((m, l) => Math.max(m, l.order || 0), 0) + 1;
      await save({ stage: n, order });
    }
    async function move(dir) {
      const same = s.lessons.filter(l => (l.stage || 1) === (lesson.stage || 1));
      const i = same.findIndex(l => l.id === lesson.id), j = i + dir;
      if (j < 0 || j >= same.length) { toast(dir < 0 ? "Already first in this stage." : "Already last in this stage."); return; }
      const arr = same.slice();
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      try { for (let k = 0; k < arr.length; k++) if ((arr[k].order || 0) !== k + 1) await update("lessons/" + arr[k].id, { order: k + 1 }); }
      catch (e) { toast(errText(e)); }
    }
    async function delLesson() {
      if (!armDel) { setArmDel(true); return; }
      const all = s.lessons, i = all.findIndex(l => l.id === lesson.id);
      const fallback = all[i + 1] || all[i - 1] || null;
      try {
        for (const st of s.students) if (st.unlocked === lesson.id) await update("students/" + st.id, { unlocked: fallback ? fallback.id : null });
        await remove("lessons/" + lesson.id);
        if (lesson.explain && rt.assets) { try { await rt.assets.delete(lesson.explain); } catch (e) {} }
        onBack();
      } catch (e) { toast(errText(e)); }
    }
    const stg = lesson.stage || 1;
    return html`<div class="page">
      <header class="rhead">
        <button class="iconbtn" onClick=${onBack} aria-label="Back to lessons"><${Ic.back}/></button>
        <div class="rtitle"><b>Lesson ${idx + 1}</b><small>Stage ${stg}${STAGES[stg] ? ": " + STAGES[stg] : ""}</small></div>
      </header>
      <div class="ed">
        <div class="field"><label for="lt">Title</label>
          <input id="lt" value=${title} onInput=${e => setTitle(e.target.value)} onBlur=${() => { const t = title.trim() || "Untitled lesson"; if (t !== (lesson.title || "")) save({ title: t }); }} autocomplete="off"/></div>
        <div class="field"><label for="ls">Stage</label>
          <select id="ls" value=${String(stg)} onChange=${e => changeStage(Number(e.target.value))}>
            ${[1, 2, 3, 4].map(n => html`<option key=${n} value=${String(n)}>Stage ${n}: ${STAGES[n]}</option>`)}
          </select></div>
        <div class="field"><label for="ln">What to explain</label>
          <textarea id="ln" rows="5" value=${note} onInput=${e => setNote(e.target.value)} onBlur=${() => { if (note !== (lesson.note || "")) save({ note }); }}></textarea>
          <p class="help">Only you see this.</p></div>
        <div class="card">
          <div class="lbl">Your explanation</div>
          <p class="help">They play this while looking at the board. Record with the board so your stick points at each tile as you talk, and add Your turn moments so they have to answer. Speak in the language they're most comfortable with.</p>
          <${ExplainRecorder} lesson=${lesson} pst=${pst} onStudio=${() => { player.stop(); setStudio(true); }}/>
        </div>
        <div class="card">
          <div class="lbl">The board</div>
          <p class="help">Tap a tile to hear it or record it. A tile recorded in one lesson is reused wherever the same letters appear, so you only record what's new.</p>
          <${Board} lesson=${lesson} number=${idx + 1} ix=${ix} pst=${pst} onTile=${t => setTile(t.t)} edit=${true}/>
          <div class="legend">
            <span><i class="lg"></i>${own} recorded here</span>
            <span><i class="lg bor"></i>${bor} reused</span>
            <span><i class="lg miss"></i>${miss} not recorded</span>
          </div>
          <button class="btn" disabled=${!tiles.length} onClick=${() => { player.stop(); setStepOpen(true); }}><${Ic.mic} size=${20}/>${miss ? "Record the " + miss + " missing, one by one" : "Re-record every tile, one by one"}</button>
        </div>
        <div class="card">
          <label class="lbl" for="bt">${lesson.stage === 3 ? "The passage" : "Edit the board"}</label>
          <textarea id="bt" class="boardtxt" rows=${Math.min(14, Math.max(4, board.split("\n").length + 1))} value=${board}
            onInput=${e => { setBoard(e.target.value); setDirty(true); }} spellcheck=${false} autocapitalize="off" autocomplete="off"></textarea>
          <p class="help">${lesson.stage === 3
            ? "Type or paste the text. Each new line starts a new paragraph. Every word becomes something he can tap to hear, using any recording of that word from earlier lessons."
            : "One row per line. Tiles are split by spaces. A line ending in . ? or ! stays whole as one sentence."}</p>
          ${lesson.stage === 3 ? html`<div class="row2">
            <button class="btn quiet" disabled=${importing} onClick=${() => importRef.current && importRef.current.click()}><${Ic.upload} size=${18}/>${importing ? "Reading the file…" : "Import a text or PDF file"}</button>
            <input ref=${importRef} type="file" accept=".txt,.pdf,text/plain,application/pdf" style="display:none" onChange=${importFile}/>
          </div>` : null}
          ${split ? html`<div class="card splitask">
            <b>That's ${split.words} words.</b>
            <p class="help">Long texts are easier in short sittings. Split it into ${split.parts.length} lessons of about 150 words, one after another?</p>
            <div class="row2">
              <button class="btn" onClick=${splitIntoLessons}>Split into ${split.parts.length} lessons</button>
              <button class="btn quiet" onClick=${() => { setBoard(split.all); setDirty(true); setSplit(null); }}>Keep it all here</button>
            </div>
          </div>` : null}
          <button class="btn sec" disabled=${!dirty} onClick=${saveBoard}>Save ${lesson.stage === 3 ? "passage" : "board"}</button>
        </div>
        <div class="row2">
          <button class="btn quiet" onClick=${() => move(-1)}><${Ic.up} size=${20}/>Move earlier</button>
          <button class="btn quiet" onClick=${() => move(1)}><${Ic.down} size=${20}/>Move later</button>
        </div>
        <button class=${"btn danger" + (armDel ? " arm" : "")} onClick=${delLesson}>${armDel ? "Tap again to delete this lesson" : "Delete lesson"}</button>
      </div>
      ${stepOpen ? html`<${StepRecorder} ix=${ix} lesson=${lesson} onClose=${() => setStepOpen(false)}/>` : null}
      ${studio ? html`<${ExplainStudio} ix=${ix} lesson=${lesson} number=${idx + 1} onClose=${() => setStudio(false)}/>` : null}
      ${tile ? html`<${TileSheet} ix=${ix} lesson=${lesson} lessons=${s.lessons} text=${tile} onClose=${() => setTile(null)}/>` : null}
    </div>`;
  }

  // ---------- live class controls ----------
  function StudentCall({ L }) {
    const C = useCall();
    const now = useTick(1000);
    const joined = C.phase !== "idle";
    // ring softly while the teacher is waiting and the student hasn't joined
    useEffect(() => {
      if (joined || L.away || !L.on) return;
      let n = 0;
      const ring = () => { if (document.visibilityState === "visible" && n++ < 20) { chime(true); try { navigator.vibrate && navigator.vibrate([200, 120, 200]); } catch (e) {} } };
      ring();
      const t = setInterval(ring, 3000);
      return () => clearInterval(t);
    }, [joined, L.away, L.on]);
    async function join() {
      try { await call.studentJoin(); }
      catch (e) { call.set({ error: "The microphone is blocked. Allow it for this site in your browser's settings (iPhone: Settings, Safari, Microphone), then tap the green phone again." }); }
    }
    return html`<div class="callcard">
      ${L.away ? html`<div class="away" role="status"><${Ic.wait} size=${22}/><span>Waiting for your teacher</span></div>` : null}
      ${!joined
        ? html`<button class="joinbtn" onClick=${join} aria-label="Join the class"><${Ic.phone} size=${34}/></button>`
        : html`<div class="incall">
            <span class="cstate">${C.phase === "connected" ? html`<${Ic.speaker} size=${22}/>` : html`<span class="spin"></span>`}<span>${C.since ? fmtDur((now - C.since) / 1000) : ""}</span></span>
            <button class=${"cbtn" + (C.muted ? " off" : "")} onClick=${() => call.toggleMute()} aria-label=${C.muted ? "Unmute" : "Mute"}>${C.muted ? html`<${Ic.micOff} size=${24}/>` : html`<${Ic.mic} size=${24}/>`}</button>
            <button class="cbtn hang" onClick=${() => call.leave(true)} aria-label="Leave the call"><${Ic.hangup} size=${26}/></button>
          </div>`}
      ${L.rec ? html`<span class="recbadge" aria-label="This class is being recorded"><span class="recdot"></span>REC</span>` : null}
      ${C.error ? html`<p class="err">${C.error}</p>` : null}
    </div>`;
  }

  async function resumeRecording() {
    const p = classRec.pendingResume();
    if (p && p.student === live.sid && !classRec.active) {
      await classRec.recover();
      await classRec.start({ title: p.title, lessonNo: p.lessonNo, student: p.student, part: (p.part || 1) + 1 });
    }
  }
  async function rejoinVoice() {
    try { await call.teacherStart(); await resumeRecording(); }
    catch (e) { call.set({ phase: "paused", error: "Your microphone is blocked. Allow it for this site in your browser's settings, then tap Rejoin voice." }); }
  }

  function ClassMembers({ s, studentId }) {
    const L = useLive();
    useTick(1000);
    const [adding, setAdding] = useState(false);
    const group = L.group || [], holder = L.holderSid || studentId;
    const inClass = [studentId].concat(group);
    const others = (s ? s.students : []).filter(x => !inClass.includes(x.id));
    const nameOf = id => { const x = s && s.students.find(y => y.id === id); return x ? x.name : "Student"; };
    const voiceOf = id => { if (id === studentId) return call.st.phase; const x = live.extra.get(id); return x && x.peer ? x.peer.st.phase : "waiting"; };
    return html`<div class="members">
      <div class="lprow wrap">
        ${inClass.map(id => html`<span class=${"mchip" + (voiceOf(id) === "connected" ? " on" : "")} key=${id}>
          <span class="pres small"></span>${nameOf(id)}
          ${L.mode === "write" ? html`<button class=${"mchalk" + (holder === id ? " on" : "")} onClick=${() => live.giveChalkTo(id)} aria-label=${"Chalk goes to " + nameOf(id)}>✏️</button>` : null}
          ${id !== studentId ? html`<button class="mx" onClick=${() => live.removeStudent(id)} aria-label=${"Take " + nameOf(id) + " out of the class"}>×</button>` : null}
        </span>`)}
        ${others.length ? html`<button class="tool" onClick=${() => setAdding(!adding)}><${Ic.plus} size=${16}/>Add a student</button>` : null}
      </div>
      ${adding ? html`<div class="addlist">${others.map(x => html`<button class="row" key=${x.id} onClick=${() => { live.addStudent(x.id); setAdding(false); }}>
        <span class="av" style=${"background:" + (x.color || COLORS[0])}>${initial(x.name)}</span><span>${x.name}</span></button>`)}</div>` : null}
    </div>`;
  }
  function ClassPanel({ s, who, lessonTitle, lessonNo, studentId }) {
    const L = useLive(), C = useCall(), R = useRec();
    const now = useTick(1000);
    const [armEnd, setArmEnd] = useState(false);
    const [slow, setSlow] = useState(false);
    useEffect(() => { if (!armEnd) return; const t = setTimeout(() => setArmEnd(false), 3500); return () => clearTimeout(t); }, [armEnd]);
    useEffect(() => {
      setSlow(false);
      if (C.phase !== "connecting" && C.phase !== "reconnecting") return;
      const t = setTimeout(() => setSlow(true), 20000);
      return () => clearTimeout(t);
    }, [C.phase]);
    const status = C.phase === "paused" ? "The class is still on. Tap Rejoin voice to talk again."
      : C.phase === "idle" ? "Your voice is off."
      : C.phase === "waiting" ? (L.here ? who + " has the class open. Waiting for them to tap the green phone." : "Waiting for " + who + " to open the class.")
      : C.phase === "connecting" ? "Connecting " + who + "…"
      : C.phase === "reconnecting" ? "Reconnecting…"
      : who + " is in the class" + (C.peerMuted ? " (muted)" : "") + ".";
    async function toggleRec() {
      if (R.on) await classRec.stop();
      else { try { await classRec.start({ title: lessonTitle, lessonNo, student: studentId }); } catch (e) { toast("Couldn't start recording on this phone."); } }
    }
    return html`<div class="livepanel">
      <div class="lprow">
        <span class="livetag"><span class="livedot"></span>Live ${L.startedAt ? fmtDur((now - L.startedAt) / 1000) : ""}</span>
        <div class="segsmall" role="group" aria-label="Which board">
          <button class=${L.mode !== "write" ? "on" : ""} onClick=${() => live.setMode("tiles")}>Lesson board</button>
          <button class=${L.mode === "write" ? "on" : ""} onClick=${() => live.setMode("write")}>Writing board</button>
        </div>
      </div>
      <p class="lpstatus"><span class=${"pres" + (C.phase === "connected" ? " on" : "")}></span><span>${status}</span></p>
      <${ClassMembers} s=${s} studentId=${studentId}/>
      ${C.error ? html`<p class="err">${C.error}</p>` : null}
      ${slow && call.relay === false ? html`<p class="help">Voice is slow to connect. Phones on mobile data usually need the free voice relay: add CF_TURN_KEY_ID and CF_TURN_API_TOKEN in Netlify, then redeploy.</p>` : null}
      <div class="lprow">
        ${C.phase === "paused" || C.phase === "idle"
          ? html`<button class="btn slim" onClick=${rejoinVoice}><${Ic.phone} size=${18}/>Rejoin voice</button>`
          : html`<button class=${"tool" + (C.muted ? " on" : "")} onClick=${() => call.toggleMute()}>${C.muted ? html`<${Ic.micOff} size=${16}/>Unmute` : html`<${Ic.mic} size=${16}/>Mute`}</button>`}
        <button class=${"tool" + (R.on ? " recon" : "")} onClick=${toggleRec} aria-pressed=${R.on ? "true" : "false"}><span class=${"recdot small" + (R.on ? "" : " idle")}></span>${R.on ? "Recording " + fmtDur((now - R.since) / 1000) : "Record"}</button>
        <button class=${"chip2" + (L.sound ? " on" : "")} onClick=${() => live.setSound(!L.sound)} aria-pressed=${L.sound ? "true" : "false"}><${Ic.speaker} size=${16}/>Sounds on their phone</button>
        <button class=${"btn danger slim" + (armEnd ? " arm" : "")} onClick=${() => (armEnd ? live.endClass() : setArmEnd(true))}>${armEnd ? "Tap again to end" : "End class"}</button>
      </div>
    </div>`;
  }

  function LiveFloat({ s, onReturn, above }) {
    const L = useLive(), C = useCall(), R = useRec();
    const now = useTick(1000);
    const st = s.students.find(x => x.id === L.sid);
    const bits = [L.startedAt ? fmtDur((now - L.startedAt) / 1000) : ""];
    if (R.on) bits.push("recording");
    if (C.phase === "paused" || C.phase === "idle") bits.push("voice off");
    else if (C.phase === "connected") bits.push("talking");
    return html`<div class=${"livefloat" + (above ? " above" : "")} role="status">
      <span class="livedot"></span>
      <span class="lfmain"><b>Class with ${st ? st.name : "your student"}</b><small>${bits.filter(Boolean).join(", ")}</small></span>
      <button class="btn slim" onClick=${onReturn}>Return</button>
    </div>`;
  }

  // ---------- recordings (kept on this phone) ----------
  function recFileName(r) {
    const d = new Date(r.startedAt), pad = n => String(n).padStart(2, "0");
    const ext = String(r.mime || "").indexOf("mp4") >= 0 ? "mp4" : "webm";
    return "reading-class-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + (r.lessonNo ? "-lesson-" + r.lessonNo : "") + (r.part > 1 ? "-part-" + r.part : "") + "." + ext;
  }
  function Recordings() {
    const R = useRec();
    const [list, setList] = useState(null);
    const [arm, setArm] = useState(null);
    const [busy, setBusy] = useState(null);
    const load = () => classRec.all("recs").then(l => setList(l.sort((a, b) => b.startedAt - a.startedAt))).catch(() => setList([]));
    useEffect(() => { load(); const t = setInterval(load, 3000); return () => clearInterval(t); }, []);
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(null), 3500); return () => clearTimeout(t); }, [arm]);
    async function fileOf(r) {
      const parts = await classRec.chunks(r.id);
      if (!parts.length) throw new Error("empty");
      return new File(parts, recFileName(r), { type: r.mime || "video/webm" });
    }
    async function download(r) {
      setBusy(r.id);
      try {
        const f = await fileOf(r), url = URL.createObjectURL(f), a = document.createElement("a");
        a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
      } catch (e) { toast("That recording is empty."); }
      setBusy(null);
    }
    async function share(r) {
      setBusy(r.id);
      try {
        const f = await fileOf(r);
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: r.title });
        else { toast("Sharing isn't available here, so it's downloading instead."); await download(r); }
      } catch (e) { if (!e || e.name !== "AbortError") toast("Couldn't share. Try Download."); }
      setBusy(null);
    }
    async function del(r) {
      if (arm !== r.id) { setArm(r.id); return; }
      await classRec.delRec(r.id); setArm(null); load();
    }
    const mb = n => (n / 1048576).toFixed(n > 10485760 ? 0 : 1) + " MB";
    return html`<section class="list">
      ${list === null ? html`<div class="empty"><p>Loading…</p></div>`
        : !list.length ? html`<div class="empty"><p>No recordings yet. During a class, tap Record.</p></div>`
        : list.map(r => {
          const now = R.on && classRec.id === r.id;
          const note = now ? "Recording now" : r.status === "interrupted" ? "Stopped early, still usable" : "";
          return html`<div class="card recitem" key=${r.id}>
            <div class="rechead"><span class="num"><${Ic.film} size=${18}/></span>
              <span class="rowmain"><b>${(r.lessonNo ? "Lesson " + r.lessonNo + ": " : "") + (r.title || "Class")}${r.part > 1 ? ", part " + r.part : ""}</b>
              <small>${new Date(r.startedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}, ${fmtDur(r.secs)}, ${mb(r.size || 0)}${note ? ", " + note.toLowerCase() : ""}</small></span></div>
            ${now ? null : html`<div class="row2">
              <button class="btn" disabled=${busy === r.id} onClick=${() => download(r)}><${Ic.download} size=${18}/>Download</button>
              <button class="btn sec" disabled=${busy === r.id} onClick=${() => share(r)}><${Ic.send} size=${16}/>Share</button>
              <button class=${"btn danger" + (arm === r.id ? " arm" : "")} onClick=${() => del(r)}>${arm === r.id ? "Tap again to delete" : "Delete"}</button>
            </div>`}
          </div>`;
        })}
      <div class="note">
        <b>About recordings</b>
        <p>Recordings stay on this phone until you download or delete them. Download saves the video to your phone's Downloads; Share sends it straight to another app, like YouTube or WhatsApp.</p>
        <p>The video shows the board and the lesson title, with both your voices. Ask your student before you post it.</p>
      </div>
    </section>`;
  }

  const UPDATE_SQL = ((document.getElementById("update-sql") || {}).textContent || "").trim() + "\n";
  function UpdateBanner() {
    const [copied, setCopied] = useState(false);
    async function copy() {
      try { await navigator.clipboard.writeText(UPDATE_SQL); setCopied(true); }
      catch (e) { toast("Couldn't copy. Open “Show the code” and copy it from there."); }
    }
    return html`<div class="update">
      <b>One-time database update</b>
      <p class="help">The stick, voice classes and recording need one small change in Supabase. Copy this, paste it into SQL Editor, tap Run, then reopen this page.</p>
      <button class=${"btn" + (copied ? " sec" : "")} onClick=${copy}>${copied ? html`<${Ic.tick} size=${18}/>Copied` : "Copy update code"}</button>
      <details><summary>Show the code</summary><textarea class="sqlbox" readonly value=${UPDATE_SQL}></textarea></details>
    </div>`;
  }

  function Teacher({ s, ix }) {
    const [tab, setTab] = useState("students");
    const [openStudent, setOpenStudent] = useState(null);
    const [focus, setFocus] = useState(null);
    const [tLang, setTLang] = useState(() => { try { return localStorage.getItem("rc.tlang") || "en"; } catch (e) { return "en"; } });
    const [openLesson, setOpenLesson] = useState(null);
    const [fresh, setFresh] = useState(false);
    const L = useLive();
    const resumed = useRef(false);
    useEffect(() => { window.scrollTo(0, 0); }, [tab, openStudent, openLesson]);
    useEffect(() => { classRec.recover(); }, []);
    useEffect(() => {
      if (resumed.current || !s.hasLive) return;
      resumed.current = true;
      const now = Date.now();
      const rows = (s.live || []).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      for (const r of rows) if (now - (r.updatedAt || 0) >= LIVE_STALE) remove("live/" + r.id).catch(() => {});
      const row = rows.find(r => now - (r.updatedAt || 0) < LIVE_STALE && s.students.some(x => x.id === r.id));
      if (row && !live.st.on) live.resume(row);
    }, [s.live, s.hasLive]);
    const toClass = () => { setOpenLesson(null); setFresh(false); setOpenStudent(L.sid); };
    const float = L.on && openStudent !== L.sid ? html`<${LiveFloat} s=${s} above=${!!openStudent} onReturn=${toClass}/>` : null;
    let body = null;
    if (openStudent) {
      const st = s.students.find(x => x.id === openStudent);
      const v = st ? viewOf(s, st.lang) : null;
      if (st) REC_LANG = st.lang || "en";
      if (st) body = html`<${Room} key=${st.id + (focus ? focus.msg : "")} s=${v.s} ix=${v.ix} student=${st} mode="teacher" startEditing=${fresh} focus=${focus} onBack=${() => { setOpenStudent(null); setFresh(false); setFocus(null); }}/>`;
    }
    if (!body && openLesson) {
      const v = viewOf(s, tLang), l = v.s.lessons.find(x => x.id === openLesson);
      REC_LANG = tLang;
      if (l) body = html`<${LessonEditor} key=${l.id + tLang} s=${v.s} ix=${v.ix} lesson=${l} onBack=${() => setOpenLesson(null)}/>`;
    }
    if (!body) {
      const unreadTotal = s.msgs.filter(m => m.from === "student" && !m.seen).length;
      const tabBtn = (id, label, dot) => html`<button role="tab" aria-selected=${tab === id ? "true" : "false"} class=${tab === id ? "on" : ""} onClick=${() => setTab(id)}>${label}${dot ? html`<span class="segdot" aria-label="New messages"></span>` : null}</button>`;
      body = html`<div class="page">
        <header class="top">
          <h1>Reading class</h1>
          <div class="seg" role="tablist">${tabBtn("students", "Students", unreadTotal)}${tabBtn("lessons", "Lessons")}${tabBtn("recordings", "Recordings")}</div>
        </header>
        ${s.needsUpdate ? html`<${UpdateBanner}/>` : null}
        ${tab === "students" ? html`<${PushCard}/><${Questions} s=${s} onOpen=${(id, f) => { setFresh(false); setFocus(f); setOpenStudent(id); }}/><${StudentsList} s=${s} onOpen=${(id, isNew) => { setFresh(!!isNew); setFocus(null); setOpenStudent(id); }}/>`
          : tab === "lessons" ? (() => { const v = viewOf(s, tLang); REC_LANG = tLang; return html`<${LessonsList} s=${v.s} ix=${v.ix} onOpen=${setOpenLesson} lang=${tLang} onLang=${l => { setTLang(l); try { localStorage.setItem("rc.tlang", l); } catch (e) {} }}/>`; })()
          : html`<${Recordings}/>`}
        ${float ? html`<div class="floatspace"></div>` : null}
      </div>`;
    }
    return html`${body}${float}`;
  }

  function StudentHome({ s, ix }) {
    const st = s.students.find(x => x.id === s.sid);
    if (!st) return html`<${NoLink}/>`;
    if (!s.lessons.length) return html`<${Waiting}/>`;
    const v = viewOf(s, st.lang);
    return html`<${Room} key=${st.id} s=${v.s} ix=${v.ix} student=${st} mode="student"/>`;
  }

  function App() {
    const s = useStore();
    const ix = useMemo(() => buildSound(s.recs, s.lessons), [s.recs, s.lessons]);
    let body;
    if (s.phase === "loading") body = html`<${Loading}/>`;
    else if (s.phase === "setup") body = html`<${Setup}/>`;
    else if (s.phase === "signin") body = html`<${SignIn} s=${s}/>`;
    else if (s.phase === "nolink") body = html`<${NoLink} hint=${s.hint}/>`;
    else if (s.phase === "notteacher") body = html`<${NotTeacher} email=${s.email}/>`;
    else if (s.phase === "offline") body = html`<${Offline}/>`;
    else if (s.phase === "error") body = html`<${ErrorScreen} err=${s.err}/>`;
    else if (s.isOwner) body = html`<${Teacher} s=${s} ix=${ix}/>`;
    else body = html`<${StudentHome} s=${s} ix=${ix}/>`;
    return html`${body}${s.toast ? html`<div class="toast" role="status" key=${s.toast.id}>${s.toast.text}</div>` : null}`;
  }

  window.__rc = { call, live, classRec, wb, tilePlayer };
  window.__kfArt = { kfBody, KF_CHARS, kfHit };
  window.__kfApi = { kfPress, kfStep, kfNew, kfSnd, kfAnn, annRec };
  window.__ink = { hitInk, inkGroup };
  window.__lang = { viewOf, saveExpl, saveTileRec, set: l => { REC_LANG = l; }, get: () => REC_LANG, store };
  root.innerHTML = "";
  render(html`<${App}/>`, root);
  boot();
})();
</script>
</body>
</html>
