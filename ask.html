<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ask me anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --a: #833AB4; --b: #FD1D1D; --c: #FCB045; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Poppins, system-ui, sans-serif; background: linear-gradient(160deg, var(--a), var(--b) 55%, var(--c)); color: #111; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; min-height: 100dvh; }
  .card { width: 100%; max-width: 440px; background: #fff; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; }
  .top { padding: 22px 22px 18px; text-align: center; background: linear-gradient(90deg, var(--a), var(--b), var(--c)); color: #fff; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .2px; }
  .top p { margin: 6px 0 0; font-size: 14px; opacity: .92; font-weight: 500; }
  .body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .kinds { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .kinds button { font: 700 14px Poppins, sans-serif; border: 2px solid #E5E7EB; background: #fff; color: #374151; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .kinds button.on { border-color: transparent; background: #111; color: #fff; }
  textarea { width: 100%; min-height: 130px; border: 0; background: #F3F4F6; border-radius: 18px; padding: 16px; font: 600 18px/1.4 Poppins, sans-serif; color: #111; resize: vertical; outline: none; }
  textarea:focus { box-shadow: 0 0 0 3px rgba(131,58,180,.35); }
  .send { font: 800 17px Poppins, sans-serif; border: 0; border-radius: 16px; padding: 15px; color: #fff; background: linear-gradient(90deg, var(--a), var(--b)); cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .note { margin: 0; text-align: center; font-size: 13px; color: #6B7280; font-weight: 500; }
  .count { text-align: right; font-size: 12px; color: #9CA3AF; margin-top: -8px; }
  .done { text-align: center; padding: 34px 22px; }
  .done b { display: block; font-size: 44px; }
  .done h2 { margin: 8px 0 6px; font-size: 22px; }
  .done p { margin: 0 0 18px; color: #4B5563; }
  .again { font: 700 15px Poppins, sans-serif; border: 2px solid #111; background: #fff; border-radius: 14px; padding: 11px 18px; cursor: pointer; }
  .hp { position: absolute; left: -5000px; width: 1px; height: 1px; opacity: 0; }
  .err { color: #B91C1C; text-align: center; font-weight: 600; margin: 0; font-size: 14px; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="top"><h1 id="title">Ask me anything</h1><p id="sub">Send a question, news or a confession. Nobody sees who you are.</p></div>
  <form class="body" id="f">
    <div class="kinds" role="group" aria-label="What are you sending">
      <button type="button" class="on" data-k="question">❓ Question</button>
      <button type="button" data-k="news">📰 News</button>
      <button type="button" data-k="confession">🤫 Confession</button>
    </div>
    <textarea id="t" maxlength="600" placeholder="Type here…" aria-label="Your message"></textarea>
    <div class="count" id="n">0 / 600</div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="e" hidden></p>
    <button class="send" id="s" type="submit" disabled>Send anonymously</button>
    <p class="note">No name, no account, no sign-up. Only the message is sent.</p>
  </form>
</main>
<script>
(function () {
  // where messages go: this site's helper, or the address written into your own copy of this page
  var API = window.ASK_API || "/.netlify/functions/ask";
  var q = new URLSearchParams(location.search), to = window.ASK_TO || q.get("to") || "";
  if (to) { document.getElementById("title").textContent = "Ask " + to + " anything"; document.title = "Ask " + to + " anything"; }
  var kind = "question", t = document.getElementById("t"), s = document.getElementById("s"), n = document.getElementById("n"), e = document.getElementById("e");
  document.querySelectorAll(".kinds button").forEach(function (b) { b.onclick = function () { document.querySelectorAll(".kinds button").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); kind = b.dataset.k; t.placeholder = kind === "news" ? "What happened?" : kind === "confession" ? "Your confession…" : "Your question…"; }; });
  t.oninput = function () { n.textContent = t.value.length + " / 600"; s.disabled = t.value.trim().length < 2; };
  document.getElementById("f").onsubmit = function (ev) {
    ev.preventDefault(); if (t.value.trim().length < 2) return;
    s.disabled = true; s.textContent = "Sending…"; e.hidden = true;
    fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: t.value, kind: kind, hp: document.getElementById("hp").value }) })
      .then(function (r) { if (!r.ok) throw new Error("x"); return r.json(); })
      .then(function () {
        document.getElementById("card").innerHTML = '<div class="done"><b>💌</b><h2>Sent!</h2><p>It went with no name attached. Watch out for the video.</p><button class="again" onclick="location.reload()">Send another</button></div>';
      })
      .catch(function () { e.textContent = "It didn't send. Check your connection and try again."; e.hidden = false; s.disabled = false; s.textContent = "Send anonymously"; });
  };
})();
</script>
</body>
</html>
